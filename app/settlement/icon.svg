<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    **정산 화면의 브라우저 아이콘** — 사장님 2026-09-10
      「브라우저 아이콘 색깔을 바꾸든 해야겠다 — 색깔이랑 그게 **상품찾기랑 같아서 헷갈리네**」

    ★앱 아이콘(public/icon.svg)은 «남색 + 흰 체크»다. 같은 남색 계열로 만들면
      탭 줄에서 여전히 못 가른다 — 탭 아이콘은 16px 라 «색»으로만 갈린다.
    ⇒ **색을 갈랐다.** 바탕 = 원본 팔레트의 초록(--초록 #1f7a3d) — 돈·장부의 색이고
      남색과 명도·색상이 둘 다 멀어 16px 에서도 한눈에 갈린다.
    ★골격은 «같은 집안»으로 둔다 — 둥근 사각(rx 96) + 흰 글리프. 앱 것과 형제로 보이게.

    ⚠ 체크는 안 쓴다 — 앱 아이콘이 이미 체크다. 같은 글리프를 색만 바꿔 두면
      「같은 것의 다른 상태」로 읽힌다. 정산은 다른 화면이지 다른 상태가 아니다.
    ⇒ 글리프 = **장부 줄** — 위 두 줄은 항목, 아래 굵은 줄은 «합계». 정산이 하는 일 그대로다.

    정중앙 규격: 잉크 x = 128…384(중심 256) · y = 168…356(중심 262 — 합계 줄이 아래라 6px 처짐을
    감안해 위 줄을 168 에서 시작했다).
  -->
  <rect width="512" height="512" rx="96" fill="#1f7a3d"/>
  <rect x="128" y="168" width="256" height="36" rx="18" fill="#ffffff"/>
  <rect x="128" y="240" width="176" height="36" rx="18" fill="#ffffff" opacity=".75"/>
  <rect x="128" y="320" width="256" height="44" rx="22" fill="#ffffff"/>
</svg>
