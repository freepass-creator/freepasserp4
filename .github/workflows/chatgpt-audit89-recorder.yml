name: ChatGPT Audit 89 Recorder

on:
  push:
    paths:
      - '.github/workflows/chatgpt-audit89-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record audit 89
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          if ! grep -q 'ChatGPT audit (89)' docs/AI-SSOT-AUDIT-LOG.md; then
            cat docs/ai-ssot-audit/.audit89-central-fragment.md >> docs/AI-SSOT-AUDIT-LOG.md
          fi
          if ! grep -q '^# Claude 실행 오더 — Audit (89) override$' CLAUDE-AUDIT.md; then
            cat docs/ai-ssot-audit/.audit89-claude-prefix.md CLAUDE-AUDIT.md > /tmp/CLAUDE-AUDIT.md
            mv /tmp/CLAUDE-AUDIT.md CLAUDE-AUDIT.md
          fi
          git rm --ignore-unmatch docs/ai-ssot-audit/.audit89-central-fragment.md
          git rm --ignore-unmatch docs/ai-ssot-audit/.audit89-claude-prefix.md
          git rm --ignore-unmatch .github/workflows/chatgpt-audit89-recorder.yml
          git config user.name 'chatgpt-auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add CLAUDE-AUDIT.md docs/AI-SSOT-AUDIT-LOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(audit): record audit 89 F86 repin cross-audit red'
          git push origin HEAD:main
