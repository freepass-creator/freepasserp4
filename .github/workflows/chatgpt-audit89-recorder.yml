**판정: MATERIAL IMPLEMENTATION CHANGE / CLAUDE ENTRY POINT STALE / canonical source authority unchanged / full production-run verification pending.**

- Audit (88) 이후 PR #446 merge `45cec2e30eb715d5c027d9923250ae79d5e7f461`이 fixed-F86 engine으로 production repin을 시도했지만 manual ERP5 run `35559550004`은 `원천 계약 검사`에서 failure했고 이후 source recollection/ingest/snapshot/F01/F86 writes와 audits가 모두 skipped됐다. 따라서 그 run은 production write 증거가 아니다.
- PR #447 / current application merge `6691b0f27c3df91ab07f3e0078903c69a1471f5e`가 production engine ref를 **`0c31f98d412d9e006e1894804ebe767fc91683f1`**로 전진시키고 workflow, AI Core shadow pipeline/receipt revision, source-contract validated-engine allowlist, schedule map을 같은 revision으로 정렬했다. Current `.github/workflows/erp5-ssot-refresh.yml`과 `scripts/check-inventory-source-contract.mts`가 이 pin을 명시한다.
- 이 engine은 F86 projection 의미를 실제로 바꾼다. 하허호 F86의 첫 네 탭은 정확히 **`상품리스트 → 손오공상품 → 픽업구독 → 오플구독`**으로 고정되고 날짜·시각·대수 suffix를 붙이지 않는다. RP012 손오공은 픽업이 아닌 재고(중고렌트 포함 + 오공구독)를 `손오공상품`으로 묶고, T카 픽업 외부재고는 `픽업구독`, RP023 오토플러스는 `오플구독`으로 간다. 이 special-tab 차량은 뒤의 일반 공급사 탭에 중복하지 않는다. F86 freshness는 고정 탭명 timestamp가 아니라 Drive `modifiedTime`을 사용한다.
