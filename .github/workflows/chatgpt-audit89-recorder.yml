# ChatGPT independent SSOT audit 89 — production ERP5 repin to fixed F86 low-credit tabs

Date: 2026-09-21 KST
Scope: independent audit only; no application code or business logic changes.

## Material finding

Audit (88)'s scheduler/recovery finding remains open, but its unchanged-Core-SSOT summary became stale after two production-repin merges.

1. PR #446 merge `45cec2e30eb715d5c027d9923250ae79d5e7f461` attempted the fixed-F86 repin. Manual ERP5 run `35559550004` failed at `원천 계약 검사`; all write/publish/audit steps after that gate were skipped. This run cannot prove production publication.
2. PR #447 / current application merge `6691b0f27c3df91ab07f3e0078903c69a1471f5e` repinned `.github/workflows/erp5-ssot-refresh.yml` to engine `0c31f98d412d9e006e1894804ebe767fc91683f1` and aligned AI Core shadow pipeline/receipt revision, the validated-engine guard, and schedule-map documentation.
3. Current main `SSOT Source Contract` run `35560310869` and generic `CI` run `35560310925` are success. Manual ERP5 run `35560321553` on the new pin had passed checkout, OIDC, source contract, source recollection, Tcar option audit and settlement lock and was in the ingest step at the audit snapshot; downstream fixed snapshot/F01/F86/freshness/cross-audit completion was not yet proven.

## Current canonical/projection contract

- Canonical inventory registry remains 24 sources.
- RP012 Sonogong remains `erp_api` at `https://sokrc.com/api`; its Google Sheet is projection/policy support, not inventory authority.
- RP023 AutoPlus remains `website` at `https://www.reborncar.co.kr`; its sheet is projection, not inventory authority.
- F01 and F86 continue to derive from the same Atom/fixed snapshot and common sales-row/cell builder. F01 does not read F86 and F86 does not use F01 values as authority.
- F01 tab assignment remains `상품리스트 / 오공구독 / 픽업구독 / 오플구독`.
- F86 now has fixed first four tabs `상품리스트 / 손오공상품 / 픽업구독 / 오플구독` with no time/count suffix. RP012 non-pickup stock, including `중고렌트` and `오공구독`, is projected to `손오공상품`; Tcar pickup external stock to `픽업구독`; RP023 to `오플구독`. `손오공상품` reuses the F01 `오공구독` column block. Special-tab vehicles are not duplicated into later provider tabs.
- F86 freshness for fixed names now uses Google Drive document `modifiedTime` instead of extracting a timestamp from the base-tab title.

## Unchanged boundaries

- `mirror-sync.yml` and `sales-erp-hourly.yml` remain retired from automatic scheduling and are manual dry-run only.
- RTDB remains non-canonical/retired for runtime settlement; the fail-closed runtime guard remains in place.
- Audit (88) native cadence/recovery continuity HOLD and monitor reconciliation WATCH are not resolved by this repin.

## Claude handoff

Treat the Audit (88) old-pin/F86-special-tab wording as superseded by this entry. Preserve the `0c31f98d...` production pin and fixed F86 tab contract unless a later evidence-based decision changes them. Do not rename F01 `오공구독` merely to mirror F86 `손오공상품`; they are distinct projections over the same canonical Atom/snapshot. Obtain a completed production-equivalent green run through F01/F86 freshness and cross-audit before calling the repin operationally verified. Keep scheduler/recovery remediation separate from canonical business semantics.
