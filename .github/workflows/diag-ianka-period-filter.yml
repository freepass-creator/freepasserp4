name: 이안카 기간필터 요금 흔적 진단2(읽기전용, 수동)

# scripts/diag-ianka-period-filter.mts — RSC 재요청 방식으로 기간(1~60개월) 요금 흔적을 찾는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 기간필터 요금 흔적 진단
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-period-filter.mts
