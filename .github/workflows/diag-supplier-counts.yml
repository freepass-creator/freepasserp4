name: 공급사별 재고 검수표(읽기전용, 수동)

# scripts/audit-supplier-counts.mts — 「시트에 몇 대인데 우리 목록엔 몇 대인가」를
# 공급사별로 나란히 놓는다. 기존 감사 스크립트를 그대로 돌린다(새 로직 없음).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 자격증명 준비
        env:
          SHEETS_SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SHEETS_SA" || { echo '::error::GOOGLE_SA_JSON 누락'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SHEETS_SA" > tmp/firebase-auth/sa.json
      - name: 공급사별 재고 검수표
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sa.json
        run: npx tsx scripts/audit-supplier-counts.mts
      - name: 자격증명 삭제
        if: always()
        run: rm -rf tmp/firebase-auth
