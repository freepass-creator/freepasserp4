name: ChatGPT Audit 99 Append

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit99-append.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit 99 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          if ! grep -Fq 'ChatGPT audit (99): Sheet Contract' docs/AI-SSOT-AUDIT-LOG.md; then
            printf '%s' '와' | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          fi
          rm -f .github/workflows/chatgpt-audit99-append.yml
          git add docs/AI-SSOT-AUDIT-LOG.md .github/workflows/chatgpt-audit99-append.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(audit): append audit 99 central ledger'
          git push origin HEAD:main
