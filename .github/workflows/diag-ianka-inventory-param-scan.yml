name: 이안카 /api/inventory·/api/rates 파라미터 재탐색(읽기전용, 수동)

# scripts/diag-ianka-inventory-param-scan.mts — rate-app-*.js 번들 실측에서 찾은
# fetch(`/api/inventory${n}`)·fetch(`/api/rates`)(파라미터 없음) 호출을 그대로 재현한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 inventory·rates 파라미터 재탐색
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-inventory-param-scan.mts
