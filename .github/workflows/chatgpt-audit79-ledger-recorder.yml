name: ChatGPT audit 79 central-ledger recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit79-ledger-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append audit 79 correction to central ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          audit_path = Path('docs/AI-SSOT-AUDIT-LOG.md')
          marker = 'ChatGPT audit (79): stale audit-78 central-ledger-gap claim corrected'
          entry = base64.b64decode('').decode('utf-8')
          text = audit_path.read_text(encoding='utf-8')
          if marker not in text:
              audit_path.write_text(text.rstrip() + '\n\n' + entry.rstrip() + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/chatgpt-audit79-ledger-recorder.yml
          git config user.name "chatgpt-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/AI-SSOT-AUDIT-LOG.md
          git commit -m "docs(audit): append audit 79 correction to central ledger"
          git push origin HEAD:main
