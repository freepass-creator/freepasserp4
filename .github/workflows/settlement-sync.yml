name: 정산 접수 반영(1시간)

# ★사장님 2026-08-25 「깃허브로 반영될수 있게끔 로직 짜봐」.
#   강지수 팀장이 「프리패스 당월 계약접수」에 차번을 올리면 → 정산원장으로 나르고
#   → 공급사 시트 상태를 「계약중」으로 세운다. 사장님 PC 가 꺼져 있어도 돌아야 하므로 여기서 돈다.
#
# ★**접수일은 «그 차번을 처음 본 날»이다.** 이 워크플로가 도는 주기만큼만 정확하다 —
#   그래서 하루 한 번이 아니라 **영업시간에 1시간마다** 돈다. 정산월·수수료가 이 날짜에서 나온다.
#   한 번 박힌 접수일은 다시 안 쓴다(sync-intake-to-ledger 가 «비었을 때만» 적는다).
#
# ⚠ schedule 은 **기본 브랜치(main)** 에서만 돈다. 이 파일이 main 에 있어야 하고
#   `GOOGLE_SA_JSON` 시크릿이 있어야 한다. main 이 낡으면 옛 코드가 돈다 —
#   실측 2026-08-21: main 이 94커밋 낡아 정제시트 갱신이 30분마다 죽고 있었다.
# ⚠ 쓰기(구글시트)를 한다. 실패를 삼키지 않는다 — Actions 기록에 빨간 불로 남는다.

on:
  schedule:
    # 영업시간 09:05~18:05 KST 매시(UTC 00:05~09:05). 저녁·새벽은 안 돈다 — 그때는 아무도 안 올린다.
    - cron: '5 0-9 * * 1-6'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓸까(체크 안 하면 미리보기만)'
        type: boolean
        default: false

concurrency:
  # 같은 원장을 두 번이 겹쳐 쓰면 같은 차가 두 줄로 들어간다. 앞엣것이 끝날 때까지 기다린다.
  group: settlement-sync
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::GOOGLE_SA_JSON 시크릿이 없다. 리포 Settings → Secrets 에 넣어라."
            exit 1
          fi
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json

      # ① 접수 시트 → 정산원장. 접수일·모델명·공급사·반영·확인을 채운다.
      #    ⚠ **이 단계는 지금 전부 실패한다**(2026-09-16 실측: 25회 연속). 별도 시트
      #      「프리패스 당월 계약접수」를 Drive 에서 «이름 완전일치»로 찾는데,
      #      `open-intake-desk.mts` 가 옛 접수 시트를 지우는 대신 이름에 `[구버전·폐기]` 를
      #      **붙여서** 막는다 — 이름이 바뀐 순간 완전일치가 깨져 영구히 죽는다.
      #      고치려면 접수 입구를 F04 「접수」 탭으로 다시 배선해야 하는데,
      #      정산이 시트에 남는지 ERP(`app/settlement`)로 가는지가 먼저다 — **보류.**
      - name: 접수 시트 반영
        run: |
          npx tsx scripts/sync-intake-to-ledger.mts ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      # ② 원장에 손으로 적은 줄도 같이 본다 — 팀장이 원장에 바로 적는 날이 있다.
      #    ⚠ 이 도구가 보는 「정산」 탭은 **정본 탭 목록에 없다**(가르기 전 옛 이름).
      #      없는 탭을 읽고 「0줄」로 조용히 끝난다 — 같은 이유로 **보류.**
      - name: 원장에서 계약중 세우기
        run: |
          npx tsx scripts/sync-contract-from-ledger.mts ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      # ③ 서식·용어 다듬기.
      #    ★**스케줄에서는 쓰지 않는다**(2026-09-16). 이 둘이 손대는 「접수」·「완납실적」은
      #      **사람이 손으로 편집하는 탭**이고, 이 둘은 그 탭의 «값과 서식»을 덮어쓴다.
      #      사람 작업을 덮어쓰는 동작이 「매시 자동」이면 안 된다 — 하허호 8월 탭 사고가 그것이었다
      #      (사람이 고쳐 놓은 것을 기계가 다시 찍어 덮었다 · docs/정산시트-매뉴얼.md).
      #      그래서 `--apply` 를 **여기에 박아 두지 않는다.** 스케줄이면 dry-run,
      #      쓰기는 사람이 workflow_dispatch 에서 apply 를 켤 때만 된다.
      - name: 서식·상태 용어 다듬기
        run: |
          npx tsx scripts/unify-ledger-state.mts ${{ inputs.apply && '--apply' || '' }}
          npx tsx scripts/format-ledger.mts ${{ inputs.apply && '--apply' || '' }}

      - name: 자격증명 지우기
        if: always()
        run: rm -rf tmp/firebase-auth
