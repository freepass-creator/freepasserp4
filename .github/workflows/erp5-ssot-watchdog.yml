name: ERP5 SSOT 예약 누락 감시

# 이 workflow는 운영 데이터에 직접 쓰지 않는다. 최근 canonical 회차가 없을 때
# erp5-ssot-refresh.yml의 동일 writer를 repository_dispatch로 다시 깨울 뿐이다.
on:
  schedule:
    # canonical :17 이후 25분에 확인한다.
    - cron: '42 * * * *'
  workflow_dispatch:
    inputs:
      force_recovery:
        description: '최근 성공 여부와 관계없이 복구 이벤트를 한 번 보내 통합 경로를 검증'
        type: boolean
        default: false

concurrency:
  group: erp5-ssot-watchdog
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 최근 canonical 회차 확인
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RECOVERY: ${{ inputs.force_recovery || false }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh run list --repo "${{ github.repository }}" --workflow erp5-ssot-refresh.yml --limit 30 --json databaseId,createdAt,status,conclusion,event)"
          export RUNS FORCE_RECOVERY
          node <<'NODE'
          const runs = JSON.parse(process.env.RUNS || '[]');
          const cutoff = Date.now() - 90 * 60 * 1000;
          const fullRefreshEvents = new Set(['schedule', 'repository_dispatch', 'push', 'workflow_run']);
          const healthy = runs.find((run) => {
            const recent = Date.parse(run.createdAt) >= cutoff;
            const fullRefresh = fullRefreshEvents.has(run.event);
            return recent && fullRefresh && (run.status === 'queued' || run.status === 'in_progress' || run.conclusion === 'success');
          });
          const forced = process.env.FORCE_RECOVERY === 'true';
          const recover = forced || !healthy;
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `recover=${recover}\n`);
          if (healthy) console.log(`최근 canonical 회차: ${healthy.databaseId} ${healthy.status}/${healthy.conclusion || '-'} ${healthy.event}`);
          console.log(forced ? '수동 강제 복구 검증' : recover ? '90분 내 정상 canonical 회차 없음' : '복구 불필요');
          NODE

      - name: 동일 canonical writer 복구 호출
        if: steps.health.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=erp5_refresh_watchdog
          echo 'erp5-ssot-refresh.yml repository_dispatch 요청 완료'
