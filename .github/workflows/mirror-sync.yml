name: 정제시트 갱신(30분)

# ★사장님 2026-08-18 — 「아이카·오토플러스·아이언·이안카 정제시트 만들어서 실시간 연동시켜놓을게」
#   «실시간» = 이 워크플로가 30분마다 원본(공급사 시트·ironrentcar.com) → 정제시트(「○○ 프리패스 재고」)를 갱신한다.
#   무엇을 어디서 어디로 옮기나는 `lib/domain/mirror-sources.ts` 한 표다.
# ★2026-09-19 — canonical ERP5 source registry와 별개인 legacy mirror writer는 RETIRED.
#   특히 RP023 old Google Sheet source가 RebornCar canonical과 갈리므로 자동 schedule/운영 쓰기를 제거한다.
#   workflow_dispatch는 **dry-run 진단만** 허용한다.
on:
  workflow_dispatch:

concurrency:
  # 발행 워크플로(sheet-sync)와 같은 그룹 — 같은 시트를 동시에 쓰지 않는다.
  group: sheet-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}

      - name: RETIRED mirror dry-run 진단
        run: npx tsx scripts/sync-mirror-all.mts

      - name: 자격증명 지우기
        if: always()
        uses: ./.github/actions/cleanup-credentials
