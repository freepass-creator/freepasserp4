name: 정제시트 갱신(30분)

# ★사장님 2026-08-18 — 「아이카·오토플러스·아이언·이안카 정제시트 만들어서 실시간 연동시켜놓을게」
#   «실시간» = 이 워크플로가 30분마다 원본(공급사 시트·ironrentcar.com) → 정제시트(「○○ 프리패스 재고」)를 갱신한다.
#   무엇을 어디서 어디로 옮기나는 `lib/domain/mirror-sources.ts` 한 표다.
# ⚠ schedule 은 **기본 브랜치(main)** 에서만 돈다. 이 파일이 main 에 있어야 하고 `GOOGLE_SA_JSON` 시크릿이 있어야 한다.
# ⚠ 쓰기(구글시트)를 한다. 실패를 삼키지 않는다 — Actions 기록에 빨간 불로 남는다.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓸까(체크 안 하면 미리보기만)'
        type: boolean
        default: false

concurrency:
  # 발행 워크플로(sheet-sync)와 같은 그룹 — 같은 시트를 동시에 쓰지 않는다.
  group: sheet-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::GOOGLE_SA_JSON 시크릿이 없다. 리포 Settings → Secrets 에 넣어라."
            exit 1
          fi
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json

      - name: 정제시트 일괄 갱신
        run: |
          npx tsx scripts/sync-mirror-all.mts             ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      - name: 자격증명 지우기
        if: always()
        run: rm -rf tmp/firebase-auth
