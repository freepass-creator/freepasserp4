name: ChatGPT audit 29 encoding fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit29-encoding-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair audit 29 text byte-safely
        shell: bash
        env:
          AUDIT29_B64: ''
          DETAIL_B64: ''
        run: |
          python3 -c "from pathlib import Path; import base64,os; p=Path('docs/AI-SSOT-AUDIT-LOG.md'); d=p.read_bytes(); m=b'## 2026-09-17(29)'; i=d.rfind(m); assert i>0; sep=d.rfind(b'\n---\n',0,i); assert sep>=0; clean=base64.b64decode(os.environ['AUDIT29_B64']); p.write_bytes(d[:sep+1]+clean)"
          python3 -c "from pathlib import Path; import base64,os; Path('docs/ai-ssot-audit/2026-09-17-chatgpt-audit29-sales-tab-kind-staging.md').write_bytes(base64.b64decode(os.environ['DETAIL_B64']))"
          python3 -c "from pathlib import Path; import base64,os; p=Path('CLAUDE-AUDIT.md'); d=p.read_bytes(); old=base64.b64decode('7IOIIOydtOuuhOycvOuhnA=='); new=base64.b64decode('7IOIIOydtOumhOycvOuhnA=='); assert old in d; p.write_bytes(d.replace(old,new,1))"
          rm -f .github/workflows/chatgpt-audit29-encoding-fix-once.yml
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'noreply@openai.com'
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-17-chatgpt-audit29-sales-tab-kind-staging.md CLAUDE-AUDIT.md .github/workflows/chatgpt-audit29-encoding-fix-once.yml
          git commit -m 'audit: repair audit 29 text encoding'
          git push origin HEAD:main
