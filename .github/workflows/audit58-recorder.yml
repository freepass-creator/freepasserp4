name: audit58 one-shot recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit58-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Record audit 58
        env:
          ENTRY_B64: ''
          DETAIL_B64: ''
          CLAUDE_B64: ''
        run: |
          python -c "import base64,os,pathlib; p=pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md'); t=p.read_text(); e=base64.b64decode(os.environ['ENTRY_B64']).decode(); marker='## 2026-09-19(58)'; p.write_text(t if marker in t else t+e); pathlib.Path('docs/ai-ssot-audit/2026-09-19-chatgpt-audit58-post-green-schedule-gap.md').write_text(base64.b64decode(os.environ['DETAIL_B64']).decode()); pathlib.Path('CLAUDE-AUDIT.md').write_text(base64.b64decode(os.environ['CLAUDE_B64']).decode())"
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-19-chatgpt-audit58-post-green-schedule-gap.md CLAUDE-AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(audit): record audit58 post-green schedule gap'
            git push origin HEAD:main
          fi
