name: ChatGPT audit62 recorder

on:
  push:
    branches:
      - chatgpt/audit62-central-log

permissions:
  contents: write

jobs:
  append-audit:
    if: ${{ !contains(github.event.head_commit.message, 'append audit62 central log') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Append audit62 once
        shell: bash
        run: |
          set -euo pipefail
          LOG='docs/AI-SSOT-AUDIT-LOG.md'
          if grep -Fq '## 2026-09-19(62) — ChatGPT 독립 감사: first safe scheduled slots delayed-or-missing' "$LOG"; then
            echo 'audit62 already present; no-op'
            exit 0
          fi
          cat >> "$LOG" <<'EOF'

---

