name: ERP5 SSOT 경계 감사(수동)

on:
  workflow_dispatch:

concurrency:
  group: erp5-ssot-boundary-audit
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ERP5 canonical SSOT 경계 검사
        run: |
          npm run check:erp5-firebase
          npm run sim:erp5-product-ssot
          npm run sim:erp5-vehicle-master-ssot
          npx tsx scripts/test-ssot-adapters.mts
          npx tsx scripts/sim-product-master-sheet.mts
          npx tsx scripts/sim-deposit-cap.mts
      - name: 안내
        run: |
          echo 'freepasserp5만 canonical writer다.'
          echo '이 workflow는 감사 전용이며 Firebase/Google Sheets에 쓰지 않는다.'
