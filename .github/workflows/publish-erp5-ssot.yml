name: ERP5 Firestore 상품·차종 SSOT 게시

on:
  workflow_dispatch:
    inputs:
      publish_products:
        description: '상품 SSOT 게시 경로 실행'
        type: boolean
        default: false
      publish_vehicle_master:
        description: '차종마스터 SSOT 게시 경로 실행'
        type: boolean
        default: true
      apply:
        description: 'ERP5에 검증 버전 쓰기'
        type: boolean
        default: false
      vehicle_master_version:
        description: '상품이 참조할 차종마스터 version ID'
        type: string
        required: false
      version:
        description: '버전 ID (비우면 실행시각)'
        type: string
        required: false

concurrency:
  group: erp5-firestore-ssot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Encar 차종 참조본 체크아웃
        if: ${{ inputs.publish_vehicle_master }}
        uses: actions/checkout@v4
        with:
          repository: freepass-creator/vehicle-master
          path: tmp/vehicle-master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 공개 경계 회귀검사
        run: |
          npm run sim:erp5-product-ssot
          npm run sim:erp5-vehicle-master-ssot
          npx tsx scripts/test-ssot-adapters.mts
          npx tsx scripts/sim-product-master-sheet.mts
          npx tsx scripts/sim-deposit-cap.mts
          npm run check:erp5-firebase
      - name: 원천 읽기 자격증명 준비
        if: ${{ inputs.publish_products || inputs.publish_vehicle_master }}
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SA" || { echo '::error::GOOGLE_SA_JSON 시크릿이 없습니다.'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json
      - name: Google Sheet + Encar → ERP5 차종마스터 버전 게시
        if: ${{ inputs.publish_vehicle_master }}
        env:
          ERP5_FIREBASE_WRITER_SERVICE_ACCOUNT_JSON: ${{ secrets.ERP5_FIREBASE_WRITER_SERVICE_ACCOUNT_JSON }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then VERSION="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          ARGS=("--version=$VERSION" "--encar=tmp/vehicle-master/dist/vehicle-master.flat.json")
          if [ "$INPUT_APPLY" = "true" ]; then ARGS+=("--apply"); fi
          if [ "$INPUT_APPLY" = "true" ] && [ -z "$ERP5_FIREBASE_WRITER_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::ERP5 writer 시크릿이 없습니다.'
            exit 1
          fi
          npx tsx scripts/publish-vehicle-master-to-erp5-firestore.mts "${ARGS[@]}"
      - name: 공급사 원천 + Google 상품마스터 → ERP5 상품 버전 게시
        if: ${{ inputs.publish_products }}
        env:
          ERP5_FIREBASE_WRITER_SERVICE_ACCOUNT_JSON: ${{ secrets.ERP5_FIREBASE_WRITER_SERVICE_ACCOUNT_JSON }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VEHICLE_VERSION: ${{ inputs.vehicle_master_version }}
          INPUT_PUBLISH_VEHICLE: ${{ inputs.publish_vehicle_master }}
          INPUT_APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then VERSION="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          VEHICLE_VERSION="$INPUT_VEHICLE_VERSION"
          if [ -z "$VEHICLE_VERSION" ] && [ "$INPUT_PUBLISH_VEHICLE" = "true" ]; then VEHICLE_VERSION="$VERSION"; fi
          ARGS=("--version=$VERSION" "--vehicle-version=$VEHICLE_VERSION")
          if [ "$INPUT_APPLY" = "true" ]; then ARGS+=("--apply"); fi
          if [ "$INPUT_APPLY" = "true" ] && [ -z "$ERP5_FIREBASE_WRITER_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::ERP5 writer 시크릿이 없습니다.'
            exit 1
          fi
          npx tsx scripts/publish-products-to-erp5-firestore.mts "${ARGS[@]}"
