name: ChatGPT Audit 68 Recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit68-recorder.yml'

permissions:
  contents: write
  actions: read

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record audit 68 and self-remove recorder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if grep -F "audit (68)" docs/AI-SSOT-AUDIT-LOG.md >/dev/null; then
            echo "Audit 68 already recorded; refusing duplicate." >&2
            exit 1
          fi

          # Fail closed unless the observed native scheduler event is still real.
          RUN_JSON="$(gh api repos/${{ github.repository }}/actions/runs/35421826100)"
          EVENT="$(printf '%s' "$RUN_JSON" | jq -r '.event')"
          CREATED="$(printf '%s' "$RUN_JSON" | jq -r '.created_at')"
          NAME="$(printf '%s' "$RUN_JSON" | jq -r '.name')"
          STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
          CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // "pending"')"
          HEAD_SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')"

          test "$EVENT" = "schedule"
          test "$CREATED" = "2026-09-19T04:38:19Z"
          test "$NAME" = "ERP5 SSOT 원천 최신화(매시간)"

          # Confirm live cron contract is still :17 and core canonical boundaries did not change.
          grep -F "cron: '17 0-10 * * 1-6'" .github/workflows/erp5-ssot-refresh.yml >/dev/null
          grep -F "sourceUrl: 'https://sokrc.com/api'" lib/domain/inventory-source-registry.ts >/dev/null
          grep -F "sourceUrl: 'https://www.reborncar.co.kr'" lib/domain/inventory-source-registry.ts >/dev/null
          grep -F "RETIRED mirror dry-run" .github/workflows/mirror-sync.yml >/dev/null
          grep -F "RETIRED 경로 dry-run" .github/workflows/sales-erp-hourly.yml >/dev/null

          cat > docs/ai-ssot-audit/2026-09-19-chatgpt-audit68-native-schedule-resumed-one-slot.md <<EOF
          # ChatGPT Audit (68) — native ERP5 schedule resumed for one slot

          Date: 2026-09-19 KST

          ## Finding

          Audit (66)/(67)'s runtime statement that the newest native \`event=schedule\` was still the prior-day run is no longer current.

          ## Evidence

          - Current production cron remains \`17 0-10 * * 1-6\` in \`.github/workflows/erp5-ssot-refresh.yml\`.
          - GitHub Actions run \`35421826100\` is a real \`event=schedule\` run for \`ERP5 SSOT 원천 최신화(매시간)\`.
          - The run was created at \`2026-09-19T04:38:19Z\` = **2026-09-19 13:38:19 KST**, corresponding to the 13:17 KST slot and arriving about **21m 19s late**.
          - Recorder-time state: \`status=${STATUS}\`, \`conclusion=${CONCLUSION}\`, head \`${HEAD_SHA}\`.
          - Before this arrival, audit (66)/(67) had repository-wide newest native schedule at \`35347508078\` from 2026-09-18 21:58:18 KST.

          ## Audit conclusion

          **판정: PARTIAL RESOLVED / native delivery resumed once; cadence/timeliness HOLD remains**

          - The claim "native scheduler has not delivered any new event since the prior day" is resolved by this run.
          - Do **not** close native schedule health yet. One delayed native event does not prove consecutive cadence or punctual delivery.
          - Keep heartbeat/\`workflow_run\` recovery as a separate plane; do not count recovery-triggered runs as native schedule proof.
          - Audit (67)'s quote-defaults freshness HOLD remains open.
          - ERP5 canonical registry, fixed-snapshot F01/F86 projection, Sonogong/AutoPlus special-tab rules, retired mirror/sales writers, and RTDB/mirror non-canonical boundary show no new implementation drift in this delta.

          No application code or business logic was modified by this audit.
          EOF

          cat >> docs/AI-SSOT-AUDIT-LOG.md <<EOF

          ---

          ## 2026-09-19 — ChatGPT audit (68): native ERP5 schedule resumed for one delayed slot

          **판정: PARTIAL RESOLVED / native delivery 1회 재개, cadence·timeliness HOLD 유지**

          - audit (66)/(67)의 "최신 native \`event=schedule\`이 2026-09-18 21:58:18 KST run \`35347508078\`"이라는 runtime 결론은 더 이상 최신이 아니다.
          - 새 native run **\`35421826100\`**이 \`ERP5 SSOT 원천 최신화(매시간)\`, \`event=schedule\`로 **2026-09-19 13:38:19 KST** 생성됐다. live cron은 \`:17\`이므로 13:17 슬롯 대비 약 **21분 19초 지연 도착**이다.
          - recorder 시점 상태는 **\`${STATUS}\` / \`${CONCLUSION}\`**, head는 \`${HEAD_SHA}\`다.
          - 따라서 "native schedule 자체가 전혀 다시 오지 않았다"는 항목은 **해소됨**이지만, **연속 native 회차·정시성 정상화는 아직 입증되지 않았다.** native cadence/timeliness HOLD는 유지한다.
          - heartbeat \`push\` / settlement→ERP5 \`workflow_run\` recovery plane은 native proof와 계속 분리한다.
          - audit (67)의 standard quote-defaults freshness HOLD, canonical registry, F01/F86 fixed-snapshot 규칙, Sonogong/AutoPlus 특수탭, retired mirror/sales writer, RTDB/mirror non-canonical boundary에는 신규 구현 drift가 없다.

          Detail: \`docs/ai-ssot-audit/2026-09-19-chatgpt-audit68-native-schedule-resumed-one-slot.md\`
          EOF

          tmp="$(mktemp)"
          cat > "$tmp" <<EOF
          # CLAUDE-AUDIT — latest SSOT audit entry point

          ## Audit (68) override — 2026-09-19 KST

          Claude is the sole implementation owner. ChatGPT is an independent auditor only.

          ### New material delta

          - **PARTIAL RESOLUTION:** native ERP5 scheduler delivered run \`35421826100\` as real \`event=schedule\` at **2026-09-19 13:38:19 KST**. The live cron is 13:17 for that slot, so delivery was about **21m 19s late**.
          - Recorder-time run state: \`${STATUS}\` / \`${CONCLUSION}\`, head \`${HEAD_SHA}\`.
          - This supersedes audit (66)/(67)'s runtime statement that the newest native schedule was still the prior-day \`35347508078\`.
          - **HOLD remains:** one delayed native event is not enough to close cadence/timeliness. Require consecutive real \`event=schedule\` arrivals; keep heartbeat/\`workflow_run\` recovery evidence separate.
          - Audit (67)'s \`standard-quote-defaults.snapshot.json\` source-trigger/freshness HOLD remains open.
          - Core ERP5 canonical registry, F01/F86 fixed-snapshot projection, Sonogong/AutoPlus special-tab rules, retired legacy writers, and RTDB/mirror boundary are unchanged in this delta.

          ### Claude handoff

          1. Treat native scheduler as **delivery resumed once, still WATCH/HOLD**, not as fully recovered.
          2. Close cadence/timeliness only after consecutive native \`event=schedule\` slots are observed with acceptable delay and successful completion.
          3. Keep audit (67) quote-defaults freshness work separate.

          Detail: \`docs/ai-ssot-audit/2026-09-19-chatgpt-audit68-native-schedule-resumed-one-slot.md\`

          No application code or business logic was modified by the auditor.

          ---

          EOF
          cat CLAUDE-AUDIT.md >> "$tmp"
          mv "$tmp" CLAUDE-AUDIT.md

          git rm .github/workflows/chatgpt-audit68-recorder.yml
          git config user.name "chatgpt-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add CLAUDE-AUDIT.md docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-19-chatgpt-audit68-native-schedule-resumed-one-slot.md
          git commit -m "docs(audit): record native schedule partial resume"
          git push origin HEAD:main
