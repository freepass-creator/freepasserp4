name: ChatGPT Audit 99 Ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit99-ledger.yml'

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit 99 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          # trigger ledger repair after workflow registration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python -c 'from pathlib import Path; import base64; p=Path("docs/AI-SSOT-AUDIT-LOG.md"); t=p.read_text(encoding="utf-8"); e=base64.b64decode("").decode("utf-8"); marker="ChatGPT audit (99): F01 Sheet Contract auth resolved to guarded zero-op apply"; p.write_text(t.rstrip()+e+"\n", encoding="utf-8") if marker not in t else None'
          rm -f .github/workflows/chatgpt-audit99-ledger.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(audit): restore audit 99 central ledger'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
