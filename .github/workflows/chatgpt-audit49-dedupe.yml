name: ChatGPT audit49 dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit49-dedupe.yml'

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate audit49 block and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '\n---\n## 2026-09-18(49) — ChatGPT 독립 감사: PR #410 병합 뒤 첫 `:17` scheduled event 미관측'
          first = text.find(marker)
          second = text.find(marker, first + len(marker)) if first >= 0 else -1
          if second < 0:
              raise SystemExit('audit49 duplicate not found; refusing blind rewrite')
          next_section = text.find('\n---\n## ', second + len(marker))
          if next_section < 0:
              cleaned = text[:second].rstrip() + '\n'
          else:
              cleaned = text[:second] + text[next_section:]
          p.write_text(cleaned, encoding='utf-8')
          PY
          git rm .github/workflows/chatgpt-audit49-dedupe.yml
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "noreply@openai.com"
          git add docs/AI-SSOT-AUDIT-LOG.md
          git commit -m "docs(audit): dedupe audit49 central log"
          git push origin HEAD:main
