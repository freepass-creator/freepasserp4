name: One-time full production sync

on:
  push:
    paths:
      - '.sync-now-trigger'

concurrency:
  group: sales-erp-hourly
  # 수동 APPLY를 요청했을 때 오래 걸리는 push DRY-RUN은 중단하고 실제 반영을 우선한다.
  # 같은 그룹의 이전 pending APPLY도 새 요청으로 교체되므로 중복 쓰기가 생기지 않는다.
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Prepare credentials
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}
      - name: SSOT adapter contract test
        run: npx tsx scripts/test-ssot-adapters.mts
      - name: Run guarded production sync
        run: npx tsx scripts/run-hourly-with-ssot-gate.mts --apply --손오공없이

      - name: 자격증명 삭제
        if: always()
        uses: ./.github/actions/cleanup-credentials
