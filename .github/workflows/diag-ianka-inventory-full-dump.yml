name: 이안카 inventory 전체 덤프 + 손님화면 번들 재탐색(읽기전용, 수동)

# scripts/diag-ianka-inventory-full-dump.mts — /api/inventory 전체 구조를 덤프하고,
# rate-app(관리자 전용으로 보임) 말고 다른 번들(index-*.js·framework-*.js)에서
# 손님이 실제로 보는 요금 흐름을 찾는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 inventory 전체 덤프 + 번들 재탐색
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-inventory-full-dump.mts
