name: audit42 recorder once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit42-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit42 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Recorder'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          AUDIT_GZ_B64=''
          DETAIL_GZ_B64=''
          CLAUDE_GZ_B64=''
          base64 -d <<< "$AUDIT_GZ_B64" | gzip -d > /tmp/audit42-entry.md
          cat /tmp/audit42-entry.md >> docs/AI-SSOT-AUDIT-LOG.md
          base64 -d <<< "$DETAIL_GZ_B64" | gzip -d > docs/ai-ssot-audit/2026-09-18-chatgpt-audit42-ianka-fillifempty-resolution.md
          base64 -d <<< "$CLAUDE_GZ_B64" | gzip -d > CLAUDE-AUDIT.md
          rm -f .github/workflows/audit42-recorder-once.yml
          git add -A
          git commit -m 'docs(audit): record audit42 RP031 FILLIFEMPTY resolution'
          git push origin main
