name: audit42 recorder once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit42-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit42 central log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Recorder'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          AUDIT_GZ_HEX=''
          printf '%s' "$AUDIT_GZ_HEX" | xxd -r -p | gzip -d > /tmp/audit42-entry.md
          if ! grep -q '2026-09-18(42)' docs/AI-SSOT-AUDIT-LOG.md; then
            cat /tmp/audit42-entry.md >> docs/AI-SSOT-AUDIT-LOG.md
          fi
          rm -f .github/workflows/audit42-recorder-once.yml
          git add -A
          git commit -m 'docs(audit): record audit42 RP031 FILLIFEMPTY resolution'
          git push origin main
