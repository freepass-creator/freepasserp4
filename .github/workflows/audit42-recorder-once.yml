name: audit42 recorder once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit42-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit42 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Recorder'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          AUDIT_B64='