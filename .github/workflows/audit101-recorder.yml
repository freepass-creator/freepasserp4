name: Audit 101 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit101-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.event.head_commit.message == 'chore(audit): append audit 101 recorder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Audit 101 and self-remove recorder
        env:
          ENTRY_B64: 
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = p.read_text(encoding='utf-8')
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8')
          if 'ChatGPT audit (101):' not in text:
              p.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/audit101-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md .github/workflows/audit101-recorder.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(audit): append audit 101 continuity finding"
          git push origin HEAD:main
