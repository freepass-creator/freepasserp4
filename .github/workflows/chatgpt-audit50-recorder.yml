name: ChatGPT audit50 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit50-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit50 and self-delete
        env:
          AUDIT_BLOCK_B64: ""
          DETAIL_B64: ""
          CLAUDE_B64: ""
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import base64, os
          from pathlib import Path
          marker = '## 2026-09-18(50) — ChatGPT 독립 감사: :17 전환 뒤 두 회차 연속 부재 + repository-wide schedule delivery gap'
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = p.read_text(encoding='utf-8')
          block = base64.b64decode(os.environ['AUDIT_BLOCK_B64']).decode('utf-8')
          if marker not in text:
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          Path('docs/ai-ssot-audit/2026-09-18-chatgpt-audit50-repository-wide-schedule-gap.md').write_bytes(base64.b64decode(os.environ['DETAIL_B64']))
          Path('CLAUDE-AUDIT.md').write_bytes(base64.b64decode(os.environ['CLAUDE_B64']))
          PY
          git rm .github/workflows/chatgpt-audit50-recorder.yml
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "noreply@openai.com"
          git add CLAUDE-AUDIT.md docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-18-chatgpt-audit50-repository-wide-schedule-gap.md
          git commit -m "docs(audit): record audit50 repository-wide schedule gap"
          git push origin HEAD:main
