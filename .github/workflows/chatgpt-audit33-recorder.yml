name: ChatGPT audit33 recorder

on:
  push:
    paths:
      - '.github/workflows/chatgpt-audit33-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit log and refresh Claude entry point
        run: |
          cat docs/ai-ssot-audit/.audit33-log-fragment.tmp >> docs/AI-SSOT-AUDIT-LOG.md
          cat docs/ai-ssot-audit/.audit33-claude-override.tmp CLAUDE-AUDIT.md > CLAUDE-AUDIT.new
          mv CLAUDE-AUDIT.new CLAUDE-AUDIT.md
          rm docs/ai-ssot-audit/.audit33-log-fragment.tmp
          rm docs/ai-ssot-audit/.audit33-claude-override.tmp
          rm .github/workflows/chatgpt-audit33-recorder.yml
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'chatgpt-audit@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md docs/ai-ssot-audit .github/workflows/chatgpt-audit33-recorder.yml
          git commit -m 'audit: record RP031 feeder parity and provenance hold'
          git push origin HEAD:main
