name: 이안카 기간필터 DOM 구조 확인(헤드리스, 수동)

# scripts/diag-ianka-filter-dom-structure.mts — 계약(약정)기간 필터의 실제 DOM
# 구조(버튼/셀렉트 태그·클래스)를 확인해 자동 클릭 대상을 찾는다. 요금은 API에
# 없고 렌더링된 DOM에만 있으므로, 8개 기간을 순서대로 클릭해 긁는 방식을 쓴다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 이안카 기간필터 DOM 구조 확인
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-filter-dom-structure.mts
