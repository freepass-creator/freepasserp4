name: ChatGPT audit49 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit49-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit49 and remove recorder
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import base64, pathlib
          log = pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md')
          entry = base64.b64decode('Ci0tLQojIyAyMDI2LTA5LTE4KDQ5KSDigJQgQ2hhdEdQVCDrj4Xrpr0g6rCQ7IKsOiBQUiAjNDEwIOuzkeyVqSDrkqQg7LKrIGA6MTdgIHNjaGVkdWxlZCBldmlkZW5jZSDrtoDsnqzCgoqKu2MkOyglTog7J2Y66+4IOyeiOuKlCDsmrTsmIHsp50g7Kad6rGwIOqwnOyLoCDigJQgY29kZS9jb25maWcg7KCE7ZmY7J2AIOyZgOujjOuQkOyngOu만').decode()
          with log.open('a', encoding='utf-8') as f:
              f.write(entry)
          claude = base64.b64decode('만  만CDsiJjtlokg7ZWc64ukLioqCg==').decode()
          pathlib.Path('CLAUDE-AUDIT.md').write_text(claude, encoding='utf-8')
          PY
          git rm .github/workflows/chatgpt-audit49-recorder.yml
          git config user.name 'ChatGPT Audit'
          git config user.email 'chatgpt-audit@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          git commit -m 'docs(audit): append audit49 and refresh Claude entry point'
          git push origin HEAD:main
