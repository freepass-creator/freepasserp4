### B. 충돌(신규/중요) — one-time emergency writer가 옛 `2e880cef...`에 고정돼 같은 F01/F86을 stale engine으로 쓸 수 있음

current main `.github/workflows/manual-erp5-full-sync-once.yml`은 여전히:

- `ref: 2e880cefa96e3fa4bfc79902fed448d5bd74abdb`
- `FREEPASS_MANUAL_PUBLISH_APPROVED`
- F01 직접 publish
- F86 backup/publish/audit

를 가진 write-capable 경로다.

canonical production은 이미 `6a6f3f75...`로 전진했으므로, 이 one-time workflow가 다시 트리거되면 **동일 F01/F86을 새 production보다 오래된 engine으로 다시 쓸 수 있다.** 특히 `6a6f3f75...`에 새로 들어간 차량가격 `미입력`, 손오공 보증금 규칙글자/0 정규화, `depositRuleViolations` publication gate가 빠진 상태로 발행할 수 있다.

따라서 audit (23)의 “second production writer entry point”는 이번에는 더 구체적인 **same-output stale-engine writer conflict**로 상향한다. 긴급 회차용 임시 writer라면 retire/remove가 맞고, 유지할 이유가 있으면 canonical production engine 계약과 함께 움직이도록 명시적으로 통제해야 한다.

### C. 충돌 유지/구체화 — audit (22)의 special-tab deposit-policy drift는 새 production에서도 해소되지 않았고 정책 정의가 둘로 갈림

current main에는 `lib/domain/deposit-policy.ts`가 canonical policy object/resolver로 존재한다.

- 손오공 label: `월 대여료 × 연수 (최대 ×3)`
- AutoPlus maker 미입력: `undefined`로 fail-closed
- current main `sales-published-tabs.ts`는 이 policy object/resolver를 직접 소비

반면 active production `6a6f3f75...`에는 `lib/domain/deposit-policy.ts` 자체가 없다.

- 손오공 규칙글자: production-local `sonokongDepositRuleText()` = `월 대여료 × 약정연수 (최대 3개월)`
- AutoPlus 규칙: production-local `isImportBrand(maker) ? 수입 : 국산`, maker 빈값도 국산으로 fallback

즉 PR #340은 손오공 숫자 보증금이 rule text를 가리는 운영 증상과 발행문지기는 개선했지만, **main canonical deposit-policy와 production special-tab이 하나의 정책 객체를 소비하도록 합치지는 않았다.** 오히려 production-local 손오공 rule text가 발행문지기의 기준까지 되면서 두 정의가 더 명확히 병존한다.

또 current main `lib/domain/inventory-contract.ts`에는 production `6a6f3f75...`의 `depositRuleViolations` 필드/문지기가 아직 없다. production gate를 유지한 채 main canonical policy/resolver와 선택적으로 합쳐야 하며, production의 7-canonical/F86/collector 계약을 main 옛 계보로 되돌리면 안 된다.

