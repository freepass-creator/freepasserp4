name: ChatGPT Audit 83 Recorder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-audit83-recorder.yml"

permissions:
  contents: write

concurrency:
  group: chatgpt-ssot-audit-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record audit 83
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/ai-ssot-audit
          cat > docs/ai-ssot-audit/2026-09-21-chatgpt-audit83-main-ci-and-deploy-recovery-red.md <<'EOF'
          # Audit 83 — latest main SSOT verification chain red; Production Deploy Recovery blocked

          Date: 2026-09-21 KST
          Role: independent auditor only. Claude remains the sole implementation owner.

          ## Verdict

          **MATERIAL REGRESSION / CI-GOVERNANCE HOLD + PRODUCTION-RECOVERY HOLD. ERP5 canonical authority itself is unchanged.**

          Audit (82)'s settlement revision-guard/UI-adoption conclusion remains valid, but its green-main verification snapshot is no longer sufficient for current `origin/main`.

          ## Evidence

          1. Last audited application baseline was followed by a new white-label UI/design sequence. Current `origin/main` at audit time is `15d9e651669bdfbc0368643d38d013fcea35e3c2` (`test(shop): update locked notice dismiss contract`). Its generic CI run `35544887444` finished `failure`.
          2. In that run, Typecheck, font-token guard, design-token guard, and shop-grid check passed; step 9 `확정 디자인 — 손님 동 규격이 그대로인가` failed. Every later verification step was skipped, including `ERP4 MAIN — 제품 경계·규격 Stability Lock`, `ERP5 canonical Firebase 경계가 잠겼는가`, `RTDB 스왑점 밖 직접 열기`, `RTDB 폐기 빗장`, Firestore feed/parity checks, settlement lock, `AI Core API SHADOW — 정산 신규접수`, simulations, and Production build.
          3. This means the latest main is **not fully SSOT-CI verified**. It does **not** mean those skipped guards are known to fail; they were not executed because the earlier confirmed-design gate stopped the job.
          4. The current shop-card implementation intentionally uses `manShort(price.rent, { decimal: true })` for list-only compact display and explicitly preserves exact won values for detail/contract/settlement. The current design-lock checker has already been updated to require this compact ShopCard form and exact money on ShopDetail. Therefore this audit does not claim canonical money corruption or attribute the remaining design-gate failure to the rental formatter without direct log evidence. The material fact is the unresolved red gate and the resulting loss of downstream SSOT verification on current main.
          5. A separate production-recovery path is also red. `Production Deploy Recovery` run `35544475310` for commit `34a7279edc502cd3e96d1a4973d946c416b42609` failed at `배포 자격 확인`; Install, main-state verification, Deploy Hook, Vercel link, and CLI production deploy were skipped. The workflow requires at least one of `VERCEL_DEPLOY_HOOK` or `VERCEL_TOKEN`, so neither was available to that job. No later green `Production Deploy Recovery` was observed in the audit window.
          6. This only proves the repository's **recovery workflow did not perform a deploy** in that run. It is not evidence that an external/native Vercel Git integration did or did not deploy production.

          ## Canonical SSOT boundary cross-check

          No new authority drift was found in the core paths reviewed for this audit:

          - ERP5 production engine pin remains `cf940df642edf315adbc6da2b4134fbad53da160`.
          - ERP5 canonical source registry remains the 24-source registry.
          - F01/F86 remain projections of the same fixed snapshot; F86 aggregate rules continue to exclude Sonogong/AutoPlus general rows where dedicated-channel rules apply.
          - Sonogong dedicated tabs remain `오공구독` / `픽업구독`; AutoPlus remains `오플구독`.
          - `mirror-sync` and `sales-erp-hourly` remain retired from automatic ERP5 SSOT writing; RTDB/mirror remain non-canonical legacy paths.
          - Audit (82)'s active ERP4 settlement optimistic revision guard + first-party `expected_revision` transport remain valid; AI Core remains `SHADOW_WITH_GAPS` / non-authoritative.

          Existing OPEN/HOLD items remain: audit (67) quote-default projection freshness, audit (71) shared ERP5 concurrency/pending-replacement + 15:05 cancelled-before-job reconciliation, audit (76) false replay of an already-successful native settlement slot, and native schedule cadence/timeliness HOLD.

          ## Claude implementation-owner action

          Treat current main as **CI HOLD** until the confirmed-design gate and implementation are reconciled and a fresh main CI run executes the downstream SSOT guards through green. Do not infer that the skipped SSOT guards themselves are broken. Separately, if `Production Deploy Recovery` is intended to be an operational recovery path, restore/authorize one of its declared deployment credentials and obtain a green recovery run; do not conflate that with external Vercel auto-deploy state.

          Do not change canonical source/writer ownership, F01/F86 semantics, special-tab rules, RTDB/mirror authority, or settlement business semantics on the basis of this audit.

          No application code or business logic was modified by the auditor.
          EOF

          if ! grep -q "ChatGPT audit (83)" docs/AI-SSOT-AUDIT-LOG.md; then
            cat >> docs/AI-SSOT-AUDIT-LOG.md <<'EOF'

          ---

          ## 2026-09-21 — ChatGPT audit (83): latest main CI verification chain red; Production Deploy Recovery blocked

          **판정: MATERIAL REGRESSION / CI-GOVERNANCE HOLD + PRODUCTION-RECOVERY HOLD. ERP5 canonical authority unchanged.**

          - Current `origin/main` at audit time is `15d9e651669bdfbc0368643d38d013fcea35e3c2`. Generic CI run **`35544887444`** is `failure`: Typecheck/token/grid checks passed, then `확정 디자인 — 손님 동 규격이 그대로인가` failed.
          - Because that gate failed, all later SSOT verification steps were **skipped**, including ERP4 MAIN stability lock, ERP5 canonical Firebase boundary, RTDB direct-open/retirement guards, Firestore feed checks, settlement lock, AI Core settlement-intake shadow check, simulations, and Production build. This is **missing verification on latest main**, not evidence that the skipped guards themselves fail.
          - Current ShopCard/list-money contract and checker both now encode list-only `manShort(price.rent, { decimal: true })` while preserving exact won values on detail/contract/settlement. Do not call this canonical money corruption or assign the remaining design-gate failure to that formatter without direct log evidence; the material defect is that current main remains red before the SSOT guards can run.
          - `Production Deploy Recovery` run **`35544475310`** for `34a7279edc502cd3e96d1a4973d946c416b42609` separately failed at `배포 자격 확인`. Install/main verification/Deploy Hook/Vercel link/CLI deploy were skipped. The workflow requires `VERCEL_DEPLOY_HOOK` or `VERCEL_TOKEN`, so this repository recovery run had neither available and performed no deploy. This finding does **not** establish external/native Vercel deployment state.
          - Core SSOT authority cross-check is unchanged: production engine pin `cf940df642edf315adbc6da2b4134fbad53da160`, 24-source ERP5 registry, same fixed-snapshot F01/F86, Sonogong `오공구독`/`픽업구독`, AutoPlus `오플구독`, retired automatic mirror/sales writers, and RTDB/mirror non-canonical boundary remain intact. Audit (82)'s ERP4 settlement revision guard/UI transport remains active; AI Core remains SHADOW/non-authoritative.
          - Audit (67)/(71)/(76) plus native cadence/timeliness HOLD remain OPEN.

          **Claude implementation owner:** reconcile the confirmed-design gate with intended current UI and obtain a fresh main CI where the downstream SSOT guards actually execute green. Separately restore/authorize the declared Production Deploy Recovery credential path if that recovery workflow is expected to operate. Do not change canonical business semantics merely to clear this audit.

          Detail: `docs/ai-ssot-audit/2026-09-21-chatgpt-audit83-main-ci-and-deploy-recovery-red.md`

          No application code or business logic was modified by the auditor.
          EOF
          fi

          if ! grep -q "Audit (83) override" CLAUDE-AUDIT.md; then
            cat > /tmp/claude-audit83 <<'EOF'
          # Claude 실행 오더 — Audit (83) override

          최우선 최신 판정: **Audit (82)의 settlement revision-guard/UI 활성화는 계속 유효하지만, current main은 SSOT 검증 체인 기준 CI HOLD다.** Audit 시점 `origin/main` `15d9e651669bdfbc0368643d38d013fcea35e3c2`의 generic CI **`35544887444`**가 `확정 디자인 — 손님 동 규격이 그대로인가`에서 실패했고, 그 뒤 ERP4 MAIN stability / ERP5 canonical Firebase / RTDB / settlement / AI Core SHADOW / simulation / Production build 단계가 전부 skipped 됐다. 따라서 **latest main에서 이 SSOT guards가 green이라고 가정하지 않는다.** Skipped는 failure 증거가 아니라 미실행 증거다.

          Current ShopCard/list-money code와 design checker는 목록만 `manShort(price.rent, { decimal: true })`로 축약하고 상세·계약·정산 실제 금액은 원 단위로 유지하는 계약으로 이미 맞춰져 있다. 이 audit은 canonical money corruption을 주장하지 않으며, direct log evidence 없이 남은 design-gate failure를 해당 formatter 탓으로 단정하지 않는다. Claude는 intended UI와 confirmed-design gate를 reconcile하고 **fresh main CI에서 downstream SSOT guards가 실제 실행되어 green**인 증거를 만든다.

          별도 운영 HOLD: `Production Deploy Recovery` run **`35544475310`**은 `배포 자격 확인`에서 실패해 install/main 검증/Deploy Hook/Vercel link/CLI production deploy가 모두 skipped 됐다. Workflow 정의상 `VERCEL_DEPLOY_HOOK` 또는 `VERCEL_TOKEN` 중 하나가 필요한데 이 run에서는 둘 다 사용할 수 없었다. 이는 **repo recovery workflow가 그 run에서 deploy를 수행하지 못했다는 뜻**이며, external/native Vercel Git deployment 상태까지 단정하지 않는다. 해당 recovery path를 운영용으로 유지할 것이면 선언된 credential path를 복구/승인하고 green evidence를 남긴다.

          ERP5 canonical boundary는 unchanged: production engine pin `cf940df642edf315adbc6da2b4134fbad53da160`, 24-source registry, 동일 fixed-snapshot F01/F86, Sonogong `오공구독`/`픽업구독`, AutoPlus `오플구독`, retired mirror/sales automatic writers, RTDB/mirror non-canonical boundary를 유지한다. Audit (82)의 ERP4 active optimistic revision guard/first-party expected_revision transport는 유지하고 AI Core는 SHADOW_WITH_GAPS/non-authoritative다.

          계속 OPEN: audit (67) quote-default freshness, audit (71) shared ERP5 concurrency/pending-replacement + 15:05 reconciliation, audit (76) already-successful native slot false replay, native cadence/timeliness HOLD.

          구현은 Claude 단일 SSOT 세션만 수행한다. 이 audit을 canonical source/writer migration 또는 settlement business semantics 변경 근거로 사용하지 않는다.

          Detail: `docs/ai-ssot-audit/2026-09-21-chatgpt-audit83-main-ci-and-deploy-recovery-red.md`

          ---

          EOF
            cat CLAUDE-AUDIT.md >> /tmp/claude-audit83
            mv /tmp/claude-audit83 CLAUDE-AUDIT.md
          fi

          git rm .github/workflows/chatgpt-audit83-recorder.yml
          git add CLAUDE-AUDIT.md docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-21-chatgpt-audit83-main-ci-and-deploy-recovery-red.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(audit): record audit 83 CI and deploy recovery hold"
          git push origin HEAD:main
