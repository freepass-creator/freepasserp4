name: 판매·천이·ERP 시간별 동기

# ⚠⚠ 2026-09-08 — **cron 을 뺐다.** 위 YAML 오류로 이 워크플로는 첫 커밋부터 한 번도 돈 적이 없고,
#   그동안 이 파이프라인은 **이 집 PC 의 작업 스케줄러**(`scripts/hourly-sync.cmd`)가 돌려 왔다.
#   YAML 만 고치고 cron 을 그대로 두면 «오케스트레이터가 둘»이 되어 시트·ERP 를 두 군데서 쓴다
#   (아래 주석의 「★오케스트레이터는 하나다」가 그 뜻이다). 그래서 지금은 **손으로 부를 때만** 돈다.
# ⇒ 클라우드로 «옮길» 때 되살린다. 순서는 ㉠ GOOGLE_SA_JSON 시크릿 확인 ㉡ 로컬 스케줄러 정지
#   ㉢ 아래 schedule 복구. 그 전에 켜면 두 대가 같은 시트를 쓴다.
#   (되살릴 값: 평일 KST 09:00~18:00 = `cron: '0 0-9 * * 1-5'` · 원본→정제 점검 뒤)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영'
        type: boolean
        default: false

concurrency:
  group: sales-erp-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: 자격증명 준비
        # ★흐름형(`{ }`) 안에 «${{ }}» 를 맨몸으로 두면 YAML 이 못 읽는다 — `{` 가 또 다른
        #   흐름 매핑의 시작으로 잡힌다. 그러면 GitHub 이 스텝을 돌리기도 «전»에 런을 실패시킨다
        #   (2026-09-08 발견: 이 한 줄 때문에 이 워크플로는 첫 커밋부터 성공한 적이 없다).
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SA" || { echo '::error::GOOGLE_SA_JSON 시크릿이 없습니다.'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json
      # ★오케스트레이터는 하나다 — 로컬 작업 스케줄러도 같은 파일을 부른다(scripts/hourly-sync.cmd).
      #   전에는 여기만 run-sales-erp-hourly.mts 를 불러 단계가 갈렸다(픽업구독·천이·요금검수가 빠져 있었다).
      #   ⓪ 손오공은 계정 파일이 없으면 스스로 건너뛴다 — GHA 에 손오공 시크릿을 붙이기 전까지는 ①부터 돈다.
      - name: 연동지도 전 구간 (정제시트 → 판매 4탭 → 천이 → ERP)
        run: npx tsx scripts/hourly-sync.mts --apply
