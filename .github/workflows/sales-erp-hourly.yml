name: 판매·천이·ERP 시간별 동기

# GitHub Actions가 이 파이프라인의 단일 클라우드 오케스트레이터다.
# 평일 KST 09:00~18:00 정각 = UTC 00:00~09:00.
# 로컬 scripts/hourly-sync.cmd 는 쓰기 동작이 없는 RETIRED 상태다.
on:
  schedule:
    - cron: '0 0-9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/cloud-hourly-sync.mts'
      - 'scripts/run-hourly-with-ssot-gate.mts'
      - 'scripts/ssot-prepublish-gate.mts'
      - '.github/workflows/sales-erp-hourly.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영'
        type: boolean
        default: false

concurrency:
  group: sales-erp-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # ★2026-09-16 — 여기에 **손오공 계정 준비가 빠져 있었다.**
      #   cloud-hourly-sync → run-hourly-with-ssot-gate → scripts/hourly-sync.mts 로 내려가는데
      #   hourly-sync 는 sonokong/lib/wonja/.손오공계정.json 이 없고 `--손오공없이` 도 없으면
      #   stop('손오공 계정 없음') 한다. 이 경로는 --손오공없이 를 «안» 준다(sync-now-once.yml 과 다르다).
      #   그래서 매 회차가 「⛔ 중단 — 손오공 계정 없음」으로 죽었다. 시크릿은 처음부터 있었다.
      #   준비 블록은 .github/actions/prepare-credentials 한 곳에만 둔다 — 복붙을 늘리지 마라.
      - name: 자격증명 준비
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}
          sonogong-account-json: ${{ secrets.SONOGONG_ACCOUNT_JSON }}
          require-sonogong: 'true'

      - name: SSOT 어댑터 계약 테스트
        run: npx tsx scripts/test-ssot-adapters.mts

      - name: SOURCE → ADAPTER → ATOM → F01 → ERP
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            npx tsx scripts/cloud-hourly-sync.mts --apply
          else
            npx tsx scripts/cloud-hourly-sync.mts
          fi

      - name: 자격증명 삭제
        if: always()
        uses: ./.github/actions/cleanup-credentials
