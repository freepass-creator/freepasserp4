name: 판매·천이·ERP 시간별 동기

# GitHub Actions가 이 파이프라인의 단일 클라우드 오케스트레이터다.
# 평일 KST 09:00~18:00 정각 = UTC 00:00~09:00.
# 로컬 scripts/hourly-sync.cmd 는 쓰기 동작이 없는 RETIRED 상태다.
on:
  schedule:
    - cron: '0 0-9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/cloud-hourly-sync.mts'
      - 'scripts/run-hourly-with-ssot-gate.mts'
      - 'scripts/ssot-prepublish-gate.mts'
      - '.github/workflows/sales-erp-hourly.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영'
        type: boolean
        default: false

concurrency:
  group: sales-erp-hourly
  cancel-in-progress: false

# 실패를 «이슈»로 올리기 위해 필요하다 — 러너에는 메일 도구가 없다(2026-09-16 사고).
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # ★2026-09-16 — 여기에 **손오공 계정 준비가 빠져 있었다.**
      #   cloud-hourly-sync → run-hourly-with-ssot-gate → scripts/hourly-sync.mts 로 내려가는데
      #   hourly-sync 는 sonokong/lib/wonja/.손오공계정.json 이 없고 `--손오공없이` 도 없으면
      #   stop('손오공 계정 없음') 한다. 이 경로는 --손오공없이 를 «안» 준다(sync-now-once.yml 과 다르다).
      #   그래서 매 회차가 「⛔ 중단 — 손오공 계정 없음」으로 죽었다. 시크릿은 처음부터 있었다.
      #   준비 블록은 .github/actions/prepare-credentials 한 곳에만 둔다 — 복붙을 늘리지 마라.
      - name: 자격증명 준비
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}
          sonogong-account-json: ${{ secrets.SONOGONG_ACCOUNT_JSON }}
          require-sonogong: 'true'

      # ★2026-09-16 — 여기에 손오공 계정 준비 블록이 따로 있었다(#316). 지웠다.
      #   이유 둘 — ① 위 prepare-credentials 가 같은 일을 이미 한다. 복붙을 둘로 두면
      #     한쪽만 고쳐지는 것이 이번 사고의 무늬였다(#317).
      #   ② 그 블록은 SONOKONG_ACCOUNT_JSON 을 봤는데 저장소에 등록된 이름은
      #     SONOGONG_ACCOUNT_JSON 이다(2026-09-14 등록). 그대로 두면 시크릿이 있는데도
      #     「없다」며 매 회차가 죽는다. 브랜치만 보고 새 이름을 제안했던 것이 틀렸다.

      - name: SSOT 어댑터 계약 테스트
        run: npx tsx scripts/test-ssot-adapters.mts

      - name: SOURCE → ADAPTER → ATOM → F01 → ERP
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            npx tsx scripts/cloud-hourly-sync.mts --apply
          else
            npx tsx scripts/cloud-hourly-sync.mts
          fi

      # 실패한 회차의 기록을 남긴다 — 로그가 지워져도 무엇이 어디서 멈췄는지 읽을 수 있게.
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-sync-실패기록-${{ github.run_id }}
          path: |
            tmp/hourly-sync-last.txt
            tmp/hourly-sync-log.txt
            tmp/자동동기-상태.json
          if-no-files-found: ignore
          retention-days: 14

      # ★이번 사고의 핵심 — «실패가 조용히 묻히지 않게».
      #   메일 도구(C:/dev/mailtool)는 러너에 없다. 그러니 러너에서는 «이슈»가 알림 통로다.
      #   열려 있는 이슈가 있으면 댓글만 달아 하루에 열 개가 쌓이지 않게 한다.
      - name: 실패를 이슈로 알린다
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='⛔ 판매·천이·ERP 시간별 동기 멈춤'
          BODY="예약 실행이 실패했습니다. ERP 는 마지막으로 성공한 값에 머뭅니다(공급사 시트를 고쳐도 안 넘어갑니다).

          실행 기록 — $RUN_URL
          커밋 — ${{ github.sha }}"
          EXISTING=$(gh issue list --state open --label 자동동기멈춤 --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create 자동동기멈춤 --color B60205 --description '시간별 동기 실패 알림' 2>/dev/null || true
            gh issue create --title "$TITLE" --label 자동동기멈춤 --body "$BODY"
          fi

      - name: 자격증명 삭제
        if: always()
        uses: ./.github/actions/cleanup-credentials
