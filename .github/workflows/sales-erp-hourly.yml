name: 판매·천이·ERP 시간별 동기

# GitHub Actions가 이 파이프라인의 단일 클라우드 오케스트레이터다.
# 평일 KST 09:00~18:00 정각 = UTC 00:00~09:00.
# 로컬 scripts/hourly-sync.cmd 는 쓰기 동작이 없는 RETIRED 상태다.
on:
  schedule:
    - cron: '0 0-9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/cloud-hourly-sync.mts'
      - 'scripts/ssot-prepublish-gate.mts'
      - '.github/workflows/sales-erp-hourly.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영'
        type: boolean
        default: false

concurrency:
  group: sales-erp-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 준비
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SA" || { echo '::error::GOOGLE_SA_JSON 시크릿이 없습니다.'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json

      - name: SSOT 어댑터 계약 테스트
        run: npx tsx scripts/test-ssot-adapters.mts

      - name: SOURCE → ADAPTER → ATOM → F01 → ERP
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            npx tsx scripts/cloud-hourly-sync.mts --apply
          else
            npx tsx scripts/cloud-hourly-sync.mts
          fi
