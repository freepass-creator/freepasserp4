name: 이안카 브라우저 네트워크 캡처(헤드리스, 수동)

# scripts/diag-ianka-browser-network-capture.mts — plain fetch로 로그인해 얻은 쿠키를
# 헤드리스 브라우저에 주입하고(Cloudflare 로그인 챌린지 회피) 홈 접속 시 실제 네트워크
# 요청·렌더링된 텍스트를 전부 캡처한다. 요금이 REST fetch가 아니라 RSC 서버 액션으로
# 오는지 확인한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 이안카 브라우저 네트워크 캡처
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-browser-network-capture.mts
