name: One-time audit entry-point refresh

on:
  push:
    paths:
      - '.github/workflows/audit-doc-append-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh audit entry point and dated evidence
        env:
          SCRIPT_B64: ''
        run: |
          echo "$SCRIPT_B64" | base64 -d > /tmp/update_audit.py
          python /tmp/update_audit.py
      - name: Commit audit entry-point docs
        run: |
          git config user.name 'freepass-creator'
          git config user.email 'dudguq@gmail.com'
          git add CLAUDE-AUDIT.md docs/ai-ssot-audit/2026-09-17-chatgpt-disabled-workflow-f86-checker-drift.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(audit): refresh Claude entry point for audit 23'
          git push origin HEAD:main
