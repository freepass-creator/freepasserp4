name: One-time audit log append

on:
  push:
    paths:
      - '.github/workflows/audit-doc-append-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append audit entry only
        env:
          ENTRY_B64: ''
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8')
          text = p.read_text(encoding='utf-8')
          marker = '## 2026-09-17(23) — ChatGPT 독립 감사:'
          if marker not in text:
              p.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          PY
      - name: Commit audit log
        run: |
          git config user.name 'freepass-creator'
          git config user.email 'dudguq@gmail.com'
          git add docs/AI-SSOT-AUDIT-LOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(audit): append audit 23'
          git push origin HEAD:main
