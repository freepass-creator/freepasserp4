name: One-time audit entry-point refresh

on:
  push:
    paths:
      - '.github/workflows/audit-doc-append-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh audit entry point and dated evidence
        env:
          BLOCK_B64: ''
          DATED_B64: ''
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('CLAUDE-AUDIT.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 최신 override — audit (23)'
          block = base64.b64decode(os.environ['BLOCK_B64']).decode('utf-8')
          if marker not in s:
              anchor = '# Claude SSOT Audit Entry Point\n'
              s = s.replace(anchor, anchor + '\n' + block, 1)
              p.write_text(s, encoding='utf-8')
          d = Path('docs/ai-ssot-audit/2026-09-17-chatgpt-disabled-workflow-f86-checker-drift.md')
          d.write_text(base64.b64decode(os.environ['DATED_B64']).decode('utf-8'), encoding='utf-8')
          PY
      - name: Commit audit entry-point docs
        run: |
          git config user.name 'freepass-creator'
          git config user.email 'dudguq@gmail.com'
          git add CLAUDE-AUDIT.md docs/ai-ssot-audit/2026-09-17-chatgpt-disabled-workflow-f86-checker-drift.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(audit): refresh Claude entry point for audit 23'
          git push origin HEAD:main
