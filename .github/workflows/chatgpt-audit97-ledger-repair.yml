name: ChatGPT Audit 97 Ledger Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit97-ledger-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair ledger suffix
        run: python scripts/.audit97-ledger-repair.py
      - name: Commit repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/chatgpt-audit97-ledger-repair.yml scripts/.audit97-ledger-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md .github/workflows/chatgpt-audit97-ledger-repair.yml scripts/.audit97-ledger-repair.py
          git commit -m 'docs(audit): repair audits 94-97 ledger suffix'
          git push origin HEAD:main
