name: One-shot Audit 85 recorder

on:
  push:
    paths:
      - '.github/workflows/audit85-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit
        shell: bash
        env:
          AUDIT_ENTRY_B64: ""
          CLAUDE_PREFIX_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          ledger = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = ledger.read_text(encoding='utf-8')
          marker = '## 2026-09-21 — ChatGPT audit (85): 09:05 native settlement slot missed; recovery chain full green'
          if marker not in text:
              entry = base64.b64decode(os.environ['AUDIT_ENTRY_B64']).decode('utf-8')
              ledger.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          claude = Path('CLAUDE-AUDIT.md')
          ctext = claude.read_text(encoding='utf-8')
          cmarker = '# Claude 실행 오더 — Audit (85) override'
          if cmarker not in ctext:
              prefix = base64.b64decode(os.environ['CLAUDE_PREFIX_B64']).decode('utf-8')
              claude.write_text(prefix + ctext, encoding='utf-8')
          PY
      - name: Commit and remove recorder
        shell: bash
        run: |
          git config user.name "freepass-creator"
          git config user.email "dudguq@gmail.com"
          git rm .github/workflows/audit85-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          git commit -m "docs(audit): record audit 85 native recovery"
          git push origin HEAD:main
