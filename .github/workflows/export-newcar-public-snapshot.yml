name: 신차 상품마스터 공개 스냅샷

on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-newcar-public-snapshot.mts'
      - '.github/workflows/export-newcar-public-snapshot.yml'
  workflow_dispatch:

concurrency:
  group: newcar-public-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Firebase/Google 자격증명 준비
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}
      - name: new_car_trim 공개필드 스냅샷
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sa.json
        run: npx tsx scripts/export-newcar-public-snapshot.mts
      - name: 표준견적 코드 기본값 스냅샷
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sa.json
        run: npx tsx scripts/export-standard-quote-defaults.mts
      - name: 스냅샷 커밋
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freepass-newcar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/new-car/current-feed.snapshot.json data/new-car/standard-quote-defaults.snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(newcar): refresh public product-master snapshot [skip ci]"
          git push origin HEAD:main
      - name: 자격증명 삭제
        if: always()
        uses: ./.github/actions/cleanup-credentials
