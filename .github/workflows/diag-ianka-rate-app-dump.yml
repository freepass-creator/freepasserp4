name: 이안카 rate-app 번들 덤프(읽기전용, 수동)

# scripts/diag-ianka-rate-app-dump.mts — 이 사이트는 Next.js RSC가 아니라 Vite SPA였다.
# rate-app-*.js(138KB)·quote-document-*.js 번들을 통째로 까서 실제 요금 호출 로직을 찾는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 rate-app 번들 덤프
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-rate-app-dump.mts
