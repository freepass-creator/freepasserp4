name: ChatGPT Audit 67 Recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit67-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record audit 67 and self-remove recorder
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          # Fail closed if the evidence changed before this recorder ran.
          grep -F "../lib/domain/estimate/cost-settings" scripts/export-standard-quote-defaults.mts >/dev/null
          grep -F "npx tsx scripts/export-standard-quote-defaults.mts" .github/workflows/export-newcar-public-snapshot.yml >/dev/null
          if grep -F "lib/domain/estimate/cost-settings.ts" .github/workflows/export-newcar-public-snapshot.yml >/dev/null; then
            echo "Source path is now covered; audit finding became stale before record." >&2
            exit 1
          fi
          if grep -F "scripts/export-standard-quote-defaults.mts'" .github/workflows/export-newcar-public-snapshot.yml >/dev/null; then
            echo "Exporter path is now covered; audit finding became stale before record." >&2
            exit 1
          fi

          if grep -F "audit (67)" docs/AI-SSOT-AUDIT-LOG.md >/dev/null; then
            echo "Audit 67 already recorded; refusing duplicate." >&2
            exit 1
          fi

          cat > docs/ai-ssot-audit/2026-09-19-chatgpt-audit67-standard-quote-defaults-trigger-gap.md <<'EOF'
          # ChatGPT Audit (67) — standard quote-defaults projection trigger gap

          Date: 2026-09-19 KST

          ## Finding

          A new browser-readable standard quote-default snapshot projection is live, but the workflow that publishes it does not track the files that actually define that snapshot.

          ## Evidence

          - Commit `d33522d2951c9b16f7e6e1a035bdb890bad36cbb` introduced `data/new-car/standard-quote-defaults.snapshot.json` and `scripts/export-standard-quote-defaults.mts`.
          - `scripts/export-standard-quote-defaults.mts` imports `COST_DEFAULTS` / `configFrom` from `lib/domain/estimate/cost-settings.ts` and writes the public snapshot in `mode: code-defaults`.
          - Commit `1c9270f2e2399becd60ba782a5628db60d84e76d` wired `npx tsx scripts/export-standard-quote-defaults.mts` into `.github/workflows/export-newcar-public-snapshot.yml`.
          - Push run `35421224976` completed `success`, and bot commit `74d5d47f3cf86e5b12090099d706b33d339f0f79` refreshed the public snapshots. The writer itself therefore works when triggered.
          - The current workflow has no cron. Its `push.paths` contains only `scripts/export-newcar-public-snapshot.mts` and `.github/workflows/export-newcar-public-snapshot.yml`; it does **not** include `lib/domain/estimate/cost-settings.ts` or `scripts/export-standard-quote-defaults.mts`.

          ## Audit conclusion

          **판정: 보류 / freshness-trigger contract incomplete**

          - Classify `data/new-car/standard-quote-defaults.snapshot.json` as a **derived/public browser projection**, not ERP5 canonical inventory authority.
          - A change to the quote-default source or its exporter can leave the published snapshot stale until a manual dispatch or an unrelated push that matches the existing workflow path filter.
          - Keep this item HOLD until Claude aligns source-trigger/freshness ownership for this projection.
          - Audit (66) conclusions for the ERP5 canonical source registry, F01/F86 projection rules, Sonogong/AutoPlus special tabs, mirror/RTDB legacy paths, legacy-writer HOLDs, and native schedule cadence are unchanged.

          No application code or business logic was modified by this audit.
          EOF

          cat >> docs/AI-SSOT-AUDIT-LOG.md <<'EOF'

          ---

          ## 2026-09-19 — ChatGPT audit (67): standard quote-defaults projection trigger gap

          **판정: 보류 / 신규 freshness drift**

          - **NEW IMPLEMENTATION:** commit `d33522d2951c9b16f7e6e1a035bdb890bad36cbb` adds `data/new-car/standard-quote-defaults.snapshot.json`, generated by `scripts/export-standard-quote-defaults.mts` from `lib/domain/estimate/cost-settings.ts`.
          - **WRITER WIRING:** commit `1c9270f2e2399becd60ba782a5628db60d84e76d` adds that exporter to `.github/workflows/export-newcar-public-snapshot.yml`. Push run `35421224976` succeeded; bot commit `74d5d47f3cf86e5b12090099d706b33d339f0f79` refreshed the snapshots.
          - **FRESHNESS GAP / HOLD:** the workflow has no cron and its `push.paths` only watches `scripts/export-newcar-public-snapshot.mts` plus the workflow file. It does not watch `lib/domain/estimate/cost-settings.ts` or `scripts/export-standard-quote-defaults.mts`. Source/default changes can therefore leave `standard-quote-defaults.snapshot.json` stale until manual dispatch or an unrelated matching push.
          - **SSOT BOUNDARY:** this artifact is a **derived/public browser projection**, not ERP5 canonical inventory authority.
          - **UNCHANGED FROM AUDIT (66):** ERP5 canonical registry, F01/F86 projection rules, Sonogong/AutoPlus special-tab rules, mirror/RTDB legacy-path conclusions, existing legacy-writer HOLDs, and native schedule cadence HOLD remain authoritative.
          - **CLAUDE ACTION:** align source-trigger/freshness ownership for this projection. Claude remains the sole implementation owner.

          Detail: `docs/ai-ssot-audit/2026-09-19-chatgpt-audit67-standard-quote-defaults-trigger-gap.md`
          EOF

          tmp="$(mktemp)"
          cat > "$tmp" <<'EOF'
          # CLAUDE-AUDIT — latest SSOT audit entry point

          ## Audit (67) override — 2026-09-19 KST

          Claude is the sole implementation owner. ChatGPT is an independent auditor only.

          ### New material delta

          - Commit `d33522d2951c9b16f7e6e1a035bdb890bad36cbb` adds browser-readable `data/new-car/standard-quote-defaults.snapshot.json`, generated by `scripts/export-standard-quote-defaults.mts` from `lib/domain/estimate/cost-settings.ts`.
          - Commit `1c9270f2e2399becd60ba782a5628db60d84e76d` wires that exporter into `.github/workflows/export-newcar-public-snapshot.yml`; push run `35421224976` succeeded and bot commit `74d5d47f3cf86e5b12090099d706b33d339f0f79` refreshed the snapshots.
          - **HOLD:** the workflow has no cron and its `push.paths` excludes both `lib/domain/estimate/cost-settings.ts` and `scripts/export-standard-quote-defaults.mts`. A quote-default source/exporter change can therefore leave the public snapshot stale until manual dispatch or an unrelated matching push.
          - Classification remains **derived/public browser projection**, not ERP5 canonical inventory authority.
          - Audit (66) conclusions for ERP5 canonical registry/F01/F86/Sonogong/AutoPlus/mirror/RTDB/native-schedule and legacy-writer HOLDs remain inherited unchanged.

          ### Claude handoff

          1. Make source-aligned trigger/freshness ownership explicit for `standard-quote-defaults.snapshot.json`; do not promote it into ERP5 inventory SSOT.
          2. Keep audit (66) native schedule and legacy-writer HOLDs unchanged absent separate evidence.

          Detail: `docs/ai-ssot-audit/2026-09-19-chatgpt-audit67-standard-quote-defaults-trigger-gap.md`

          No application code or business logic was modified by the auditor.

          ---

          EOF
          # Preserve audit (66) and earlier handoff context below the new override.
          cat CLAUDE-AUDIT.md >> "$tmp"
          mv "$tmp" CLAUDE-AUDIT.md

          git rm .github/workflows/chatgpt-audit67-recorder.yml
          git config user.name "chatgpt-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add CLAUDE-AUDIT.md docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-19-chatgpt-audit67-standard-quote-defaults-trigger-gap.md
          git commit -m "docs(audit): record quote-defaults freshness trigger gap"
          git push origin HEAD:main
