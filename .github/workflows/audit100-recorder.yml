name: Audit 100 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit100-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Audit 100 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          entry = r'''

---

