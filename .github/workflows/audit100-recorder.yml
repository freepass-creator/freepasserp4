name: Audit 100 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit100-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Audit 100 and refresh Claude entry point
        env:
          ENTRY_B64: 
          CLAUDE_B64: 
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import base64, os
          from pathlib import Path
          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8')
          if 'ChatGPT audit (100):' not in text:
              log.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          Path('CLAUDE-AUDIT.md').write_text(base64.b64decode(os.environ['CLAUDE_B64']).decode('utf-8'), encoding='utf-8')
          PY
          rm -f .github/workflows/audit100-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md .github/workflows/audit100-recorder.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(audit): record audit 100 ERP5 full-green state"
          git push origin HEAD:main
