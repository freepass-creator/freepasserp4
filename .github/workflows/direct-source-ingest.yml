name: 원천 직접 수집

on:
  workflow_dispatch:
    inputs:
      only:
        description: '특정 공급사 코드(쉼표 구분, 비우면 24곳)'
        type: string
        required: false
      apply:
        description: 'Firestore 원자 반영'
        type: boolean
        default: false

concurrency:
  group: direct-source-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 원천 계약 검사
        run: npm run check:inventory-sources
      - name: 자격증명 준비
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SHEETS_SA: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          SONOGONG: ${{ secrets.SONOGONG_ACCOUNT_JSON }}
        shell: bash
        run: |
          test -n "$FIREBASE_SA" || { echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON 누락'; exit 1; }
          test -n "$SHEETS_SA" || { echo '::error::GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON 누락'; exit 1; }
          test -n "$SONOGONG" || { echo '::error::SONOGONG_ACCOUNT_JSON 누락'; exit 1; }
          mkdir -p tmp/firebase-auth sonokong/lib/wonja
          printf '%s' "$FIREBASE_SA" > tmp/firebase-auth/firebase.json
          printf '%s' "$SHEETS_SA" > tmp/firebase-auth/sheets.json
          printf '%s' "$SONOGONG" > sonokong/lib/wonja/.손오공계정.json
      - name: 손오공 ERP 원문 갱신
        run: node sonokong/scripts/손오공.mjs --조용
      - name: SOURCE → RAW → ATOM 미리보기
        env:
          GOOGLE_APPLICATION_CREDENTIALS: tmp/firebase-auth/firebase.json
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: tmp/firebase-auth/sheets.json
          GOOGLE_WORKSPACE_SUBJECT: pyh@teamjpk.com
        shell: bash
        run: |
          ARGS=()
          if [ -n "${{ inputs.only }}" ]; then ARGS+=("--only=${{ inputs.only }}"); fi
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS+=(--apply --variable --retire); fi
          npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/ingest-all-suppliers.mts "${ARGS[@]}"
      - name: 자격증명 제거
        if: always()
        run: rm -rf tmp/firebase-auth sonokong/lib/wonja/.손오공계정.json sonokong/lib/wonja/.손오공토큰.json
