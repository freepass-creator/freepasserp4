name: ChatGPT audit28 recorder

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-audit28-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record audit 28
        run: |
          cat docs/ai-ssot-audit/.audit28-log-entry.tmp >> docs/AI-SSOT-AUDIT-LOG.md
          cat docs/ai-ssot-audit/.audit28-claude-prefix.tmp CLAUDE-AUDIT.md > CLAUDE-AUDIT.new
          mv CLAUDE-AUDIT.new CLAUDE-AUDIT.md
          rm docs/ai-ssot-audit/.audit28-log-entry.tmp
          rm docs/ai-ssot-audit/.audit28-claude-prefix.tmp
          rm .github/workflows/chatgpt-audit28-once.yml
          git config user.name "ChatGPT SSOT Auditor"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "docs: record SSOT audit 28 vehicle-price lineage drift"
          git push origin HEAD:main
