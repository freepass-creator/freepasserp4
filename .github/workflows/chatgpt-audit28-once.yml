          detail = r'''# ChatGPT 독립 SSOT 감사 — audit (28): 차량가격 차량별 Atom/projection 수정이 production 밖에만 존재

검토일: 2026-09-17

## 판정

**충돌 — active production pin `6a6f3f75c065143ad14286d08baa28e382535eea`은 차량별 가격을 canonical source에서 Atom으로 읽어 보존하고 발행에서 차량별 값을 우선하는 계약을 갖고 있지 않다. 이 수정은 Claude feature lineage `b6933732...` → `b0aedeee...`에 구현·실측됐지만 production/main에는 미반영이다.**

이 finding은 audit (27)의 손오공 보증금 recurrence와 별개다. audit (27)이 `e5fac1b...`가 production보다 3 commits ahead라고 기록했지만, 그 3커밋 중 앞선 두 커밋에 포함된 vehicle-price 의미 변경은 별도 감사 결론으로 기록되지 않았다.

## 증거 1 — production collector는 차량가격 열을 읽지 않는다

production `6a6f3f75...`의 `scripts/ingest-supplier-to-firestore.mts`:

- `resolveCols()`에 `차량가격`, `소비자가격`, `차량가`, `차량가액`, `차량금액` 탐지가 없다.
- `Row` type에도 `carPrice`가 없다.
- 따라서 시트형 canonical source의 차량별 가격이 Atom `consumer_price`로 들어가는 경로가 없다.

## 증거 2 — production projection은 차량가격에서 supplier policy가 먼저다

같은 pin의 `lib/domain/sales-atom-row.ts`는 `sp[col]`이 존재하면 `소비자가격/가격/금액`을 supplier policy 값으로 즉시 반환한다. 차량별 Atom 값을 먼저 보는 분기가 없다. 이후 direct map에도 차량가격이 없고 마지막 fallback은 소비자가격을 빈칸으로 둔다.

즉 현재 production code contract만 보면 차량별 가격은:

1. 공급사 정책 공통값이 있으면 그 값으로 전 차량에 동일하게 보일 수 있고,
2. 공통값도 없으면 빈칸/미입력 쪽으로 떨어질 수 있다.

## 증거 3 — `b6933732...`에서 실제 오표시를 재현하고 sheet-source 경로를 수정

commit `b6933732cfd4494d41eeddc1f75ed92e027d1ff3` 기록:

- 손오공 listable 258대가 판매 projection에서 전부 `36,000,000`으로 표시됨.
- 원천에는 차량별 가격이 달랐고 RP004에서도 예: 21,480,000 / 20,080,000 / 18,901,408처럼 서로 다른 값이 존재.
- fix는 source column alias `차량가격/소비자가격/차량가/차량가액/차량금액`을 추가하고 `carPrice`를 Atom `consumer_price`에 저장.
- 판매 projection은 차량가격에 한해 **Atom 차량별 값 우선 → 정책 fallback** 순서로 변경.
- RP004 반영 후 `consumer_price` 종류가 전부 빈값 상태에서 46개 서로 다른 값으로 분화됐다고 자체 검증.

## 증거 4 — `b0aedeee...`에서 Sonogong API 가격도 누락돼 있었음을 확인

commit `b0aedeee38a5fb47c97af2cc032e9d021f107fa8` 기록:

- Sonogong API dump `손오공차량.json` 296대 전부에 `차량가격` 필드가 있었지만 collector가 읽지 않았음.
- `carPrice: S(c.차량가격)`를 Sonogong API row에 배선.
- listable 전체 차량가격 보유가 `121/710 (17%) → 352/710 (50%)`로 증가.
- RP012 손오공 258대는 `0 → 전량` 가격 보유로 변함.
- RP031 164대는 source 자체가 비어 있어 미입력이 정답으로 남고, RP023 61대/RP006 28대는 별도 source path라 추가 확인 대상으로 남음.

## 증거 5 — 수정 계보는 active production/main 밖

Git compare `6a6f3f75...` → `e5fac1b40de282f0a59dc22a39cc42a2e01de8d3`:

- status `ahead`
- merge-base = `6a6f3f75...`
- ahead by 3 commits
- 변경 파일에 `sales-atom-row.ts`, `sales-published-tabs.ts`, `capture-sales-publish-snapshot.mts`, `ingest-supplier-to-firestore.mts` 포함

그 3커밋은 `b6933732...`(sheet vehicle price) → `b0aedeee...`(Sonogong API vehicle price) → `e5fac1b...`(deposit recurrence guard) 계보다.

반면 canonical `.github/workflows/erp5-ssot-refresh.yml`은 여전히 `6a6f3f75...`를 checkout한다. current main collector는 `SSOT HARD GUARD` stub이므로 feature implementation이 main으로 이식됐다고 볼 수도 없다.

## 운영 의미와 범위

현재 live 시트가 즉시 잘못됐다고 단정하지 않는다. feature branch 테스트 과정에서 live Atom이 이미 보강됐을 수 있고 canonical workflow는 현재 disabled다. 그러나 `6a6f3f75...` ingest가 다시 실행될 때 차량별 가격을 source에서 재생성하고 projection에 차량별 우선순위를 보장할 수 없다는 것은 코드상 확정이다.

따라서 이 문제는 **현재값 단발성 정정**보다 **production lineage의 재발/의미 보존 gap**으로 취급해야 한다.

## Claude 구현 Owner 인계

1. `b6933732...`와 `b0aedeee...`의 vehicle-price semantics를 current production lineage에 선택 이식한다.
2. audit (27)의 `e5fac1b...` deposit normalization guard와 같은 계보에 합치되 7-canonical product type, `오공구독`, F86, settlement lock, publication gate를 되돌리지 않는다.
3. RP004의 서로 다른 차량가격 표본과 Sonogong API 차량을 차량번호 기준으로 SOURCE→ATOM→F01/F86 대조한다.
4. source가 가격을 안 주는 차량은 미입력 의미를 유지하고 임의 계산/정책값 생성으로 채우지 않는다. supplier-policy fallback을 유지할 경우 차량 단위 사실보다 앞서지 않도록 계약을 검증한다.
5. RP023/AutoPlus와 RP006/Iron의 canonical source에 차량가격이 실제 존재하는지는 별도 확인한다.

이번 감사에서는 application code나 business logic을 수정하지 않았다.
