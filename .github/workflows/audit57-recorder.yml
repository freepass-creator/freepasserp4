name: audit57 one-shot recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit57-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append audit 57
        shell: bash
        run: |
          if grep -q '^## 2026-09-18(57)' docs/AI-SSOT-AUDIT-LOG.md; then
            echo 'audit57 already recorded'
            exit 0
          fi
          cat >> docs/AI-SSOT-AUDIT-LOG.md <<'EOF'

