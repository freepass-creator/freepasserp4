name: audit57 one-shot recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit57-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append audit 57
        shell: bash
        run: |
          if grep -q '^## 2026-09-18(57)' docs/AI-SSOT-AUDIT-LOG.md; then
            echo 'audit57 already recorded'
            exit 0
          fi
          echo '' | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md
          git commit -m 'docs(audit): append audit57 scheduled green verdict'
          git push origin HEAD:main
