name: 이안카 수집기(수동)

# ianka/scripts/이안카.mjs → 이안카-요금스크랩.mjs → 이안카-재고시트.mjs 를 돌린다.
# apply=false(기본)면 미리보기만(라이브 안 건드림). apply=true 면 원천시트(RP031,
# 1fJuFSdaW…)에 --쓰기 로 반영한다 — FILLIFEMPTY(빈 칸만 채움)라 기존 수기값은 안 건드리되,
# 실제 쓰기이므로 사람이 workflow_dispatch 로 켤 때만 실행된다(자동 스케줄 없음).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영(--쓰기). 기본은 미리보기만.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 자격증명 준비
        env:
          SHEETS_SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SHEETS_SA" || { echo '::error::GOOGLE_SA_JSON 누락'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SHEETS_SA" > tmp/firebase-auth/sa.json
      - name: 이안카 재고 수집(정본 lib/wonja/이안카차량.json)
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: node ianka/scripts/이안카.mjs
      - run: npx playwright install --with-deps chromium
      - name: 이안카 요금표 스크랩(부트스트랩, SSOT 아님 — lib/wonja/이안카요금.json)
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: node ianka/scripts/이안카-요금스크랩.mjs
      - name: 원천시트 매핑(apply=true 면 --쓰기)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sa.json
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            node ianka/scripts/이안카-재고시트.mjs --쓰기
          else
            node ianka/scripts/이안카-재고시트.mjs
          fi
      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ianka-collector-preview
          path: |
            ianka/lib/wonja/이안카차량.json
            ianka/lib/wonja/이안카요금.json
            ianka/tmp/이안카재고시트-preview.json
          if-no-files-found: warn
          retention-days: 7
      - name: 자격증명 삭제
        if: always()
        run: rm -rf tmp/firebase-auth ianka/lib/wonja
