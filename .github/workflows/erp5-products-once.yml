name: ERP5 상품 SSOT 1회 게시

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/erp5-products-once.yml'

concurrency:
  group: erp5-firestore-ssot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ERP5 상품 SSOT 회귀검사
        run: |
          npm run sim:erp5-product-ssot
          npx tsx scripts/test-ssot-adapters.mts
          npx tsx scripts/sim-product-master-sheet.mts
          npx tsx scripts/sim-deposit-cap.mts
          npm run check:erp5-firebase
      - name: 공용 Firebase·원천 읽기 자격증명 준비
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SA" || { echo '::error::GOOGLE_SA_JSON 시크릿이 없습니다.'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json
      - name: 공용 Firebase에 ERP5 상품 검증본 게시
        run: |
          VERSION="same-firebase-products-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx tsx scripts/publish-products-to-erp5-firestore.mts \
            --version="$VERSION" \
            --apply
