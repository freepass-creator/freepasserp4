name: audit65 one-shot recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit65-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Record audit 65 and refresh Claude entry point
        env:
          AUDIT_B64: ''
          CLAUDE_B64: ''
        run: |
          python - <<'PY'
          import base64, os, pathlib
          log = pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          if '## 2026-09-19(65)' not in text:
              log.write_text(text + base64.b64decode(os.environ['AUDIT_B64']).decode('utf-8'), encoding='utf-8')
          pathlib.Path('CLAUDE-AUDIT.md').write_text(base64.b64decode(os.environ['CLAUDE_B64']).decode('utf-8'), encoding='utf-8')
          PY
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          git rm .github/workflows/audit65-recorder.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs(audit): record audit65 and refresh Claude entry point'
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
