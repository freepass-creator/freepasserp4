name: audit65 one-shot recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit65-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Record audits 64 and 65
        env:
          ENTRY_B64: ''
        run: |
          python -c "import base64,os,pathlib; p=pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md'); t=p.read_text(); e=base64.b64decode(os.environ['ENTRY_B64']).decode(); marker='## 2026-09-19(65)'; p.write_text(t if marker in t else t+e)"
          git add docs/AI-SSOT-AUDIT-LOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(audit): backfill audit64 and append audit65'
            git push origin HEAD:main
          fi
