name: audit65 one-shot recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit65-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Record audit 65 and refresh Claude entry point
        shell: bash
        run: |
          if ! grep -q '^## 2026-09-19(65)' docs/AI-SSOT-AUDIT-LOG.md; then
            cat >> docs/AI-SSOT-AUDIT-LOG.md <<'AUDIT_ENTRY'

