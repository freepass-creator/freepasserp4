name: One-time F86 publish from validated ERP5 pin

on:
  push:
    paths:
      - '.github/workflows/manual-erp5-full-sync-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: erp5-inventory-publish
  cancel-in-progress: true

jobs:
  publish-f86:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated ERP5 production engine
        uses: actions/checkout@v4
        with:
          ref: 6a6f3f75c065143ad14286d08baa28e382535eea
      - name: Authenticate freepasserp5
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110304297079/locations/global/workloadIdentityPools/github-actions/providers/freepasserp4
          service_account: github-inventory-writer@freepasserp5.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Prepare Sheets credential
        env:
          SHEETS_SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SHEETS_SA" || { echo '::error::GOOGLE_SA_JSON missing'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SHEETS_SA" > tmp/firebase-auth/sheets.json
      - name: Heal Sonogong deposit atoms to SSOT rule
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/heal-sonokong-deposit-ssot.mts --apply
      - name: Capture current ERP5 snapshot and enforce deposit-rule gate
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
        run: npx tsx scripts/capture-sales-publish-snapshot.mts --erp5 --out=tmp/erp5-sales-publish.json
      - name: Backup F86 before publish
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/backup-f86.mts --label=manual-deposit-${{ github.run_id }}
      - name: Publish F86 from validated snapshot
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
          FREEPASS_MANUAL_PUBLISH_APPROVED: '2026-09-17 F86 deposit-rule verified publish'
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/build-channel-supplier-sheet.mts --채널=하허호 --apply --snapshot=tmp/erp5-sales-publish.json
      - name: Audit F86 vs atoms
        continue-on-error: true
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/audit-f86-vs-atom.mts --snapshot=tmp/erp5-sales-publish.json --max-age-min=120
      - name: Preserve snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-f86-deposit-snapshot-${{ github.run_id }}
          path: tmp/erp5-sales-publish.json
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup credentials
        if: always()
        run: rm -rf tmp/firebase-auth
