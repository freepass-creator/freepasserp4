name: ChatGPT audit45 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit45-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit45 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -c "import base64,pathlib; p=pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md'); e=base64.b64decode('').decode(); t=p.read_text(encoding='utf-8'); p.write_text(t if '## 2026-09-18(45) —' in t else t+e, encoding='utf-8')"
          python -c "import base64,pathlib; pathlib.Path('CLAUDE-AUDIT.md').write_text(base64.b64decode('').decode(), encoding='utf-8')"
          git rm .github/workflows/chatgpt-audit45-recorder.yml
          git config user.name 'chatgpt-ssot-auditor'
          git config user.email 'noreply@openai.com'
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          git commit -m 'docs(audit): record audit45 schedule/color resolution and F86 checker hold'
          git push origin HEAD:main
