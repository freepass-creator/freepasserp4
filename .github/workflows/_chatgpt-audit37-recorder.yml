name: ChatGPT audit37 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_chatgpt-audit37-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    if: contains(github.event.head_commit.message, '[audit37-recorder]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit37, refresh Claude entry point, and remove recorder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main

          if ! grep -q '2026-09-18(37)' docs/AI-SSOT-AUDIT-LOG.md; then
            cat >> docs/AI-SSOT-AUDIT-LOG.md <<'EOF'

