# ChatGPT 독립 SSOT 감사 — audit 37: RP031 rendered finance provenance

검수일: 2026-09-18 KST

## 판정

**새 진단 증거는 생겼지만 RP031 source promotion은 계속 HOLD다.** 실제 B2B 브라우저에서는 월대여료·보증금이 보이지만, 현재 확인된 `/api/rates`, sampled `/api/vehicle-detail`, raw home HTML은 그 금융값 source가 아니며, 실 브라우저 네트워크에서는 별도 rate API 호출도 관측되지 않았다. 정확한 authoritative primitive는 아직 미확정이다.

## 실제 증거

### 1. `/api/rates` 403는 현재 B2B role의 권한 경계

PR #383 merge `a10c440e75fc44b7a2c14907ed6d6f91e550ba21`, Actions run `35285455412`, job `105416656871`:

- 로그인 성공
- `/api/members` 200에서 현재 session role=`b2b`
- `/api/admin?scope=permissions` 403
- 브라우저형 header로 호출한 `/api/rates`도 403 `관리자 권한이 필요합니다`

따라서 기존 403를 단순 cookie/header 누락으로 설명할 수 없다.

### 2. raw authenticated home HTML에는 금융값이 없음

PR #384 merge `f5e738f5e838fd914e11f6c6731679495f1a259a`, Actions run `35285926665`, job `105418111697`:

- authenticated home GET 200
- 화면에서 확인된 known rate exact-value match 0
- `보증금`, `월 대여료`, `일 대여료`, `rate`, `deposit` 계열도 raw HTML에서 0

즉 initial HTML 자체는 금융값 authority가 아니다.

### 3. 실 브라우저에서는 금융값이 렌더링되지만 별도 rate API가 보이지 않음

PR #385 merge `46f2d828fe0f4488e908b90fe7d729a518828666`, Actions run `35286380178`, job `105419530750`:

- 같은 세션을 headless browser에 주입해 home 진입 성공
- 실제 DOM에 `월대여`, `보증금`과 원화 금액이 존재
- 캡처된 요청 중 API 호출은 `GET /api/inventory` 200 하나
- `/api/rates` network call 없음

이 결과는 “UI에 금융값이 실제 존재한다”는 사실과 “현재 알려진 rate endpoint는 그 값을 공급하지 않는다”는 사실을 동시에 확정한다.

### 4. 아직 확정하면 안 되는 것

- `/api/inventory`가 금융값의 canonical source라는 결론: **미증명**. plain diagnostic 응답에서는 금융값이 확인되지 않았고, browser-header 차이인지 client calculation/static bundle인지 아직 확정되지 않았다.
- rendered DOM을 canonical source로 삼는 것: **보류**. DOM은 소비 결과일 수 있으므로 source primitive와 계산 규칙 provenance가 먼저 필요하다.
- RP031 API→sheet feeder production promotion: **보류**. current registry는 계속 Google Sheet다.

open PR #387 (`diag/ianka-inventory-browser-headers`)은 browser-like headers로 `/api/inventory`를 재검증하는 read-only diagnostic이다. PR 설명의 header hypothesis는 결과가 나오기 전까지 가설로 취급한다.

## 다른 SSOT 축 재대조

- production pin: `9bef7bf0ffd21a96e3098a6f31adf1b1a0258c60` 유지
- canonical RP031: `lib/domain/inventory-source-registry.ts` = `google_sheet`
- F01/F86 row source: 같은 Atom row 계약(`lib/domain/sales-atom-row.ts`)
