name: ChatGPT audit 74 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit74-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record audit 74
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          audit_b64 = ''
          detail_b64 = ''
          claude_b64 = ''
          audit_entry = base64.b64decode(audit_b64).decode('utf-8')
          detail = base64.b64decode(detail_b64).decode('utf-8')
          claude_entry = base64.b64decode(claude_b64).decode('utf-8')
          audit_path = Path('docs/AI-SSOT-AUDIT-LOG.md')
          detail_path = Path('docs/ai-ssot-audit/2026-09-19-chatgpt-audit74-native-erp5-overlap.md')
          claude_path = Path('CLAUDE-AUDIT.md')
          audit = audit_path.read_text(encoding='utf-8')
          if 'ChatGPT audit (74): direct ERP5 native cron returned' not in audit:
              audit_path.write_text(audit.rstrip() + '\n\n' + audit_entry + '\n', encoding='utf-8')
          if not detail_path.exists():
              detail_path.write_text(detail + '\n', encoding='utf-8')
          claude_text = claude_path.read_text(encoding='utf-8')
          if '## Audit (74) override' not in claude_text:
              claude_path.write_text(claude_entry + claude_text, encoding='utf-8')
          PY
          git rm .github/workflows/chatgpt-audit74-recorder.yml
          git config user.name "chatgpt-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-19-chatgpt-audit74-native-erp5-overlap.md CLAUDE-AUDIT.md
          git commit -m "docs(audit): record audit 74 native ERP5 overlap"
          git push origin HEAD:main
