name: ChatGPT audit 73 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit73-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append audit 73 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          audit_entry = base64.b64decode('').decode('utf-8')
          claude_entry = base64.b64decode('').decode('utf-8')
          detail = base64.b64decode('').decode('utf-8')

          audit_path = Path('docs/AI-SSOT-AUDIT-LOG.md')
          claude_path = Path('CLAUDE-AUDIT.md')
          detail_path = Path('docs/ai-ssot-audit/2026-09-19-chatgpt-audit73-native-settlement-1805-delivered.md')

          audit = audit_path.read_text(encoding='utf-8')
          if 'ChatGPT audit (73): 18:05 native settlement slot delivered' not in audit:
              audit_path.write_text(audit.rstrip() + '\n\n' + audit_entry.rstrip() + '\n', encoding='utf-8')

          claude = claude_path.read_text(encoding='utf-8')
          if '## Audit (73) override' not in claude:
              claude_path.write_text(claude_entry + claude, encoding='utf-8')

          if not detail_path.exists():
              detail_path.write_text(detail, encoding='utf-8')
          PY

          git rm .github/workflows/chatgpt-audit73-recorder.yml
          git config user.name "chatgpt-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md docs/ai-ssot-audit/2026-09-19-chatgpt-audit73-native-settlement-1805-delivered.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(audit): record audit 73 native settlement delivery"
          git push origin HEAD:main
