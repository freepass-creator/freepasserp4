name: One-shot audit 35 recorder

on:
  push:
    paths:
      - '.github/workflows/audit35-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append audit 35
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          echo '' | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md
          git commit -m 'audit: append audit35 scheduled delivery finding'
          git push origin HEAD:main
