name: 시트 동기화·발행

# ★왜(사장님 2026-08-14 — 「시트동기화는 코드로 움직이는건가??」)
#   지금까지는 사람이 명령을 쳐야 돌았다. 그러면 반드시 빠지고, 빠져도 아무도 모른다 —
#   영업자가 옛 값을 보면서 그게 옛 값인 줄 모르는 것이 이 구조의 유일한 «조용한» 실패다.
#   PC 가 꺼져 있어도 돌아야 하므로 이 PC 스케줄러가 아니라 여기서 돈다.
#
# ⚠ 이 워크플로가 **쓰기**를 한다(구글시트). 실패하면 그 흔적이 Actions 기록에 남아야 한다.
#   그래서 실패를 삼키지 않는다.
# ⚠ 자격증명은 `GOOGLE_SA_JSON` 시크릿 하나뿐이다. 리포에 키를 커밋하지 마라.

on:
  schedule:
    # ★사장님 2026-08-21 「하루 한번은 너무 적은데」 → 영업시간에 2시간마다.
    #   09:10 · 11:10 · 13:10 · 15:10 · 17:10 · 19:10 KST (UTC 00·02·04·06·08·10 시 10분)
    #   공급사가 낮에 고친 값이 같은 날 영업자·영업채널에 간다.
    #   ⚠ 공개 리포라 Actions 분은 무료다 — 더 자주도 되지만, 발행은 판매시트 탭을 통째로 다시 그리므로
    #     영업자가 보는 중에 새로 그려지는 일이 잦아진다. 2시간이 그 둘의 절충이다.
    #     겹쳐 도는 것은 아래 concurrency 가 막는다.
    - cron: '10 0,2,4,6,8,10 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓸까(체크 안 하면 미리보기만)'
        type: boolean
        default: false

concurrency:
  # ⚠ 두 번이 겹쳐 돌면 같은 탭을 서로 덮는다. 앞엣것이 끝날 때까지 기다린다.
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # run-daily 가 한 번에 도는 일이 늘었다(판매시트 3탭 + 공급사 「상품시트」 탭 + 영업채널 카드시트).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::GOOGLE_SA_JSON 시크릿이 없다. 리포 Settings → Secrets 에 넣어라."
            exit 1
          fi
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json

      # ── ① 일일 반영 한 방 — 단계를 여기 나열하지 않는다.
      #    ★사장님 2026-08-21 「워크플로가 run-daily 하나만 부르게」.
      #      전에는 스텝을 하나씩 적어 뒀는데, 그러면 코드에 단계가 늘어도 워크플로가 따라오지 못한다.
      #      실제로 폐기된 「손오공인수형구독」 스텝이 남아 돌고 있었고(08-19 3탭 체제로 바뀜),
      #      08-21 에 더한 ④″ 영업채널 카드시트는 아예 돌지 않았다. 차례의 정본은 scripts/run-daily.mts 다.
      #    돌리는 차례: ① 정제시트 갱신(--with-mirror) → ①″ 정제칸 원문 재정렬 → ② 정제칸 채움 →
      #      ③ 못 정한 차 결정 → ④ 판매시트 3탭 + 공급사 「상품시트」 탭 → ④″ 영업채널 카드시트 →
      #      ⑤ 상품마스터 → ⑤′ 상품리스트 맞춤 → ⑥ 검수.
      #    ⚠ 한 단계가 실패하면 run-daily 가 거기서 멈추고 1 로 끝난다 — 낡은 값을 다음 단계로 넘기지 않는다.
      #      발행 가드(공급사 하나가 0대로 줄면 멈춤)에 걸리면 사람이 확인하고 --force-shrink 로 다시 돌린다.
      - name: 일일 반영(run-daily)
        run: |
          npx tsx scripts/run-daily.mts --with-mirror ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      - name: 일일 반영 요약
        if: always()
        run: cat tmp/run-daily-report.txt || echo '(요약 파일 없음 — run-daily 가 시작도 못 했다)'

      # ── ② 게이트 — run-daily 는 검수 결과를 «보여만» 준다. 여기서 다시 돌려 어긋나면 1 로 끝내고 빨간 불을 켠다.
      #    ⚠ 상품마스터·ERP 게이트는 뺐다(사장님 2026-08-21 「상품마스터 연동 안함」).
      #      상품마스터를 안 맞추는데 ERP 와 같은지 따지면 매번 빨간 불이 뜬다 — 그러면 빨간 불이 뜻을 잃는다.
      #      ERP 를 다시 맞출 때는 사람이 `npx tsx scripts/run-daily.mts --with-master --apply` 로 돌린다.
      - name: 돈 대조
        run: npx tsx scripts/audit-sheet-vs-sales.mts

      - name: 제공시트 양식 대조
        run: npx tsx scripts/audit-supplier-schema.mts

      - name: 매뉴얼이 코드와 맞나
        run: npm run check:manual

      - name: 자격증명 지우기
        if: always()
        run: rm -rf tmp/firebase-auth
