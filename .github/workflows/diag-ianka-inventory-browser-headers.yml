name: 이안카 inventory 브라우저 헤더 재현(읽기전용, 수동)

# scripts/diag-ianka-inventory-browser-headers.mts — 실 브라우저 네트워크 캡처에서
# 요금 렌더링 시 호출된 API가 /api/inventory 하나뿐임을 확인했다(/api/rates 호출 없음).
# plain fetch에 브라우저 헤더(Accept·sec-ch-ua·Referer 등)를 흉내 내 다시 불러본다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 inventory 브라우저 헤더 재현
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-inventory-browser-headers.mts
