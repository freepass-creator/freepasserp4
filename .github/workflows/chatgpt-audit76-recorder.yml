name: ChatGPT Audit 76 Recorder

"on":
  push:
    paths:
      - '.github/workflows/chatgpt-audit76-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit 76
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          echo '' | base64 -d > docs/ai-ssot-audit/2026-09-19-chatgpt-audit76-false-settlement-recovery-replayed-successful-native-slot.md
          echo '' | base64 -d > CLAUDE-AUDIT.md
          git config user.name 'chatgpt-auditor'
          git config user.email 'chatgpt-auditor@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-19-chatgpt-audit76-false-settlement-recovery-replayed-successful-native-slot.md CLAUDE-AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(audit): record audit 76 recovery replay drift'
          git push
