name: 계약상태 레거시 감사(수동)

# ★2026-09-18 — 상품/계약락 writer 단일화.
# 이 워크플로는 과거 공급사 시트·F01·ERP5 products를 직접 고치던 30분 writer였다.
# 현재 canonical 상품/계약락 writer는 `ERP5 SSOT 원천 최신화(매시간)` 한 곳뿐이다.
# 따라서 이 워크플로는 schedule과 apply를 제거하고, 과거 로직의 차이만 보는 수동 dry-run 감사로 남긴다.
# 실제 반영은 erp5-ssot-refresh.yml의 fixed snapshot 경로를 통해서만 한다.

on:
  workflow_dispatch:

concurrency:
  group: erp5-inventory-publish
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: freepasserp5 OIDC 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110304297079/locations/global/workloadIdentityPools/github-actions/providers/freepasserp4
          service_account: github-inventory-writer@freepasserp5.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}

      - name: 과거 계약중 표기 경로 차이 감사(dry-run)
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sa.json
        run: npx tsx scripts/mark-contract-in-listings.mts

      - name: 자격증명 지우기
        if: always()
        uses: ./.github/actions/cleanup-credentials
