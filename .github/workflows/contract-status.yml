name: 계약중 표기(30분)

# ★사장님 2026-08-25 「30분에 한번씩 여기 계약중이라고 되어있는 차량을 상품리스트,
#   공급사 정제시트에 계약중이라고 표기해서 영업자들이 혼선없게끔」.
#
# ★**왜 발행(2시간)을 기다리면 안 되나** — 그 사이 영업자가 「출고가능」을 보고 판다.
#   그래서 발행과 따로, 가볍게, 30분마다 **상태 칸만** 고친다.
#   탭을 다시 그리지 않는다 — 발행은 표를 통째로 새로 그려서 보는 중에 사라졌다 나타난다.
#
# ★두 곳을 다 고친다 — 공급사 시트(정본) + 상품리스트(사본).
#   공급사 시트를 안 고치면 다음 발행이 옛 값으로 되돌린다.
# ★「출고불가」는 안 덮는다. 계약중보다 센 말이다 — 덮으면 팔면 안 되는 차가 목록에 다시 선다.
#
# ⚠ schedule 은 **기본 브랜치(main)** 에서만 돈다. 이 파일이 main 에 있어야 한다.
# ⚠ 같은 시트를 발행·미러도 쓴다 — concurrency 를 그것들과 **같은 그룹**으로 둬서 겹치지 않게 한다.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓸까(체크 안 하면 미리보기만)'
        type: boolean
        default: false

concurrency:
  # ERP5 원자와 판매시트를 함께 쓰는 직접수집 회차와 직렬화한다.
  group: erp5-inventory-publish
  cancel-in-progress: false

jobs:
  mark:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: freepasserp5 OIDC 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110304297079/locations/global/workloadIdentityPools/github-actions/providers/freepasserp4
          service_account: github-inventory-writer@freepasserp5.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}

      - name: 계약중 표기
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sa.json
        run: |
          npx tsx scripts/mark-contract-in-listings.mts ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}

      - name: 자격증명 지우기
        if: always()
        uses: ./.github/actions/cleanup-credentials
