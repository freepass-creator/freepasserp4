name: 이안카 인증·권한 심층 진단(읽기전용, 수동)

# scripts/diag-ianka-auth-deep-dive.mts — 사장님이 실제 브라우저로 확인한 바로는
# 같은 계정으로 요금이 화면에 보인다. 그런데 우리 fetch는 /api/rates에서 403이 난다 —
# 계정 권한이 아니라 우리 호출 흐름 문제일 가능성이 커서, 로그인 응답 전체와
# 권한/회원 정보 엔드포인트를 다 까본다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 인증·권한 심층 진단
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-auth-deep-dive.mts
