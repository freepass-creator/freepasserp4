name: ChatGPT Audit 92-93 Recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit92-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append Audit 92-93 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import base64
          from pathlib import Path
          a92 = base64.b64decode('').decode('utf-8')
          a93 = base64.b64decode('').decode('utf-8')
          c93 = base64.b64decode('').decode('utf-8')
          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          if '## 2026-09-21 — ChatGPT audit (92): c383 runtime full-green; monitor reconciliation WATCH' not in text:
              text = text.rstrip() + a92 + '\n'
          if '## 2026-09-21 — ChatGPT audit (93): 15:05 recovery continuity gap; monitor state still stale' not in text:
              text = text.rstrip() + a93 + '\n'
          log.write_text(text, encoding='utf-8')
          claude = Path('CLAUDE-AUDIT.md')
          ctext = claude.read_text(encoding='utf-8')
          if '# Claude 실행 오더 — Audit (93) override' not in ctext:
              claude.write_text(c93 + ctext, encoding='utf-8')
          PY
          git rm -f .github/workflows/chatgpt-audit92-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          git commit -m "docs(audit): integrate audits 92-93 and refresh Claude entry"
          git push origin HEAD:main
