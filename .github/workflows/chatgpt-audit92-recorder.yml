name: ChatGPT Audit 92 Recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit92-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append Audit 92 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import base64
          central_b64 = ""
          claude_b64 = ""
          central = base64.b64decode(central_b64).decode('utf-8')
          centry = base64.b64decode(claude_b64).decode('utf-8')
          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          marker = '## 2026-09-21 — ChatGPT audit (92): c383 production full-green; 14:05 recovery full-green, monitor still stale'
          text = log.read_text(encoding='utf-8')
          if marker not in text:
              log.write_text(text.rstrip() + central + '\n', encoding='utf-8')
          claude = Path('CLAUDE-AUDIT.md')
          cmarker = '# Claude 실행 오더 — Audit (92) override'
          ctext = claude.read_text(encoding='utf-8')
          if cmarker not in ctext:
              claude.write_text(centry + ctext, encoding='utf-8')
          PY
          git rm -f .github/workflows/chatgpt-audit92-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md .github/workflows/chatgpt-audit92-recorder.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(audit): record audit 92 runtime validation"
          git push origin HEAD:main
