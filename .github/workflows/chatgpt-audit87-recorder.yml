name: ChatGPT Audit 87 Recorder

on:
  push:
    paths:
      - '.github/workflows/chatgpt-audit87-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record audit 87
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          if ! grep -q 'ChatGPT audit (87)' docs/AI-SSOT-AUDIT-LOG.md; then
            cat docs/ai-ssot-audit/.audit87-central-fragment.md >> docs/AI-SSOT-AUDIT-LOG.md
            cat docs/ai-ssot-audit/.audit87-claude-prefix.md CLAUDE-AUDIT.md > /tmp/CLAUDE-AUDIT.md
            mv /tmp/CLAUDE-AUDIT.md CLAUDE-AUDIT.md
          fi
          git rm --ignore-unmatch docs/ai-ssot-audit/.audit87-central-fragment.md
          git rm --ignore-unmatch docs/ai-ssot-audit/.audit87-claude-prefix.md
          git rm --ignore-unmatch .github/workflows/chatgpt-audit87-recorder.yml
          git config user.name 'chatgpt-auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add CLAUDE-AUDIT.md docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-21-chatgpt-audit87-1005-postpublish-audit-red-1105-green.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(audit): record audit 87 recovery validation state'
          git push origin HEAD:main
