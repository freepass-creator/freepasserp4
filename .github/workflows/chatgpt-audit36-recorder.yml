name: ChatGPT audit36 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit36-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit 36 and remove recorder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          python .github/chatgpt-audit36-record.py
          git rm .github/workflows/chatgpt-audit36-recorder.yml .github/chatgpt-audit36-record.py
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-18-chatgpt-audit36-ianka-vehicle-detail-no-rates.md CLAUDE-AUDIT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'audit: record audit36 RP031 vehicle-detail provenance'
          git push origin HEAD:main
