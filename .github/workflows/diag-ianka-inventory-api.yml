name: 이안카 재고 API 진단(읽기전용, 수동)

# scripts/diag-ianka-inventory-api.mts — 로그인 후 /api/inventory 응답 구조를 본다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 재고 API 진단
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-inventory-api.mts
