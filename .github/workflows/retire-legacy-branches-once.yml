name: Retire legacy branches once

on:
  push:
    paths:
      - '.github/workflows/retire-legacy-branches-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete retired branches but keep main and recovery archive
        env:
          KEEP_ARCHIVE: archive/legacy-branches-20260926
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort -u)
          deleted=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              HEAD|main|"$KEEP_ARCHIVE")
                continue
                ;;
            esac
            echo "Deleting retired branch: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done
          echo "Deleted $deleted retired branches."

      - name: Remove this one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freepass-creator"
          git config user.email "dudguq@gmail.com"
          git rm .github/workflows/retire-legacy-branches-once.yml
          git commit -m "chore(branches): remove one-shot legacy cleanup workflow"
          git push origin HEAD:main
