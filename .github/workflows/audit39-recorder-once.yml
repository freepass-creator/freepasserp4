name: audit39 recorder once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit39-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit39 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Recorder'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if ! grep -q '2026-09-18(39)' docs/AI-SSOT-AUDIT-LOG.md; then
            cat >> docs/AI-SSOT-AUDIT-LOG.md <<'EOF'

