name: audit39 recorder once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit39-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit39 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Recorder'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          AUDIT_B64=''
          CLAUDE_B64=''
          if ! grep -q '2026-09-18(39)' docs/AI-SSOT-AUDIT-LOG.md; then
            printf '\n' >> docs/AI-SSOT-AUDIT-LOG.md
            printf '%s' "$AUDIT_B64" | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          fi
          printf '%s' "$CLAUDE_B64" | base64 -d > CLAUDE-AUDIT.md
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          if git diff --cached --quiet; then
            echo 'audit39 already recorded; nothing to commit'
            exit 0
          fi
          git commit -m 'docs(audit): record audit39 RP031 DOM finance writer boundary'
          git push origin main
