name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 매 push/PR = typecheck + 폰트 토큰 가드 + 도메인 시뮬레이션 + 프로덕션 빌드.
#  다중 도구 동시 작업의 회귀를 자동 차단. 시크릿 불필요(sim=LocalAdapter, build=비운영 CI placeholder).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Font token guard
        run: npm run check:fonts

      - name: Design token guard
        run: npm run check:tokens

      # 상품찾기 격자의 «행 수»가 마크업의 «자식 수»와 어긋나면 목록이 통째로 안 보인다.
      # 타입검사도 빌드도 통과하는 종류라 화면을 열어야만 알 수 있었다 — 2026-08-31~09-01 에 두 번 났다.
      - name: 상품찾기 격자 — 행 수 = 자식 수
        run: npm run check:finder-rows

      # ★★2026-09-06 검수에서 넣었다 — 「확정 규격」을 지키는 자들이 **CI 밖**에 있었다.
      #   check:design(확정 디자인) · check:building(도면) · check:ui(UI 계약)는 만들어 두고
      #   «내가 손으로 돌릴 때만» 돌았다. 그래서 다른 세션·다른 도구가 규격을 되돌려도
      #   CI 는 초록불을 줬다(2026-08-31 커서가 뱃지 규격을 되돌린 그 종류).
      #   ⚠ check:settlement 는 아직 안 건다 — 정산 작업이 main 에 안 들어와 빨간불이다
      #     (scripts/check-settlement-locked.mts 머리말).
      - name: 확정 디자인 — 손님 동 규격이 그대로인가
        run: npm run check:design

      - name: 건물도면 — 새 층·부속실이 등록됐는가
        run: npm run check:building

      - name: UI 계약 — 원자·radius 정합
        run: npm run check:ui

      # ★★2026-09-10 — 사장님 「**버벅이거나 뭐가 안 되거나 막 찜빠 나는 거 같거나 그러면
      #   안 된다고. 착착착착 대야지**」. 같은 날 조건칸 셈이 **292ms** 였는데 게이트·빌드·
      #   타입검사가 전부 초록이었다. 굼뜬 것은 **사장님이 먼저 알아채셨다** — 그러면 늦다.
      #   ⚠ 시간(ms)만 재면 못 잡는다. 옛 코드도 이 기계에선 82ms 라 예산을 통과했다.
      #     그래서 「줄 하나당 비싼 칸을 몇 번 열어 보나」를 센다 — 기계가 빠르든 느리든 같은 수다.
      #     실측 — 지금 1.0번 · 옛 코드 14.6번.
      - name: 조건칸이 착착 도는가 — 줄당 한 번만 잰다
        run: npm run check:speed

      # ★★2026-09-10 — 채널 셋(KR오토플랜·카핑·SI오토)을 올리면서 **이 검사를 안 돌렸다.**
      #   카핑 간판이 흰 바탕(RGB)이라 머리띠에서 흰 네모가 드러날 자리였고, 셋 다 카톡 공유
      #   미리보기 그림(og-*.png)이 없었다. 게이트·빌드·타입검사는 전부 초록이었다.
      #   사장님 「CI 정렬 이야기 한 거는??」 — 규격(투명·여백 0)을 적어 두고 «기계가 안 보고» 있었다.
      #   ⇒ 채널은 앞으로 여럿 늘어난다(사장님 「여러 개를 좀 만들 거야」). 사람 눈에 맡기지 않는다.
      - name: 채널 간판 — 투명 배경 · 여백 0 · 공유 미리보기
        run: npm run check:brand

      # ★워크플로 자신이 «읽히는가». 2026-09-08 에 한 줄(흐름형 안의 맨몸 ${{ }})로
      #   판매·ERP 시간별 동기가 첫 커밋부터 한 번도 안 돌았다 — 로그도 안 남는 종류의 고장이다.
      - name: 워크플로가 «읽히는가»
        run: npm run check:workflows

      - name: 예약 지도 — 도는 예약이 모두 지도에 있는가
        run: npm run check:schedules

      - name: ERP4·ERP5가 같은 Firebase를 쓰는가
        run: npm run check:erp5-firebase

      # ★2026-09-16 — 이 자는 CI 에 걸려 있지 «않았다». 그래서 자가진단이 깨진 채로
      #   「검사기 고장」을 외치며 exit 1 을 내고 있었는데 아무도 몰랐다.
      #   그 뒤에 진짜 사실이 숨어 있었다 — RTDB 직접 여는 파일이 24 → 0 이 됐는데
      #   기준이 24 로 남아 있어, 23 개를 새로 만들어도 통과하는 상태였다.
      #   ⇒ 안 걸린 검사기는 «없는 것»과 같다. 걸어 둔다.
      - name: RTDB 스왑점 밖 직접 열기
        run: npm run check:store

      # 견적·원가 «계산» 규칙. 법정 자동차세 경계 · 전기차 감면 · 배기량 · 손바뀜 · 위약금 · 잔가.
      # 정본 = docs/견적-원가-로직.md (사장님 2026-09-07 「로직을 확실하게 박아서 가자」)
      - name: 견적 로직 — 법정값·원가 갈래가 그대로인가
        run: npm run check:estimate

      - name: 견적 회귀 — 엑셀 대조 39건
        run: npm run test:estimate

      # 브라우저가 공급사 시트를 직접 읽으면 대수가 두 군데서 세어진다(2026-09-01 582→694).
      - name: 화면이 시트를 직접 읽지 않는가
        run: npm run check:no-client-sheet-live-status

      # ★★2026-09-16 — 출시 게이트 둘도 CI 밖에 있었다. 바로 위 check:store 와 같은 무늬다:
      #   «CI 에 안 걸린 검사기는 「없는 것」과 같고, 고장나도 아무도 모른다».
      #   실제로 check:release 는 없는 파일을 읽다 ENOENT 로 죽어 리포트를 «한 줄도» 못 냈고,
      #   check:b2b-release 는 필수 파일 목록의 한 줄 때문에 내용 검사 11건이 «한 번도 실행된 적이
      #   없었다». 둘 다 9267a34e 에서 되살렸으니 이제 기계가 보게 둔다.
      - name: 출시 게이트 — 약관·오류복구·보안 정적 검사
        run: npm run check:release
        # 이 게이트의 env 검사는 «운영에 값이 들어 있나»를 본다 — CI 에는 운영 값이 없고 있어서도
        # 안 된다. 위 Production build 와 같은 관례로 형식만 유효한 placeholder 를 준다.
        # 그러면 env 검사는 CI 에서 무의미해지지만, 이 파일의 «나머지 정적 검사 20여 건»이 돈다.
        # 출시 직전에는 실제 운영 값으로 사람이 한 번 더 돌린다 — 그 판정은 CI 가 대신하지 않는다.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
          NEXT_PUBLIC_OPERATOR_COMPANY: ci-placeholder
          NEXT_PUBLIC_OPERATOR_CEO: ci-placeholder
          NEXT_PUBLIC_OPERATOR_ADDRESS: ci-placeholder
          NEXT_PUBLIC_OPERATOR_BIZ_NO: 000-00-00000
          NEXT_PUBLIC_OPERATOR_EMAIL: ci@ci.invalid
          NEXT_PUBLIC_OPERATOR_PRIVACY_OFFICER: ci-placeholder

      # ★b2b 쪽은 placeholder 로 «못» 채운다 — 요구하는 값에 Drive refresh token 과 서비스계정
      #   private key 가 있다. CI 에 그 모양의 가짜값을 심으면 게이트가 거짓 통과를 낸다.
      #   그래서 --code-only 로 «저장소 안에서 판단 가능한 코드 계약»만 돌린다(실측 PASS 24 · FAIL 0).
      #   env 20건과 후보 Rules 4건은 SKIP 으로 출력에 남고, 출시 직전 인자 없이 돌릴 때 검사된다.
      - name: B2B 출시 게이트 — 코드 계약(브리지 폐기·claim·fail-closed)
        run: npm run check:b2b-release -- --code-only

      - name: Sim — 시트 병합(soft-merge·락 보호)
        run: npx tsx scripts/sim-sheet-merge.mts

      - name: Sim — 차량 락(선점·해제·재선점·경쟁·삭제보호)
        run: npx tsx scripts/sim-vehicle-lock.mts

      - name: Sim — 3자 정산 E2E(공급등록→계약→정산→월정산)
        run: npx tsx scripts/sim-e2e-settlement.mts

      - name: Sim — 출시 차단(0원 정산·역할 미지정)
        run: npx tsx scripts/sim-release-blockers.mts

      - name: Production build
        run: npm run build
        # Next production build는 필수 공개 Firebase 설정이 없으면 의도적으로 실패한다.
        # CI는 외부 연결을 실행하지 않으므로 운영 시크릿 대신 형식만 유효한 placeholder를 사용한다.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://ci-placeholder-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
