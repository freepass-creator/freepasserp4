name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 매 push/PR = typecheck + 폰트 토큰 가드 + 도메인 시뮬레이션 + 프로덕션 빌드.
#  다중 도구 동시 작업의 회귀를 자동 차단. 시크릿 불필요(sim=LocalAdapter, build=비운영 CI placeholder).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Font token guard
        run: npm run check:fonts

      - name: Design token guard
        run: npm run check:tokens

      # 상품찾기 격자의 «행 수»가 마크업의 «자식 수»와 어긋나면 목록이 통째로 안 보인다.
      # 타입검사도 빌드도 통과하는 종류라 화면을 열어야만 알 수 있었다 — 2026-08-31~09-01 에 두 번 났다.
      - name: 상품찾기 격자 — 행 수 = 자식 수
        run: npm run check:finder-rows

      # ★★2026-09-06 검수에서 넣었다 — 「확정 규격」을 지키는 자들이 **CI 밖**에 있었다.
      #   check:design(확정 디자인) · check:building(도면) · check:ui(UI 계약)는 만들어 두고
      #   «내가 손으로 돌릴 때만» 돌았다. 그래서 다른 세션·다른 도구가 규격을 되돌려도
      #   CI 는 초록불을 줬다(2026-08-31 커서가 뱃지 규격을 되돌린 그 종류).
      #   ⚠ check:settlement 는 아직 안 건다 — 정산 작업이 main 에 안 들어와 빨간불이다
      #     (scripts/check-settlement-locked.mts 머리말).
      - name: 확정 디자인 — 손님 동 규격이 그대로인가
        run: npm run check:design

      - name: 건물도면 — 새 층·부속실이 등록됐는가
        run: npm run check:building

      - name: UI 계약 — 원자·radius 정합
        run: npm run check:ui

      # 견적·원가 «계산» 규칙. 법정 자동차세 경계 · 전기차 감면 · 배기량 · 손바뀜 · 위약금 · 잔가.
      # 정본 = docs/견적-원가-로직.md (사장님 2026-09-07 「로직을 확실하게 박아서 가자」)
      - name: 견적 로직 — 법정값·원가 갈래가 그대로인가
        run: npm run check:estimate

      - name: 견적 회귀 — 엑셀 대조 39건
        run: npm run test:estimate

      # 브라우저가 공급사 시트를 직접 읽으면 대수가 두 군데서 세어진다(2026-09-01 582→694).
      - name: 화면이 시트를 직접 읽지 않는가
        run: npm run check:no-client-sheet-live-status

      - name: Sim — 시트 병합(soft-merge·락 보호)
        run: npx tsx scripts/sim-sheet-merge.mts

      - name: Sim — 차량 락(선점·해제·재선점·경쟁·삭제보호)
        run: npx tsx scripts/sim-vehicle-lock.mts

      - name: Sim — 3자 정산 E2E(공급등록→계약→정산→월정산)
        run: npx tsx scripts/sim-e2e-settlement.mts

      - name: Sim — 출시 차단(0원 정산·역할 미지정)
        run: npx tsx scripts/sim-release-blockers.mts

      - name: Production build
        run: npm run build
        # Next production build는 필수 공개 Firebase 설정이 없으면 의도적으로 실패한다.
        # CI는 외부 연결을 실행하지 않으므로 운영 시크릿 대신 형식만 유효한 placeholder를 사용한다.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://ci-placeholder-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
