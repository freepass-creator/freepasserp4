name: 이안카 로그인 실제 시도(헤드리스, 수동)

# scripts/diag-ianka-login-playwright.mts — 실제 로그인 폼을 헤드리스 브라우저로 제출해서
# 어떤 요청/쿠키가 뜨는지 본다. 비밀번호는 로그에 안 찍는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 이안카 로그인 실제 시도
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-login-playwright.mts
