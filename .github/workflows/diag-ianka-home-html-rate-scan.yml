name: 이안카 홈 HTML 원본 요금 스캔(읽기전용, 수동)

# scripts/diag-ianka-home-html-rate-scan.mts — 응답 헤더의 Vary: RSC로 이 사이트가
# 진짜 Next.js RSC 서버임을 확인했다. 610KB짜리 홈 HTML 원본 자체에서 요금 패턴을
# 직접 스캔한다(지금까지는 __next_f 청크만 봤다).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 홈 HTML 원본 요금 스캔
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-home-html-rate-scan.mts
