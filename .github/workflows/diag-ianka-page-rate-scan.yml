name: 이안카 페이지 RSC 요금 스캔(읽기전용, 수동)

# scripts/diag-ianka-page-rate-scan.mts — /api/... 문자열 스캔이 아니라, 실제 차량 상세
# 페이지의 HTML/RSC 인라인 데이터(self.__next_f.push) 안에 요금이 박혀있는지 찾는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 페이지 RSC 요금 스캔
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-page-rate-scan.mts
