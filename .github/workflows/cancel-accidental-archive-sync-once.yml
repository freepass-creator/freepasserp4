name: Cancel accidental archive sync once

on:
  push:
    paths:
      - '.github/workflows/cancel-accidental-archive-sync-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Cancel accidental archive-triggered production sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel.out -w '%{http_code}' \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/36233075541/cancel")
          cat /tmp/cancel.out || true
          case "$code" in
            202|409) exit 0 ;;
            *) echo "Unexpected cancel response: $code" >&2; exit 1 ;;
          esac
      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freepass-creator"
          git config user.email "dudguq@gmail.com"
          git rm .github/workflows/cancel-accidental-archive-sync-once.yml
          git commit -m "chore(actions): remove one-shot archive sync cancellation"
          git push origin HEAD:main
