name: ERP5 SSOT 원천 최신화(매시간)

# 원천은 계속 바뀌고, 차량 원문 이력은 보존한다.
# 검증된 기존 원자의 가변값과 상태만 자동 갱신하며 새 차번은 후보로 보고한다.
# 한 회차가 읽은 ERP5 스냅샷 하나로 판매시트를 발행한다.
on:
  schedule:
    # 월~토 KST 09:17~19:17
    # ★2026-09-18 — :05 에서 :17 로 옮긴다. 실측: 하루 11회 기대인데 09-15 3 · 09-16 1 · 09-17 1(23:47, 창 밖)
    #   · 09-18 은 09:05 회차가 12:53 에 왔다. GitHub 문서: 예약은 부하가 몰리는 «매시 정각 무렵» 에
    #   늦어지거나 빠질 수 있다. :05 는 그 한복판이다. 분만 옮기고 회차 수·단계·고정 엔진은 그대로다.
    - cron: '17 0-10 * * 1-6'
  # 정산 접수→원장 성공 직후 같은 canonical refresh를 이어서 실행한다.
  # manual preview(workflow_dispatch)는 upstream event 판별이 불가능하므로 자동 체인 대상에서 제외한다.
  workflow_run:
    workflows: ["정산 접수→원장(1시간)"]
    types: [completed]
  # upstream workflow_run 자체가 누락될 때 watchdog이 이 파일만 갱신해 같은 canonical 엔진을 실행한다.
  push:
    branches: [main]
    paths:
      - '.automation/heartbeats/erp5-ssot-refresh.txt'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 ERP5와 판매시트에 반영'
        type: boolean
        default: false

concurrency:
  group: erp5-inventory-publish
  cancel-in-progress: false

jobs:
  refresh:
    # upstream 정산은 schedule 또는 heartbeat push가 성공했을 때만 production chain을 이어간다.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push')) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 검증된 ERP5 SSOT 엔진 고정
        uses: actions/checkout@v4
        with:
          # 원천·판매시트·공개 카탈로그 대사를 같은 검증 엔진 커밋으로 고정한다.
          # ★2026-09-16 통합 엔진 — gate 엔진(eafbd88e) 위에 하허호 F86(계획 한 벌·감사·백업·되돌리기)·운영 쓰기 문지기·손오공 오공구독 배정을 올린 커밋(claude/f86-on-gate).
          # ★2026-09-16(2) — 그 위에 PR #303(분류/구분 칩 색 3곳 하드코딩 → category-colors.ts 단일출처)을
          #   cherry-pick 한 claude/f86-on-gate-color-ssot 커밋으로 재고정. 데이터/판정 로직은 안 건드리고
          #   조건부서식(글자색)만 고쳤다 — 재고 대수·상태 판정에는 영향 없다.
          # ★2026-09-16(3) — 그 위에 PR #308(F01 발행이 제자리 갱신이라 옛 조건부서식을 지운 적이
          #   없어 「구분」 칸 하나에 101개 쌓였던 것 — 새 회차마다 지우고 다시 쌓게 고침)을 cherry-pick.
          # ★2026-09-16(4) — 긴급 수정 PR #310. (3)의 fields 마스크 문법이 잘못돼(bandedRanges·
          #   conditionalFormats를 properties 안에 잘못 중첩) 400으로 F01 발행 전체가 죽었다
          #   (운영 회차 35042070104 실측). publish-origin-tab.mts가 쓰는 올바른 형제-필드 문법으로 고침.
          # ★2026-09-16(5) — 긴급 재수정. (4)를 claude/f86-on-gate(=(2) 이전 가지)에서 다시 딴
          #   실수로 (2)의 색 SSOT 수정이 빠져 있었다 — 「구분」 칸이 옛 헥스(FF00FF 등)로 되돌아간 채
          #   조건부서식만 4개로 깔끔해진 상태였다(실측). claude/f86-on-gate-color-ssot(=(2)) 위에
          #   (3)+(4)를 다시 cherry-pick해 세 수정을 한 줄로 합쳤다.
          # ★2026-09-16(6) — 사장님 「정시 적용도 되고 즉시적용도 되게 해줘야지 그게 다르면 안되지」.
          #   (5) 위에 오늘 확정한 F86 표시 규격 다섯을 올린 claude/f86-peer-spec-transplant 로 재고정.
          #   ㉠ 「구분」·「배차상태」 = F01 과 같은 값별 색표(GUBUN_INK·STATE_INK) — F86 회사탭 옛 단색 폐기
          #   ㉡ F86 공지사항 탭 없음 · 「종합」이 맨 앞(index 0)
          #   ㉢ 탭 이름 = 「종합」만 시각 + 대수, 회사 탭은 「회사 · N대」(전 탭 시각 박기 폐기)
          #   ㉣ 장기 요금 없는 차도 싣고 요금 칸만 빈 채(안 싣기 폐기)
          #   ㉤ 하이픈류 단독 값(-·－·—)도 「미입력」 — atomDisplayResult 한 곳(missing-value-display.ts)
          #   ⚠ 이 커밋 전까지 정시 회차가 옛 엔진으로 위 다섯을 매시 되돌려, 사장님이 하루 동안
          #     「고쳤는데 또 돌아왔다」를 반복해 보셨다. 정시=즉시를 맞추는 자리는 «이 ref» 하나다.
          #   실측: 308511563d 를 조상으로 포함(전진만 · #303·#308·#310 유지) · check:f86 통과 ·
          #     이 커밋에서 F01·F86 수동 발행해 라이브 검증(탭·색·미입력·0km 구분).
          # ★2026-09-16(7) — 사장님 「미입력은 좀 색깔이 회색이어야지」·「연하게 미입력으로 가야지」.
          #   ㉥ 「미입력」·「해당없음」 = 연한 회색(MISSING_INK B7B7B7) — 표 전체에 조건부서식 한 줄.
          #     배차상태 회색(999999)보다 한 단계 연하게 둔다(「못 파는 차」와 「값 없는 칸」을 가른다).
          #     「없음」(옵션 명시적 없음 = 업무 값)은 안 눕힌다.
          # ★2026-09-16(8) — 사장님 「링크 잇는애들은 링크색깔 링크없으면 그냥 색깔 검정색이겟지?」·
          #   「정산원장에 차량번호가 접수에 들어온다는건 계약중으로 바뀐다는거지 그러다가 공급사
          #   원천시트에서 불가가 되거나 삭제되면 출고불가 되는거고」· 「ssot 규격 통일하고 이거 이제 잠그자」.
          #   ㉦ 「차량번호」 고정 링크색 제거 — 링크 있는 줄만 파랑, 없으면 검정(F01 2026-08-19 규칙과 통일)
          #   ㉧ 정산원장 「접수」 → 원자 락(계약중) · 「취소」 → 락 해제(sync-vehicle-lock-from-ledger.mts) ·
          #      ingest 의 「계약중은 원천에서 빠져도 안 내린다」 제거 → 원천 이탈 = 출고불가(계약완료)
          #   ㉨ 색·표시낱말 SSOT 통일 + 잠금(check:color-ssot) — 상품구분 7캐논 전부 색 부여
          #      (빠져 있던 오공구독·오플구독이 시트에서 검정으로 떴다) · MISSING_INK 를 낱말과 한 파일로 ·
          #      정본 밖 헥스 하드코딩을 1084개 파일에서 막는다. check:sync 에 물렸다.
          # ★2026-09-17(9) — 사장님 「차량가격도 입력안된거는 미입력으로 해주고」·「손오공 보증금 ssot에
          #   제대로 반영 안된거 같음」(→「규칙 글자로」)·「ssot에 박아서 누가 업데이트하더라도 바뀌게끔」.
          #   ㉩ 차량가격(소비자가격·consumer_price·msrp) 빈칸도 「미입력」 — 실측 376대 중 188대
          #   ㉪ 손오공 보증금 = 숫자 대신 규칙 글자(「월 대여료 × 약정연수 (최대 3개월)」).
          #      ingest 가 dep3 로 계산해 박던 것을 deposit:0 으로 끊고, API 경로에도 규칙 글자를 붙였다.
          #      이미 박힌 284대는 heal-sonokong-deposit-ssot.mts 로 정정(원자 위반 0 확인).
          #   ㉫ 그 규격을 «발행 문지기»에 박았다 — inventory-contract 에 depositRuleViolations 추가.
          #      규격 어긴 원자로는 스냅샷 캡처·F01·F86 세 곳이 다 멈춘다(누가 되살려도 시트로 못 나간다).
          #   ⚠ 스냅샷 스키마가 바뀌어(카운터 1개) 이전 스냅샷 파일은 무효 — 무결성 검사가 잡는다.
          # ★2026-09-17(10) — 긴급수정. 이 ref로 F86 발행이 2026-09-16 밤부터 8회 연속 실패했다:
          #   salesPublishTabMark()가 초까지 찍어 탭 이름에 콜론이 둘(예 10:05:11) 들어갔고,
          #   그 이름을 싱글쿼트로 감싼 A1 범위(`'종합 09.17 10:05:11 · 391대'!A1`)를 Sheets API가
          #   "Unable to parse range"로 거부했다(run 35164517528·35165360537·35167771132·
          #   35169013858·35169123131 등). F01 발행기(make-sample-sheet-google.mts titleOf)는 이미
          #   `.replace(/:\d{2}$/, '')`로 초를 잘라 콜론 하나만 남기고 있었다 — F86만 빠져 있었다.
          #   같은 꼴(시:분만)로 맞춘 커밋으로 재고정. 데이터/판정 로직은 안 건드렸다.
          # ★2026-09-18(11) — 사장님 확인: category-colors.ts '분류'.신차렌트가 (2)의 통일 작업에서
          #   공급사시트 쪽 값(B81A8C, 어두운 자주)으로 잘못 골라졌었다. 원래 판매시트 GUBUN_INK
          #   값(FF00FF, 밝은 분홍)으로 되돌리고, 웹 화면(파인더·영업자홈피) 카드 배지도 같은 색을
          #   내게 badges.tsx에 'pink' 톤을 새로 추가했다(예전엔 'blue'로 따로 놀아 시트만 고치면
          #   웹은 안 바뀌는 상태였다). publish-jonghap-tab.mts의 리터럴 FF00FF도 정본 참조로 바꿔
          #   check:color-ssot 위반을 없앴고, channel-retro-skin.ts(회사 탭 배경색, 상품구분과 무관한
          #   우연한 FF00FF 일치)는 그 검사 허용목록에 추가했다. 데이터/판정 로직은 안 건드렸다 —
          #   검증: check:inventory-sources·check:sonokong-options·check:color-ssot 전부 PASS.
          # ★2026-09-18(12) — PR #411을 운영 엔진 계보에 병합한 cf940df6으로 전진.
          #   F86 발행 결과/Atom 의미는 바꾸지 않고, 신선도 감사기가 발행기와 같은 f86TabCarriesMark를
          #   사용하게 해 「종합 MM.DD HH:MM · N대」만 시각, 회사 탭 「회사 · N대」 규격을 그대로 판정한다.
          #   칸·차번·머리글·탭 차례 대조는 유지하고 반례 시험을 check:f86에 연결했다.
          ref: cf940df642edf315adbc6da2b4134fbad53da160
      - name: freepasserp5 OIDC 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110304297079/locations/global/workloadIdentityPools/github-actions/providers/freepasserp4
          service_account: github-inventory-writer@freepasserp5.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: 원천 계약 검사
        run: npm run check:inventory-sources && npm run check:sonokong-options
      # ★2026-09-16 — 다른 워크플로는 준비 블록을 .github/actions/prepare-credentials 로 모았다.
      #   **이 워크플로만 그대로 둔다.** 위 checkout 이 `ref:` 로 옛 커밋을 못 박고 있어서
      #   워크스페이스에 그 커밋의 파일만 깔린다 — 로컬 합성 액션(`uses: ./.github/actions/...`)은
      #   워크스페이스에서 찾으므로 그 옛 커밋에 없는 액션은 「action not found」로 런이 죽는다.
      #   ref 핀을 푸는 날 이 블록도 합성 액션으로 바꾼다.
      - name: 원천 자격증명 준비
        env:
          SHEETS_SA: ${{ secrets.GOOGLE_SA_JSON }}
          SONOGONG: ${{ secrets.SONOGONG_ACCOUNT_JSON }}
        run: |
          test -n "$SHEETS_SA" || { echo '::error::GOOGLE_SA_JSON 누락'; exit 1; }
          test -n "$SONOGONG" || { echo '::error::SONOGONG_ACCOUNT_JSON 누락'; exit 1; }
          mkdir -p tmp/firebase-auth sonokong/lib/wonja
          printf '%s' "$SHEETS_SA" > tmp/firebase-auth/sheets.json
          printf '%s' "$SONOGONG" > sonokong/lib/wonja/.손오공계정.json
      - name: 현재 원천 재수집
        run: node sonokong/scripts/손오공.mjs --조용
      - name: 티카 유료옵션 차량번호·원문 감사
        run: npm run audit:sonokong-tcar-options
      - name: 정산원장 접수·취소를 ERP5 원자 계약락에 반영
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/sync-vehicle-lock-from-ledger.mts --apply
      - name: 원천에서 ERP5 현재 원자 계산
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
          GOOGLE_SHEETS_SUBJECT: pyh@teamjpk.com
        shell: bash
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS+=(--apply --variable --retire)
          fi
          npx tsx scripts/ingest-all-suppliers.mts "${ARGS[@]}"
      - name: ERP5 정책 참조 정합화
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
        run: npx tsx scripts/reconcile-product-policy-references.mts --erp5 --apply
      - name: ERP5 발행 스냅샷 고정
        id: snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
        run: npx tsx scripts/capture-sales-publish-snapshot.mts --erp5 --out=tmp/erp5-sales-publish.json
      - name: ERP5 공개 카탈로그 발행 대사
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply
        env:
          ERP5_FIREBASE_USE_ADC: 'true'
          GOOGLE_CLOUD_PROJECT: freepasserp5
        run: npx tsx scripts/verify-whitelabel-publication.mts --snapshot=tmp/erp5-sales-publish.json --write-receipt
      - name: 동일 스냅샷으로 판매시트 게시
        id: f01
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx scripts/make-sample-sheet-google.mts --main --snapshot=tmp/erp5-sales-publish.json
      # ★사장님 2026-09-16 「한 워크플로가 F01·F86 둘 다」 · 「하허호 시트는 제일 중요하게」 —
      #   스냅샷만 제대로 떴으면 F01 이 실패해도 F86 은 백업 → 발행 → 감사(첫 관문)까지 간다.
      #   운영 F01·F86 쓰기는 이 워크플로 이름으로만 열린다(lib/server/production-sheet-write-gate.ts · docs/예약작업-지도.md).
      - name: 하허호 F86 발행 직전 백업
        id: f86_backup
        if: ${{ always() && steps.snapshot.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply) }}
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/backup-f86.mts --label=run-${{ github.run_id }}
      - name: 동일 스냅샷으로 하허호 F86 게시
        id: f86
        if: ${{ always() && steps.snapshot.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply) }}
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/build-channel-supplier-sheet.mts --채널=하허호 --apply --snapshot=tmp/erp5-sales-publish.json
      - name: 하허호 F86 ↔ 원자 칸 대조·신선도(첫 관문)
        if: ${{ always() && steps.snapshot.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.apply) }}
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/audit-f86-vs-atom.mts --snapshot=tmp/erp5-sales-publish.json --max-age-min=120
      - name: 원자 ↔ F01 ↔ F86 칸 단위 대조
        if: ${{ always() && steps.f01.outcome == 'success' && steps.f86.outcome == 'success' }}
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/audit-sheet-vs-atom.mts --snapshot=tmp/erp5-sales-publish.json
      - name: 차번 셀 사진 링크 대조
        if: ${{ always() && steps.f86.outcome == 'success' }}
        env:
          GOOGLE_SHEETS_APPLICATION_CREDENTIALS: ${{ github.workspace }}/tmp/firebase-auth/sheets.json
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/check-plate-photo-link.mts
      - name: 회차 증거 보존
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: erp5-ssot-snapshot-${{ github.run_id }}
          path: tmp/erp5-sales-publish.json
          if-no-files-found: error
          retention-days: 30
      - name: 자격증명 삭제
        if: always()
        run: rm -rf tmp/firebase-auth sonokong/lib/wonja/.손오공계정.json sonokong/lib/wonja/.손오공토큰.json