name: 이안카 로그인 폼 진단(읽기전용, 수동)

# scripts/diag-ianka-login.mts 를 실행한다. /login 폼 구조만 찍는다 — 실제 로그인은 다음 회차.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 이안카 로그인 폼 진단
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-login.mts
