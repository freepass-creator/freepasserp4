name: One-shot audit 35 typo cleanup

on:
  push:
    paths:
      - '.github/workflows/audit35-fix-typo-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix audit log typo
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          sed -i 's/늦게 도착핔 한 회차/늦게 도착한 한 회차/' docs/AI-SSOT-AUDIT-LOG.md
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md
          git commit -m 'audit: fix audit35 wording typo'
          git push origin HEAD:main
