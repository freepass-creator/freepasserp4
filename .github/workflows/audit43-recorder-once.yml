name: audit43 recorder once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit43-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit43 central log and remove recorder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Audit Recorder'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          marker = '## 2026-09-18(43) — ChatGPT 독립 감사: scheduled event delivery 재정지'
          entry = r'''

---
## 2026-09-18(43) — ChatGPT 독립 감사: scheduled event delivery 재정지 — 선언된 09:00/09:05/10:00/10:05 KST 회차 미생성

**판정: 충돌 / 운영 회귀 — audit (35)의 cadence/timeliness HOLD가 실제 schedule 미생성으로 재확인됨. 원인은 아직 미확정.**

- 2026-09-18 10:21 KST 기준 repository 전체 GitHub Actions `event=schedule` 최신 run은 여전히 ERP5 canonical run `35235961510`이다. 생성 시각은 `2026-09-17T14:47:38Z` = 2026-09-17 23:47:38 KST이고 conclusion은 failure다. 그 뒤 scheduled run이 하나도 생성되지 않았다.
- current main은 여전히 `.github/workflows/mirror-sync.yml`의 `*/30 * * * *`, `.github/workflows/sales-erp-hourly.yml`의 `0 0-9 * * 1-5`, `.github/workflows/erp5-ssot-refresh.yml`의 `5 0-10 * * 1-6`를 선언한다. 금요일인 오늘 10:21 KST까지 sales 09:00/10:00, ERP5 09:05/10:05, mirror 다수 30분 회차가 생성됐어야 하나 repository-wide schedule event가 없다.
- push/manual Actions는 같은 오전에도 실행되고 있으므로 GitHub Actions 전체 중단으로 단정하지 않는다. workflow disabled인지 scheduler delivery 문제인지 정확한 원인은 현재 증거로 확정하지 않는다.
- audit (35)는 run `35235961510` 하나가 전날 23:47 KST에 늦게 출현해 audit (31)의 “schedule 0건”을 부분 해소했지만, 선언된 마지막 slot 19:05보다 4시간 42분 이상 늦어 cadence/timeliness는 HOLD로 남겼다. 다음 영업일 오전에도 선언된 회차가 연속 미생성된 이번 관측은 그 HOLD를 더 강하게 재확인한다.
- canonical production workflow는 계속 pin `9bef7bf0ffd21a96e3098a6f31adf1b1a0258c60`을 checkout한다. 수동 dispatch 성공이나 newest Atom timestamp를 scheduled automation 복구 증거로 사용하면 안 된다.
- PR #403 merge `88b16da5c07a1091eba401540891c41280731408` 이후 이 감사 직전 main `8c520685c47807abf29fbcc23b34f6cf7c730b84`까지 application/business-logic delta는 없고 audit 문서/recorder만 바뀌었다. 따라서 ERP5 registry, F01/F86, Sonogong/AutoPlus special-tab, mirror/RTDB logic 판정은 audit (42)에서 변하지 않았다.
- audit (35) F86 freshness checker, audit (42) RP031 identity/finance boundary, audit (27) Sonogong deposit recurrence, audit (28) vehicle-price lineage, audit (29) sales-tab naming, audit (34) newest-Atom freshness semantics, mirror/sales/settlement/RTDB legacy writer HOLD를 모두 유지한다.

### Claude 구현 Owner에게 넘기는 즉시 지시

1. GitHub workflow enabled 상태와 schedule delivery 자체를 우선 확인한다. 원인이 확인되기 전 코드 원인으로 단정하지 않는다.
2. 복구는 선언 시간대에 실제 `event=schedule` run이 연속 생성되는 것으로만 판정한다. `workflow_dispatch` 성공이나 Atom 최신시각만으로 닫지 않는다.
3. 별도로 audit (35)의 F86 freshness parser/탭명 계약을 current F86 plan과 정렬하고 실제 scheduled canonical full-run green을 증명한다.
4. audit (42)의 RP031 FILLIFEMPTY mitigation은 유지하되 identity/finance provenance가 닫히기 전 `--쓰기`/scheduled writer/production repin을 승인하지 않는다.

상세 근거: `docs/ai-ssot-audit/2026-09-18-chatgpt-audit43-schedule-delivery-regression.md`.

이번 ChatGPT 감사에서는 application code/business logic을 수정하지 않았다.
'''
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              p.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/audit43-recorder-once.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(audit): record audit43 scheduled-delivery regression'
          git pull --rebase origin main
          git push origin main
