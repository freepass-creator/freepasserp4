name: 이안카 계정 시크릿 확인(존재 여부만, 수동)

# IANKA_ACCOUNT_JSON 시크릿이 설정돼 있는지·JSON으로 잘 파싱되는지만 확인한다.
# 값 자체는 절대 로그에 찍지 않는다 — 있음/없음, 형식만 판정.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 시크릿 존재·형식 확인(값은 안 찍음)
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: |
          if [ -z "$IANKA_ACCOUNT_JSON" ]; then
            echo "::error::IANKA_ACCOUNT_JSON 시크릿이 비어있거나 없습니다."
            exit 1
          fi
          echo "✓ IANKA_ACCOUNT_JSON 시크릿 존재 — 길이 ${#IANKA_ACCOUNT_JSON}자"
          echo "$IANKA_ACCOUNT_JSON" | node -e '
            const raw = require("fs").readFileSync(0, "utf8");
            const v = JSON.parse(raw);
            const hasEmail = typeof v.email === "string" && v.email.includes("@");
            const hasPassword = typeof v.password === "string" && v.password.length > 0;
            console.log(`✓ JSON 파싱 성공 — email 필드 ${hasEmail ? "있음(형식 정상)" : "없음/이상"} · password 필드 ${hasPassword ? "있음" : "없음"}`);
            if (!hasEmail || !hasPassword) process.exit(1);
          '
