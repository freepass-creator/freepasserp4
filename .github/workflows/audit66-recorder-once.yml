name: Audit 66 recorder once

on:
  push:
    paths:
      - .github/workflows/audit66-recorder-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      AUDIT66_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append ledger and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 2026-09-19(66) — ChatGPT 독립 감사:'
          if marker not in s:
              s = s.rstrip() + base64.b64decode(__import__('os').environ['AUDIT66_B64']).decode('utf-8') + '\n'
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/AI-SSOT-AUDIT-LOG.md
          git rm .github/workflows/audit66-recorder-once.yml
          git commit -m 'docs(audit): append audit66 to SSOT ledger'
          git pull --rebase origin main
          git push origin HEAD:main
