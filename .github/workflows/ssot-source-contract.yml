name: SSOT Source Contract

on:
  pull_request:
    paths:
      - 'lib/domain/inventory-source-registry.ts'
      - 'scripts/ingest-all-suppliers.mts'
      - 'scripts/ingest-supplier-to-firestore.mts'
      - 'scripts/check-inventory-source-contract.mts'
      - '.github/workflows/erp5-ssot-refresh.yml'
      - '.github/workflows/ssot-source-contract.yml'
      - 'scripts/core-contract/**'
      - 'scripts/check-ai-core-contract-shadow.mts'
      - 'lib/domain/ai-core-contract-shadow.ts'
      - 'contracts/ai-core/**'
  push:
    branches: [main]
    paths:
      - 'lib/domain/inventory-source-registry.ts'
      - 'scripts/ingest-all-suppliers.mts'
      - 'scripts/ingest-supplier-to-firestore.mts'
      - 'scripts/check-inventory-source-contract.mts'
      - '.github/workflows/erp5-ssot-refresh.yml'
      - '.github/workflows/ssot-source-contract.yml'
      - 'scripts/core-contract/**'

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Canonical inventory source contract
        run: npx tsx scripts/check-inventory-source-contract.mts
      - name: AI Core Core Contract shadow
        run: npx tsx scripts/check-ai-core-contract-shadow.mts
      - name: ERP5 Core receipt parser
        run: node scripts/core-contract/test-erp5-ingest-receipt.mjs
