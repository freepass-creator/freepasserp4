name: SSOT Source Contract

on:
  pull_request:
    paths:
      - 'lib/domain/inventory-source-registry.ts'
      - 'scripts/ingest-all-suppliers.mts'
      - 'scripts/ingest-supplier-to-firestore.mts'
      - 'scripts/check-inventory-source-contract.mts'
      - '.github/workflows/erp5-ssot-refresh.yml'
      - '.github/workflows/ssot-source-contract.yml'
      - 'scripts/core-contract/**'
      - 'scripts/check-ai-core-contract-shadow.mts'
      - 'lib/domain/ai-core-contract-shadow.ts'
      - 'contracts/ai-core/**'
  push:
    branches: [main]
    paths:
      - 'lib/domain/inventory-source-registry.ts'
      - 'scripts/ingest-all-suppliers.mts'
      - 'scripts/ingest-supplier-to-firestore.mts'
      - 'scripts/check-inventory-source-contract.mts'
      - '.github/workflows/erp5-ssot-refresh.yml'
      - '.github/workflows/ssot-source-contract.yml'
      - 'scripts/core-contract/**'
      - 'scripts/check-ai-core-contract-shadow.mts'
      - 'lib/domain/ai-core-contract-shadow.ts'
      - 'contracts/ai-core/**'

permissions:
  contents: write

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Canonical inventory source contract
        run: npx tsx scripts/check-inventory-source-contract.mts
      - name: AI Core Core Contract shadow
        run: npx tsx scripts/check-ai-core-contract-shadow.mts
      - name: ERP5 Core receipt parser
        run: node scripts/core-contract/test-erp5-ingest-receipt.mjs
      - name: Workflow contract regression
        run: npm run check:workflows

  audit94-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Audit 94 and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          central = '''

---

## 2026-09-21 — ChatGPT audit (94): 15:05 late recovery; Audit 93 race correction

**판정: RESOLVED(eventual fallback creation) / OPEN(recovery timeliness + native cadence + monitor reconciliation) / WATCH(downstream ERP5 completion) / Audit 90–91 Sonogong semantic skew OPEN.**

- Audit 93 이후 commit `c482761dd7b5aeaaf369033ab5fde1c9814c98a0`의 late recovery가 도착했다. Settlement `35569054709`은 15:34:14 KST `event=push`로 생성되어 15:34:49 KST success였다.
- 따라서 “15:05 fallback이 전혀 없음”은 해소됐지만 논리 slot보다 29m14s 늦고 선언된 20분 grace보다 약 9m14s 초과했다. recovery timeliness/native cadence HOLD는 유지한다.
- Downstream ERP5 `35569097238`은 15:34:51 KST `workflow_run`으로 생성됐고 audit cutoff에는 in-progress였다. Source/auth/collection/settlement-lock은 success, `register_sonogong_current`는 skipped였다. F01/F86/audit 최종 결과는 완료 후 재검증한다.
- `.automation/safe-chain-monitor.json`은 14:05에서 멈춰 완료된 ERP5 `35566458884`을 in-progress/pending으로 기록하고 15:05를 반영하지 않아 reconciliation drift는 OPEN이다.
- Audit 92의 production `c3838708b84527db241f1985c140a3ec6ece6bff` full-green runtime validation은 유지한다. Audit 90–91의 current-main RP012 two-channel+obsolete-HOLD vs production three-bucket/source-specific `계약중` semantics skew도 계속 OPEN이다.
- F01/F86 fixed-snapshot 규칙, Sonogong/AutoPlus special-tab, RP023 RebornCar, retired mirror/sales writers, RTDB/mirror non-canonical boundary는 변경 없다.

Detail: `docs/ai-ssot-audit/2026-09-21-chatgpt-audit94-1505-late-recovery-audit93-race-correction.md`

No application code or business logic was modified by the auditor.
'''
          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          if 'ChatGPT audit (94): 15:05 late recovery' not in text:
              log.write_text(text.rstrip() + central + '\n', encoding='utf-8')

          entry = '''# Claude 실행 오더 — Audit (94) override

최우선 최신 판정: **Audit 93의 “15:05 fallback 미관측”은 이후 late recovery가 도착해 부분 해소됐다. Settlement `35569054709`은 15:34:14 KST `event=push`로 생성되어 success였으나 논리 slot보다 29m14s 늦고 선언된 20분 grace보다 약 9m14s 초과했다. eventual fallback은 RESOLVED지만 recovery timeliness/native cadence는 계속 OPEN이다.**

Downstream ERP5 `35569097238`은 15:34:51 KST `workflow_run`으로 생성됐고 이 override 작성 시점에는 in-progress다. `.automation/safe-chain-monitor.json`은 여전히 14:05에서 멈추고 full-green 종료된 ERP5 `35566458884`을 in-progress/pending으로 저장하므로 monitor reconciliation drift도 OPEN이다.

Audit 92의 production pin `c3838708b84527db241f1985c140a3ec6ece6bff` full-green runtime validation은 유지한다. Audit 90–91 Sonogong semantic skew도 계속 OPEN이다. Production은 RP012 `LOW_SONOKONG_DAILY · LOW_SONOKONG · LOW_TCAR` 3-bucket과 API-source-specific `계약중` 보존/listability를 사용하지만 current-main registry는 `LOW_SONOKONG · LOW_TCAR` + obsolete HOLD이며 Source Contract는 이 parity를 fail-closed로 잠그지 않는다. Production을 stale main에 맞춰 되돌리지 말고 current-main registry/runtime helper/Source Contract를 production truth에 정렬한다.

F01 `상품리스트 · 오공구독 · 픽업구독 · 오플구독`, F86 `상품리스트 · 손오공상품 · 픽업구독 · 오플구독`, same fixed snapshot, RP023 RebornCar, retired mirror/sales writers, RTDB/mirror non-canonical boundary는 유지한다.

Detail: `docs/ai-ssot-audit/2026-09-21-chatgpt-audit94-1505-late-recovery-audit93-race-correction.md`

---

'''
          claude = Path('CLAUDE-AUDIT.md')
          text = claude.read_text(encoding='utf-8')
          if '# Claude 실행 오더 — Audit (94) override' not in text:
              claude.write_text(entry + text, encoding='utf-8')
          PY
          git show 0d86828ad48d3f8c3e052e4af5914303ed3a94be:.github/workflows/ssot-source-contract.yml > .github/workflows/ssot-source-contract.yml
          rm -f .github/workflows/chatgpt-audit94-recorder.yml
          git add -A
          git commit -m "docs(audit): integrate audit 94 late recovery correction"
          git push origin HEAD:main
