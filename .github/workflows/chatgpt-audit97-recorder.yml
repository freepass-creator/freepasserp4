name: ChatGPT Audit 97 Recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit97-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backfill audit ledger and self-remove
        shell: bash
        run: |
          set -euo pipefail
          LOG='docs/AI-SSOT-AUDIT-LOG.md'
          PAYLOAD=''
          if ! grep -Fq 'ChatGPT audit (97)' "$LOG"; then
            printf '%s' "$PAYLOAD" | base64 --decode >> "$LOG"
          fi
          rm -f .github/workflows/chatgpt-audit97-recorder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LOG" .github/workflows/chatgpt-audit97-recorder.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(audit): backfill audits 94-97 ledger'
          git push origin HEAD:main
