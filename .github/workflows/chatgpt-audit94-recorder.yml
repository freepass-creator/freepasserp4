name: ChatGPT Audit 94 Recorder
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-audit94-recorder.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit 94
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-ssot-auditor"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import base64
          from pathlib import Path
          central = base64.b64decode('').decode()
          centry = base64.b64decode('').decode()
          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          t = log.read_text()
          if 'ChatGPT audit (94): 15:05 late recovery' not in t:
              log.write_text(t.rstrip() + central + '\n')
          claude = Path('CLAUDE-AUDIT.md')
          t = claude.read_text()
          if '# Claude 실행 오더 — Audit (94) override' not in t:
              claude.write_text(centry + t)
          PY
          git rm -f .github/workflows/chatgpt-audit94-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md
          git commit -m "docs(audit): integrate audit 94 late recovery correction"
          git push origin HEAD:main
