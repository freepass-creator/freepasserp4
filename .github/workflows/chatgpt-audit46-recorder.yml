name: ChatGPT audit46 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit46-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit46
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -c "import base64,pathlib; p=pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md'); e=base64.b64decode('').decode(); t=p.read_text(encoding='utf-8'); p.write_text(t if '## 2026-09-18(46) —' in t else t+e, encoding='utf-8')"
          git config user.name 'chatgpt-ssot-auditor'
          git config user.email 'noreply@openai.com'
          git add docs/AI-SSOT-AUDIT-LOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(audit): append audit46 staged remediations'
          git push origin HEAD:main
