name: DIAG reborncar photo shape

on:
  push:
    branches:
      - fix/photo-all-sources-20260919
    paths:
      - 'scripts/diag-reborncar-photo-shape.mts'
      - '.github/workflows/diag-reborncar-photo-shape.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes tsx scripts/diag-reborncar-photo-shape.mts
