# 재고 원자가 «언제 것»인지 원자에 직접 물어본다(읽기전용, 수동).
#
# 가게 머리띠의 「⟳ 시각」이 엉뚱한 파이프라인을 가리키던 것을 확인하려고 만든다.
# 화면이 그리는 재고는 freepasserp5/products 인데, 시각은 erp4 의 다른 연동 기록에서 왔다.
# 이 진단은 ERP5 원자에 찍힌 `_var_polled_at`·`_direct_ingest_at` 를 세어 실제 나이를 보고,
# 운영 화면이 보여 주는 시각과 맞대 본다. **아무것도 쓰지 않는다.**
name: ERP5 재고 원자 신선도 진단(읽기전용, 수동)

on:
  workflow_dispatch:

concurrency:
  group: erp5-freshness-diag
  cancel-in-progress: false

jobs:
  diag:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ★열쇠를 파일로 들고 다니지 않는다 — erp5-ssot-refresh 와 같은 workload identity 다.
      - name: freepasserp5 OIDC 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110304297079/locations/global/workloadIdentityPools/github-actions/providers/freepasserp4
          service_account: github-inventory-writer@freepasserp5.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: 원자 신선도 읽기
        env:
          GOOGLE_CLOUD_PROJECT: freepasserp5
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/diag-erp5-atom-freshness.mts
