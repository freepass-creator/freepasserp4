name: ChatGPT audit38 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_chatgpt-audit38-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append audit38 and self-remove
        shell: bash
        env:
          AUDIT_B64: 
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          if ! grep -q '2026-09-18(38)' docs/AI-SSOT-AUDIT-LOG.md; then
            printf '%s' "$AUDIT_B64" | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          fi
          rm -f .github/workflows/_chatgpt-audit38-recorder.yml
          git add docs/AI-SSOT-AUDIT-LOG.md .github/workflows/_chatgpt-audit38-recorder.yml
          git commit -m 'audit: append audit38 RP031 browser inventory provenance'
          git push origin HEAD:main
