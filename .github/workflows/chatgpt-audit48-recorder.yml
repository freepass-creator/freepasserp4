name: ChatGPT audit48 recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit48-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit48
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          import base64, pathlib
          log = pathlib.Path('docs/AI-SSOT-AUDIT-LOG.md')
          entry = base64.b64decode('').decode('utf-8')
          text = log.read_text(encoding='utf-8')
          if '## 2026-09-18(48) —' not in text:
              log.write_text(text + entry, encoding='utf-8')
          detail = pathlib.Path('docs/ai-ssot-audit/2026-09-18-chatgpt-audit48-schedule-pr410-merged.md')
          detail.parent.mkdir(parents=True, exist_ok=True)
          detail.write_text(base64.b64decode('').decode('utf-8'), encoding='utf-8')
          pathlib.Path('CLAUDE-AUDIT.md').write_text(base64.b64decode('').decode('utf-8'), encoding='utf-8')
          PY
          git config user.name 'chatgpt-ssot-auditor'
          git config user.email 'noreply@openai.com'
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-18-chatgpt-audit48-schedule-pr410-merged.md CLAUDE-AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(audit): record audit48 schedule merge state'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
