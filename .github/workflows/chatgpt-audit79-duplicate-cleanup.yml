name: ChatGPT audit 79 duplicate cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit79-duplicate-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove accidental duplicate audit 79 block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '\n---\n\n## 2026-09-20 — ChatGPT audit (79): stale audit-78 central-ledger-gap claim corrected\n'
          i = text.find(marker)
          if i >= 0:
              p.write_text(text[:i].rstrip() + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/chatgpt-audit79-duplicate-cleanup.yml
          git config user.name "chatgpt-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/AI-SSOT-AUDIT-LOG.md
          git commit -m "docs(audit): remove accidental duplicate audit 79 block"
          git push origin HEAD:main
