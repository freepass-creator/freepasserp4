name: ChatGPT audit 29 docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit29-docs-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record audit 29 docs only
        shell: bash
        env:
          AUDIT_B64: ''
          DETAIL_B64: ''
          OVERRIDE_B64: ''
        run: |
          printf '%s' "$AUDIT_B64" | base64 -d >> docs/AI-SSOT-AUDIT-LOG.md
          printf '%s' "$DETAIL_B64" | base64 -d > docs/ai-ssot-audit/2026-09-17-chatgpt-audit29-sales-tab-kind-staging.md
          printf '%s' "$OVERRIDE_B64" | base64 -d > /tmp/audit29-override
          cat CLAUDE-AUDIT.md >> /tmp/audit29-override
          mv /tmp/audit29-override CLAUDE-AUDIT.md
          rm -f .github/workflows/chatgpt-audit29-docs-once.yml
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'noreply@openai.com'
          git add docs/AI-SSOT-AUDIT-LOG.md docs/ai-ssot-audit/2026-09-17-chatgpt-audit29-sales-tab-kind-staging.md CLAUDE-AUDIT.md .github/workflows/chatgpt-audit29-docs-once.yml
          git commit -m 'audit: record staged sales-tab SSOT transition'
          git push origin HEAD:main
