name: Production Deploy Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/deploy-production.trigger"
  workflow_dispatch:
    inputs:
      repair_alias:
        description: "검증된 deployment를 freepasserp.com / www alias에 다시 연결"
        required: false
        default: false
        type: boolean

concurrency:
  group: freepasserp4-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 배포 자격 확인
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ] && [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK 또는 VERCEL_TOKEN 중 하나가 필요합니다."
            echo "::error::권장: Vercel Deploy Hook URL을 GitHub secret VERCEL_DEPLOY_HOOK 으로 등록하세요."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: main 상태 확인
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Deploy Hook 강제 재배포
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: |
          echo "Deploy Hook으로 main production 재배포 요청"
          curl --fail-with-body --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
          npm run deploy:verify

      - name: Vercel 프로젝트 연결
        if: env.VERCEL_DEPLOY_HOOK == '' && env.VERCEL_TOKEN != ''
        run: npx vercel link --yes --project freepasserp4 --scope freepass-projects --token "$VERCEL_TOKEN"

      - name: CLI 강제 production 배포 + 운영 SHA 검증
        if: env.VERCEL_DEPLOY_HOOK == '' && env.VERCEL_TOKEN != ''
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.repair_alias || false }}" = "true" ]; then
            npm run deploy:prod -- --repair-alias
          else
            npm run deploy:prod
          fi

      - name: 배포 증거
        if: always()
        run: |
          echo "expected_sha=$(git rev-parse --short=7 HEAD)"
          echo "production=https://freepasserp.com"
          echo "production_www=https://www.freepasserp.com"
