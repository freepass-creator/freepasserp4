name: SSOT live source gate

on:
  push:
    branches: [main]
    paths:
      - 'lib/adapters/**'
      - 'lib/domain/supplier-adapter.ts'
      - 'scripts/ssot-prepublish-gate.mts'
      - 'scripts/test-ssot-adapters.mts'
      - '.github/workflows/ssot-live-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssot-live-source-gate
  cancel-in-progress: true

jobs:
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Google 읽기 자격증명 준비
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SA" || { echo '::error::GOOGLE_SA_JSON 시크릿이 없습니다.'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json

      - name: 어댑터 회귀검사
        run: npx tsx scripts/test-ssot-adapters.mts

      - name: 현재 F01 발행 예정표 생성 — read only
        run: npx tsx scripts/publish-origin-tab.mts --dump=tmp/prepublish-main.json

      - name: 실제 원천 → ADAPTER → ATOM → 발행 예정값 대조
        # ★2026-09-16 — --only=IANKA,IRON. 오토플러스(RP023)·손오공(RP012)은 일반 상품리스트
        #   덤프(prepublish-main.json)에 애초에 실리지 않는다(각자 「오플구독」·「오공구독/픽업구독」
        #   전용 탭을 쓰기 때문 — sonogong-autoplus-tab-routing.md 확정, publish-origin-tab.mts의
        #   EXCLUDE 규칙이 실제로 뺀다). 그래서 이 둘을 SUPPLIER_SOURCES 기본값 그대로 이 덤프와
        #   대조하면 "0건 매칭"이 나서 매번 하드 실패한다 — 데이터 사고가 아니라 게이트가 틀린 덤프와
        #   비교한 것이다(docs/AI-SSOT-AUDIT-LOG.md 2026-09-16(3) B-1).
        #   전용탭 대상 게이트(오플구독/오공구독 덤프 대조)는 아직 없다 — 새로 만들지 않고 이 자리에
        #   남긴다. 다음에 만들 사람은 이 커밋과 위 감사로그 항목을 먼저 본다.
        run: npx tsx scripts/ssot-prepublish-gate.mts --dump=tmp/prepublish-main.json --only=IANKA,IRON
