name: One-time audit 26 append

on:
  push:
    paths:
      - '.github/workflows/audit26-append-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append audit 26 and refresh Claude entry point
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          marker = '## 2026-09-17(26)'
          entry = r'''

          ---

          ## 2026-09-17(26) — ChatGPT 독립 감사: F86 publish failure 원인 확정 — 보증금 SSOT는 정상, values A1 addressing에서 400

          **판정: audit (25)의 원인 미확정 OPEN을 구체화. 손오공 보증금 SSOT/gate는 정상이며, 현재 blocker는 validated F86의 values write-addressing runtime failure다.**

          - Actions run `35169123131`, job `105036728879`의 전체 로그를 독립 재확인했다. checkout은 production pin `6a6f3f75c065143ad14286d08baa28e382535eea`다.
          - Sonogong heal 결과는 **RP012 692대 중 고칠 차 0대**, `보증금 숫자가 남은 차 0대`, `규칙 글자가 다른 차 0대`였다. live Atom의 규칙 글자 정본은 `월 대여료 × 약정연수 (최대 3개월)`이며, 따라서 이번 failure를 deposit-rule regression으로 보면 안 된다.
          - 같은 run의 snapshot/deposit publication gate는 **PASS**했다. snapshot `20260917010511539-16123390d345`, 등록 1,615 / 출고불가 861 / 현재 재고 754. F86 backup도 PASS했다.
          - F86 plan은 754대(`상품리스트 391 · 오공구독 51 · 픽업구독 251 · 오플구독 61`)를 만들고 locked-format 검사와 수동 production-write approval까지 통과했다.
          - 실제 실패 지점은 `scripts/build-channel-supplier-sheet.mts`의 `values:batchUpdate`다. 정확한 Google Sheets 오류는 **HTTP 400 `INVALID_ARGUMENT`: `Invalid data[0]: Unable to parse range: '종합 09.17 10:05:11 · 391대'!A1`** 이다. 그 결과 F86 audit은 skipped됐다.
          - production builder는 탭의 structural/format `batchUpdate`를 먼저 보내고, 이후 동적 `title` 문자열로 `'<title>'!A1` range를 만들어 values batch를 보낸다. 따라서 Claude 구현 Owner가 고칠 대상은 **F86 summary/tab A1 addressing과 write ordering/원자성**이며, deposit gate를 완화하거나 되돌리는 것이 아니다.
          - 운영 F86 불변 ID `1hQtshpWKL4L0zSR3H3UQ36atICtHv9Ka7dQh7d7K5Vg`를 read-only로 확인한 현재 summary tab은 `종합 09.17 10:05:01 · 391대`이고 A1:H5가 정상 데이터로 채워져 있다. 실패 run이 시도한 `10:05:11` title은 live에 남아 있지 않으므로, 이번 증거만으로 failed run이 live sheet를 blank/corrupt했다고 단정하지 않는다. 다만 validated `10:05:11` snapshot이 정상 publish+audit까지 완료되지 않은 것은 확정이다.
          - audit (22)의 main-vs-production deposit-policy 이중정의, audit (23)의 F86 freshness checker contract drift, canonical ERP5 workflow disabled, one-time F86 writer ownership, legacy sales/mirror/settlement/credential/RP023 mirror/pickup-color HOLD는 직접 해소 증거가 없어 유지한다.

          Claude 구현 Owner 우선순위: (1) F86 summary/tab values range addressing 및 structural-before-values 비원자성 정리, (2) backup → publish → F86 audit/cross-audit까지 green 증명, (3) 성공 후 one-time writer retire/remove 또는 명시적 ownership 정리. **보증금 gate는 유지한다.**

          상세 근거: `docs/ai-ssot-audit/2026-09-17-chatgpt-audit26-f86-range-addressing.md`.

          이번 ChatGPT 감사에서는 application code/business logic을 수정하지 않았다.
          '''
          if marker not in text:
              entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines())
              log.write_text(text + entry + '\n', encoding='utf-8')

          evidence = Path('docs/ai-ssot-audit/2026-09-17-chatgpt-audit26-f86-range-addressing.md')
          if not evidence.exists():
              evidence.write_text('''# ChatGPT 독립 SSOT 감사 — audit (26): F86 values range addressing failure\n\n검토일: 2026-09-17\n\n## 결론\n\n손오공 보증금 SSOT는 live ERP5 Atom에서 정상이다. run `35169123131`의 F86 실패 원인은 보증금 gate가 아니라 Google Sheets values write 단계의 A1 range addressing failure다.\n\n## 실행 증거\n\n- production checkout: `6a6f3f75c065143ad14286d08baa28e382535eea`\n- Sonogong RP012: 692대, 수정 필요 0대, 숫자 보증금 잔존 0대, 규칙 글자 불일치 0대\n- 규칙 글자: `월 대여료 × 약정연수 (최대 3개월)`\n- snapshot/deposit gate: PASS — `20260917010511539-16123390d345`, 등록 1,615 / 출고불가 861 / 현재 재고 754\n- F86 backup: PASS\n- F86 plan: 754대 = 상품리스트 391 + 오공구독 51 + 픽업구독 251 + 오플구독 61\n- locked format / manual production-write approval: PASS\n- publish: FAIL — HTTP 400 `INVALID_ARGUMENT`, `Invalid data[0]: Unable to parse range: '종합 09.17 10:05:11 · 391대'!A1`\n- F86 audit: skipped\n\n## 코드 경계\n\nproduction `scripts/build-channel-supplier-sheet.mts`는 dynamic tab `title`로 `'<title>'!A1`를 만들어 `values:batchUpdate`에 넘긴다. structural/format `batchUpdate`를 먼저 수행하고 values write를 뒤에 수행하므로, 구현 Owner는 range addressing과 write ordering/원자성을 함께 검토해야 한다. deposit rule/gate는 이번 failure의 원인이 아니므로 완화하지 않는다.\n\n## live read-only 확인\n\n운영 F86 불변 ID의 현재 summary는 `종합 09.17 10:05:01 · 391대`이며 A1:H5가 채워져 있었다. failed run이 시도한 `10:05:11` title은 live에 남아 있지 않았다. 따라서 이 run이 live sheet를 blank/corrupt했다고 단정하지 않으며, 최신 validated snapshot이 정상 publish/audit되지 못했다는 범위로 판정한다.\n\n## 미해소 유지\n\n- main-vs-production deposit-policy 이중정의 (audit 22)\n- F86 freshness checker contract drift (audit 23)\n- canonical ERP5 workflow disabled\n- one-time F86 writer ownership\n- legacy sales/mirror/settlement/credential/RP023 mirror/pickup-color HOLD\n\n이번 감사에서는 application code/business logic을 수정하지 않았다.\n''', encoding='utf-8')

          claude = Path('CLAUDE-AUDIT.md')
          ctext = claude.read_text(encoding='utf-8')
          omarker = '## 최신 override — audit (26)'
          override = r'''## 최신 override — audit (26)

          충돌 시 이 override와 `docs/AI-SSOT-AUDIT-LOG.md` audit (26)를 audit (25) 이하보다 우선한다.

          - audit (25)의 “run `35169123131` publish stderr 원인 확인 필요”는 **해결된 조사 과제**다. 정확한 실패는 Google Sheets values write의 HTTP 400 `INVALID_ARGUMENT`: `Invalid data[0]: Unable to parse range: '종합 09.17 10:05:11 · 391대'!A1`.
          - **손오공 보증금 SSOT는 이 run에서 정상 확인:** RP012 692대, 숫자 보증금 잔존 0대, 규칙 글자 불일치 0대. snapshot/deposit gate도 PASS(등록 1,615 / 출고불가 861 / 현재 재고 754). 보증금 gate를 약화/롤백하지 않는다.
          - F86 backup과 plan/locked-format/manual write approval까지 PASS했지만 values publish에서 멈춰 F86 audit은 skipped. 현재 blocker는 **F86 dynamic summary/tab A1 addressing + structural-before-values write ordering**이다.
          - 운영 F86 read-only 확인상 현재 summary는 `종합 09.17 10:05:01 · 391대`로 데이터가 채워져 있으며 failed `10:05:11` title은 남아 있지 않다. 따라서 live corruption은 단정하지 않고, 최신 validated snapshot 미발행으로 본다.
          - 구현 Owner 우선순위: range/write-order fix → backup/publish/F86 audit/cross-audit green → one-time writer retire/remove/ownership 정리.
          - audit (22) deposit-policy 이중정의, audit (23) freshness checker drift, canonical workflow disabled, legacy settlement/credential/sales/mirror/RP023/pickup-color HOLD는 미해소 유지.

          상세 근거: `docs/ai-ssot-audit/2026-09-17-chatgpt-audit26-f86-range-addressing.md`.

          ---

          '''
          if omarker not in ctext:
              override = '\n'.join(line[10:] if line.startswith('          ') else line for line in override.splitlines())
              claude.write_text(override + ctext, encoding='utf-8')
          PY

          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md docs/ai-ssot-audit/2026-09-17-chatgpt-audit26-f86-range-addressing.md
          git rm .github/workflows/audit26-append-once.yml
          git commit -m 'docs(audit): record F86 range-addressing failure as audit 26'
          git push origin HEAD:main
