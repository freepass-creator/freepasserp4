name: ChatGPT audit49 recorder fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit49-recorder-fix.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record audit49 and clean recorder workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          cat >> docs/AI-SSOT-AUDIT-LOG.md <<'EOF'

          ---
          ## 2026-09-18(49) — ChatGPT 독립 감사: PR #410 병합 뒤 첫 `:17` scheduled evidence 부재

          **판정: 의미 있는 운영 증거 갱신 — code/config 전환은 완료됐지만 cadence 복구는 아직 증명되지 않음.**

          - audit (48)은 PR #410 merge(`9f74933f073f5fdfc94985efa5f9de45ecc3bc71`)로 canonical ERP5 cron이 `5 0-10 * * 1-6` → `17 0-10 * * 1-6`로 바뀐 것까지 확인했다. 당시 첫 post-merge `:17` 회차 전이라 runtime cadence는 HOLD였다.
          - 이번 재검수는 첫 예정 회차인 **2026-09-18 17:17 KST 이후**다. repository-wide `event=schedule`을 다시 조회했지만 최신 schedule run은 여전히 **`35304903901` / 2026-09-18 12:53:42 KST / ERP5 SSOT 원천 최신화(매시간)** 이다. 즉 PR #410 merge 이후 첫 `:17` schedule event가 아직 생성됐다는 증거가 없다.
          - 이 사실만으로 `:17` 변경을 실패로 단정하지 않는다. GitHub scheduled workflow는 지연될 수 있으므로 현재 판정은 **delayed-or-missing / cadence 복구 미증명**이다. 다음 `:17` 회차들이 실제 `event=schedule`로 연속 생성되기 전 punctuality/cadence HOLD를 닫지 않는다.
          - PR #411 F86 freshness checker fix는 여전히 draft/open, merged=false이며 production pin `14892951a929cf03796231f260e6bc2ff3060efc`은 그대로다.
          - canonical registry, F01/F86 규격, Sonogong/AutoPlus special-tab/deposit-policy HOLD, RP031 provenance, RP023 old mirror source, mirror/sales/settlement legacy writer topology에는 새 해소 증거가 없어 기존 판정을 유지한다.

          상세 근거: `docs/ai-ssot-audit/2026-09-18-chatgpt-audit49-first-post-merge-17-schedule-missing.md`

          **Claude 구현 Owner 인계:** PR #410은 code/config 기준 완료로 유지하되 schedule cadence는 아직 OPEN/HOLD. 첫 post-merge `:17` event가 실제 생성되는지와 이어지는 회차의 연속성을 운영 증거로 확인할 것. application code/business logic은 이 감사에서 수정하지 않았다.
          EOF

          cat > CLAUDE-AUDIT.md <<'EOF'
          # ChatGPT → Claude SSOT 감사 진입점 — audit (49) override

          > 이 파일은 구현 지시의 최신 진입점이다. Claude 단일 SSOT 세션만 application/business logic을 수정한다. ChatGPT는 독립 감사·증거 기록만 한다.

          ## 최신 판정

          ### 1) OPEN/HOLD(runtime cadence) — PR #410은 merge됐지만 첫 post-merge `:17` schedule event가 아직 관측되지 않음

          PR #410은 merge되어 canonical ERP5 cron이 현재 `17 0-10 * * 1-6` = 월~토 KST 09:17~19:17이다.

          하지만 audit (49) 재검수는 첫 post-merge 예정 회차인 **2026-09-18 17:17 KST 이후**에 수행했고, repository-wide `event=schedule` 최신 실행은 여전히:

          - run `35304903901`
          - workflow `ERP5 SSOT 원천 최신화(매시간)`
          - created `2026-09-18 12:53:42 KST`
          - head `5088dd5df3882bef43b1cb56c18e1dba5d529888`
          - conclusion `failure` (기존 F86 freshness checker false-positive)

          즉 **`:17` 변경은 code/config 기준 RESOLVED지만 cadence 복구는 아직 증명되지 않았다.** 첫 post-merge `:17` 슬롯은 현재 delayed-or-missing 상태로 본다. GitHub schedule은 지연될 수 있으므로 변경 자체 실패로 단정하지 말고, 실제 `event=schedule` 회차가 생성되고 이어지는 회차도 정상 cadence로 도착하는지 확인할 때까지 HOLD를 유지한다.

          ### 2) RESOLVED(운영 증거) / OPEN(checker) — current production pin full apply는 증명됨, F86 freshness false-positive만 남음

          run `35310163711`은 `workflow_dispatch`, `apply=true`로 production pin `14892951a929cf03796231f260e6bc2ff3060efc`을 실제 checkout해 source 24/24 ingest, Atom, snapshot, public catalog, F01, F86, Atom↔F01↔F86 parity, photo-link audit까지 완료했다. 데이터 발행 parity는 PASS다.

          다만 F86 freshness checker는 current tab naming을 오판해 red다. PR #411 / head `f17747a549cf7857c28932373ada0bfb8eb7d7da`은 계약 정렬안이지만 **여전히 draft/open, merged=false**이고 production pin은 움직이지 않았다.

          **우선순위:** PR #411 review/merge → production pin 전진 + `VALIDATED_ENGINES` 등록 → 실제 apply/scheduled run에서 freshness step green 확인. 차량/칸 parity 검사는 약화하지 않는다.

          ### 3) IMPORTANT topology — F86 freshness step은 downstream cross/photo audit 실행 gate가 아님

          current `erp5-ssot-refresh.yml`은 cross-audit를 F01/F86 publish outcome으로, photo audit를 F86 publish outcome으로 실행하며 freshness step outcome에 의존하지 않는다. run `35310163711`에서도 freshness step failure 뒤 cross/photo audit은 실행되어 success했다.

          ### 4) RESOLVED(code/contract + publisher execution), 색상 특화 runtime 증명 HOLD — 신차렌트 `#FF00FF`

          production pin `14892951...`에는 `신차렌트=#FF00FF` 및 publisher color-SSOT 참조가 포함되고 Source Contract와 full apply 실행이 확인됐다. 다만 Google Sheets `effectiveFormat` 자체를 직접 assert한 color-specific runtime proof는 별도 HOLD다.

          ### 5) OPEN/HOLD — RP031 provenance

          RP031 canonical registry는 계속 Google Sheet(`1fJu...`)다. API inventory + rendered-DOM finance feeder가 canonical Sheet에 실제 write한 crossing은 되돌아가지 않았다. backup↔live diff, identity, finance provenance와 deterministic mapping 증명이 끝나기 전 DOM-derived finance를 독립 authoritative SSOT로 승격하지 않는다.

          ### 6) 기존 HOLD 유지

          직접 해소 증거가 없는 다음 항목은 유지한다.

          - RP023 canonical RebornCar vs legacy `MIRROR_SOURCES` old Google Sheet source.
          - `mirror-sync.yml` 30분 scheduled apply writer.
          - `sales-erp-hourly.yml` 평일 scheduled apply writer.
          - `settlement-sync.yml` legacy ledger→supplier-status writer.
          - audit (22) Sonogong/AutoPlus deposit-policy 이중정의.
          - audit (27) Sonogong deposit recurrence.
          - audit (28) vehicle-price source→Atom lineage.
          - audit (29) sales-tab naming migration.
          - audit (34) newest-Atom freshness semantics.

          ## 현재 기준

          - PR #410 merge: `9f74933f073f5fdfc94985efa5f9de45ecc3bc71`
          - canonical ERP5 schedule: KST `:17`
          - latest observed `event=schedule`: run `35304903901` (pre-`:17` change)
          - current production pin: `14892951a929cf03796231f260e6bc2ff3060efc`
          - full apply evidence: run `35310163711`
          - staged F86 checker PR: #411 / `f17747a549cf7857c28932373ada0bfb8eb7d7da`
          - 상세 근거: `docs/ai-ssot-audit/2026-09-18-chatgpt-audit49-first-post-merge-17-schedule-missing.md`
          - 중앙 로그: `docs/AI-SSOT-AUDIT-LOG.md` → `2026-09-18(49)`

          **구현은 Claude 단일 SSOT 세션만 수행한다.**
          EOF

          git rm -f .github/workflows/chatgpt-audit49-recorder.yml .github/workflows/chatgpt-audit49-recorder-fix.yml
