name: Sheet Contract 표시 전용

on:
  workflow_dispatch:
    inputs:
      target:
        description: Allowlisted spreadsheet
        type: choice
        options: [F01, F86]
        default: F86
      apply:
        description: Apply only after all evidence gates pass
        type: boolean
        default: false
      expected_snapshot_hash:
        description: Exact fresh dry-run snapshot hash (required for apply)
        type: string
        required: false
      expected_revision:
        description: Exact code commit reviewed (required for apply)
        type: string
        required: false
      expected_timestamp:
        description: Exact capturedAt from reviewed dry-run (required for apply)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: erp5-inventory-publish
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Exact contract regression
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/sim-sales-sheet-banner.mts
      - name: Snapshot, preflight, optional narrow apply, readback
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_FORMAT_TARGET: ${{ inputs.target }}
          SHEET_FORMAT_APPLY: ${{ inputs.apply }}
          SHEET_FORMAT_EXPECTED_HASH: ${{ inputs.expected_snapshot_hash }}
          SHEET_FORMAT_EXPECTED_REVISION: ${{ inputs.expected_revision }}
          SHEET_FORMAT_EXPECTED_TIMESTAMP: ${{ inputs.expected_timestamp }}
        run: npx tsx --require ./scripts/lib/server-only-shim.cjs scripts/apply-sheet-contract.mts
      - name: Sanitized evidence and guarded rollback requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-contract-${{ inputs.target }}-${{ github.run_id }}
          path: tmp/sheet-contract/*.json
          if-no-files-found: warn
          retention-days: 7
