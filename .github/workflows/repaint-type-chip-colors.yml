name: 분류 칩 색 재도색(수동)

# scripts/repaint-type-chip-colors.mts 를 실행하는 수동 버튼.
# cron 없음 — 예약이 아니라 GOOGLE_SA_JSON 이 이미 있는 GitHub Actions 안에서
# 한 번 돌리기 위한 것이다(docs/예약작업-지도.md 「스케줄 없이 손으로만 도는 워크플로」 계열).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영(체크 해제 시 dry-run만)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repaint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Google 자격증명 준비
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          test -n "$SA" || { echo '::error::GOOGLE_SA_JSON 시크릿이 없습니다.'; exit 1; }
          mkdir -p tmp/firebase-auth
          printf '%s' "$SA" > tmp/firebase-auth/sa.json

      - name: 분류 칩 색 재도색
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            npx tsx scripts/repaint-type-chip-colors.mts --apply
          else
            npx tsx scripts/repaint-type-chip-colors.mts
          fi
