name: One-shot audit 34 recorder

on:
  push:
    paths:
      - '.github/workflows/audit34-recorder-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append audit 34 and refresh Claude entry point
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          ENTRY_B64 = ""
          PREFIX_B64 = ""
          entry = base64.b64decode(ENTRY_B64).decode('utf-8')
          prefix = base64.b64decode(PREFIX_B64).decode('utf-8')
          log = Path('docs/AI-SSOT-AUDIT-LOG.md')
          text = log.read_text(encoding='utf-8')
          marker = '## 2026-09-17(34) — ChatGPT 독립 감사: ERP5 머리띠 source alignment 개선, newest-Atom freshness의 cohort 오인 위험 HOLD'
          if marker not in text:
              log.write_text(text.rstrip() + entry + '\n', encoding='utf-8')
          claude = Path('CLAUDE-AUDIT.md')
          old = claude.read_text(encoding='utf-8')
          if not old.startswith('# ChatGPT 독립 SSOT 감사 — audit (34) override'):
              claude.write_text(prefix + old, encoding='utf-8')
          wf = Path('.github/workflows/audit34-recorder-once.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit audit-only changes and self-remove recorder
        shell: bash
        run: |
          git config user.name 'freepass-creator'
          git config user.email 'dudguq@gmail.com'
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md .github/workflows/audit34-recorder-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'audit: register audit 34 freshness observability hold'
          git push origin HEAD:main
