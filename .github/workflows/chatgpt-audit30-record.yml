name: ChatGPT audit30 recorder

on:
  push:
    paths:
      - '.github/workflows/chatgpt-audit30-record.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record independent SSOT audit 30
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '2026-09-17(30)' docs/AI-SSOT-AUDIT-LOG.md; then
            printf '\n' >> docs/AI-SSOT-AUDIT-LOG.md
            cat .github/audit30-log-fragment.md >> docs/AI-SSOT-AUDIT-LOG.md
          fi
          if ! grep -q 'audit (30) override' CLAUDE-AUDIT.md; then
            cat .github/audit30-claude-fragment.md CLAUDE-AUDIT.md > /tmp/CLAUDE-AUDIT.md
            mv /tmp/CLAUDE-AUDIT.md CLAUDE-AUDIT.md
          fi
          git rm .github/workflows/chatgpt-audit30-record.yml .github/audit30-log-fragment.md .github/audit30-claude-fragment.md
          git config user.name 'ChatGPT SSOT Auditor'
          git config user.email 'noreply@openai.com'
          git add docs/AI-SSOT-AUDIT-LOG.md CLAUDE-AUDIT.md docs/ai-ssot-audit/2026-09-17-chatgpt-audit30-production-main-f86-lineage.md
          git commit -m 'audit: record F86 production-main lineage drift'
          git push origin HEAD:main
