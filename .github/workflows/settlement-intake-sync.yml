name: 정산 접수→원장(1시간)

# ★사장님 2026-08-25 「깃허브로 반영될수 있게끔 로직 짜봐」.
#   강지수 팀장이 「프리패스 당월 계약접수」에 차번을 올리면 → 정산원장 「접수」로 나른다.
#   재고 계약락/상태는 이 workflow가 직접 쓰지 않는다.
#   매시 :17 canonical ERP5 workflow가 정산원장 「접수/취소」를 읽어 Atom에 반영하고 F01/F86을 발행한다.
#
# ★**접수일은 «그 차번을 처음 본 날»이다.** 이 워크플로가 도는 주기만큼만 정확하다 —
#   그래서 하루 한 번이 아니라 **영업시간에 1시간마다** 돈다. 정산월·수수료가 이 날짜에서 나온다.
#   한 번 박힌 접수일은 다시 안 쓴다(sync-intake-to-ledger 가 «비었을 때만» 적는다).
#
# ★2026-09-19 — 새 workflow identity로 생성. 옛 settlement-sync는 manual-disabled 상태였으므로
#   안전한 ledger-only 자동화를 새 workflow로 등록해 실제 schedule을 살린다.
# ⚠ schedule 은 **기본 브랜치(main)** 에서만 돈다. 이 파일이 main 에 있어야 하고
#   `GOOGLE_SA_JSON` 시크릿이 있어야 한다. main 이 낡으면 옛 코드가 돈다 —
#   실측 2026-08-21: main 이 94커밋 낡아 정제시트 갱신이 30분마다 죽고 있었다.
# ⚠ 쓰기(구글시트)를 한다. 실패를 삼키지 않는다 — Actions 기록에 빨간 불로 남는다.

on:
  schedule:
    # 영업시간 09:05~18:05 KST 매시(UTC 00:05~09:05). 저녁·새벽은 안 돈다 — 그때는 아무도 안 올린다.
    - cron: '5 0-9 * * 1-6'
  # GitHub schedule event가 누락될 때 외부 watchdog이 이 heartbeat 파일만 갱신해 같은 정본 로직을 실행한다.
  # main + 단일 path로 제한해 일반 push가 production write를 만들지 않게 한다.
  push:
    branches: [main]
    paths:
      - '.automation/heartbeats/settlement-intake-sync.txt'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 쓸까(체크 안 하면 미리보기만)'
        type: boolean
        default: false

concurrency:
  # 같은 원장을 두 번이 겹쳐 쓰면 같은 차가 두 줄로 들어간다. 앞엣것이 끝날 때까지 기다린다.
  group: settlement-sync
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 자격증명 놓기
        uses: ./.github/actions/prepare-credentials
        with:
          google-sa-json: ${{ secrets.GOOGLE_SA_JSON }}

      # ① 접수 시트 → 정산원장. 접수일·모델명·공급사·반영·확인을 채운다.
      - name: 접수 시트 반영
        shell: bash
        run: |
          ARGS=()
          SHOULD_APPLY=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.apply }}" = "true" ]; then
            SHOULD_APPLY=true
            ARGS+=(--apply)
          fi

          # 접수 스프레드시트가 아직 한 번도 만들어지지 않은 경우만 자동 복구한다.
          # 다른 오류는 그대로 실패시켜 원인 은폐/오작동을 막는다.
          set +e
          OUT=$(npx tsx scripts/sync-intake-to-ledger.mts "${ARGS[@]}" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"

          if [ "$RC" -eq 0 ]; then
            exit 0
          fi

          if [ "$SHOULD_APPLY" = "true" ] && printf '%s\n' "$OUT" | grep -q 'create-contract-intake-sheet.mts 먼저'; then
            echo '::notice::계약접수 시트가 없어 canonical 규격으로 1회 자동 생성 후 재시도합니다.'
            npx tsx scripts/create-contract-intake-sheet.mts --apply
            npx tsx scripts/sync-intake-to-ledger.mts --apply
            exit 0
          fi

          exit "$RC"

      # ② 계약상태/재고상태는 여기서 직접 쓰지 않는다.
      #    옛 sync-contract-from-ledger.mts는 legacy 「정산」 탭과 공급사 시트를 직접 수정해
      #    canonical ERP5 Atom writer와 충돌했다. canonical :17 회차가 「접수/취소」를 이어받는다.

      # ③ 서식·용어는 값이 아니라 «보이는 방식»이라 매번 다시 세워도 안전하다(멱등).
      #    사람이 손으로 넣은 줄이 옛 서식·옛 말로 들어오는 것을 여기서 바로잡는다.
      - name: 서식·상태 용어 다듬기
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.apply
        run: |
          npx tsx scripts/unify-ledger-state.mts --apply
          npx tsx scripts/format-ledger.mts --apply

      - name: 자격증명 지우기
        if: always()
        uses: ./.github/actions/cleanup-credentials
