name: 이안카 기간별 요금 진단(헤드리스, 수동)

# scripts/diag-ianka-pricing.mts — 로그인 뒤 계약기간(1~60개월) 칩과 차량 상세를 눌러보며
# 요금이 어디서 오는지(어떤 API·화면 값) 본다. 비밀번호는 로그에 안 찍는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 이안카 기간별 요금 진단
        env:
          IANKA_ACCOUNT_JSON: ${{ secrets.IANKA_ACCOUNT_JSON }}
        run: npx tsx scripts/diag-ianka-pricing.mts
      - name: 스크린샷 업로드(진단용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ianka-pricing-screenshots
          path: /tmp/*.png
          if-no-files-found: ignore
          retention-days: 3
